<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DriveVoice - 運転用完全ハンズフリーGemini</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --listen-color: #38bdf8;
            --think-color: #fbbf24;
            --speak-color: #4ade80;
            --error-color: #f87171;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ヘッダー */
        header {
            padding: env(safe-area-inset-top, 16px) 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(11, 15, 25, 0.95) 0%, rgba(11, 15, 25, 0.6) 100%);
            backdrop-filter: blur(10px);
            z-index: 20;
            border-bottom: 1px solid var(--card-border);
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        /* メインビジュアルエリア（運転中ひと目で状況がわかる大画面） */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 16px calc(env(safe-area-inset-bottom, 16px) + 12px) 16px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* コンパクト・ステータスバー（画面上部） */
        .status-bar {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .mini-orb-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mini-orb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #475569, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
        }

        .mini-orb-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
            z-index: 1;
        }

        /* ステータス別の発光・アニメーション */
        .state-idle .mini-orb {
            background: radial-gradient(circle at 35% 35%, #334155, #1e293b);
        }

        .state-listening .mini-orb {
            background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7);
            box-shadow: 0 0 20px var(--primary-glow);
            animation: pulse-listen 1.6s infinite ease-in-out;
        }
        .state-listening .mini-orb-ring {
            border-color: rgba(56, 189, 248, 0.6);
            border-style: solid;
            animation: rotate-ring 6s linear infinite;
        }
        .state-listening .status-bar {
            border-color: rgba(56, 189, 248, 0.4);
        }

        .state-thinking .mini-orb {
            background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            animation: rotate-think 2s infinite ease-in-out;
        }
        .state-thinking .mini-orb-ring {
            border-color: rgba(251, 191, 36, 0.7);
            border-width: 2px;
            animation: rotate-ring 2s linear infinite reverse;
        }
        .state-thinking .status-bar {
            border-color: rgba(251, 191, 36, 0.4);
        }

        .state-speaking .mini-orb {
            background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a);
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.5);
            animation: bounce-speak 0.8s infinite alternate ease-in-out;
        }
        .state-speaking .mini-orb-ring {
            border-color: rgba(74, 222, 128, 0.7);
            border-style: solid;
            animation: rotate-ring 4s linear infinite;
        }
        .state-speaking .status-bar {
            border-color: rgba(74, 222, 128, 0.4);
        }

        .state-error .mini-orb {
            background: radial-gradient(circle at 35% 35%, #f87171, #dc2626);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
        }
        .state-error .status-bar {
            border-color: rgba(248, 113, 113, 0.5);
        }

        @keyframes pulse-listen {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.2); }
        }
        @keyframes rotate-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotate-think {
            0% { transform: rotate(0deg) scale(0.98); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(0.98); }
        }
        @keyframes bounce-speak {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.08); }
        }

        .status-info {
            flex: 1;
            min-width: 0;
        }

        .status-text {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-subtext {
            font-size: 0.8rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* 会話タイムライン（全文字表示エリア） */
        .chat-container {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 8px 4px 16px 4px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .empty-chat {
            margin: auto;
            text-align: center;
            color: var(--text-sub);
            padding: 40px 20px;
        }

        .chat-bubble {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 1.15rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.25s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(2, 132, 199, 0.3) 100%);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-bottom-right-radius: 4px;
            color: #f0f9ff;
        }

        .chat-bubble.model {
            align-self: flex-start;
            background: rgba(23, 32, 54, 0.85);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--speak-color);
            border-bottom-left-radius: 4px;
            color: var(--text-main);
        }

        .bubble-meta {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* リアルタイム入力中（認識中）吹き出し */
        .live-bubble {
            align-self: flex-end;
            max-width: 88%;
            background: rgba(56, 189, 248, 0.12);
            border: 1px dashed rgba(56, 189, 248, 0.5);
            border-radius: 20px 20px 4px 20px;
            padding: 12px 18px;
            color: #7dd3fc;
            font-size: 1.15rem;
            line-height: 1.5;
            font-style: italic;
            word-break: break-word;
            animation: pulse-subtle 1.8s infinite ease-in-out;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* 操作コントロールバー */
        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
            z-index: 20;
            padding-top: 8px;
            flex-shrink: 0;
        }

        .main-btn {
            flex: 1;
            height: 60px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }
        .main-btn:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0b0f19;
            box-shadow: 0 4px 25px rgba(56, 189, 248, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            box-shadow: 0 4px 25px rgba(239, 68, 68, 0.4);
        }

        .btn-clear-chat {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-clear-chat:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 設定モーダル */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 540px;
            max-height: 85vh;
            background: #131b2e;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 20px) 20px;
            overflow-y: auto;
            color: var(--text-main);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .modal-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0b0f19;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }

        .range-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .range-wrap input {
            flex: 1;
            padding: 0;
        }
        .range-val {
            font-size: 0.9rem;
            font-weight: 700;
            width: 48px;
            text-align: right;
            color: var(--primary);
        }

        .btn-save {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0b0f19;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .tip {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 5px;
            line-height: 1.4;
        }

        /* 会話ログモーダル */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-item {
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .history-item.user {
            background: rgba(56, 189, 248, 0.12);
            border-left: 3px solid var(--primary);
            margin-left: 20px;
        }
        .history-item.model {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--speak-color);
            margin-right: 20px;
        }
        .history-time {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="state-idle">

    <!-- ヘッダー -->
    <header>
        <div class="app-title">
            <span>🚗 DriveVoice</span>
            <span class="model-badge" id="displayModelBadge">gemini-1.5-flash</span>
        </div>
        <div class="header-buttons">
            <button class="icon-btn" id="historyBtn" title="会話ログ">📜</button>
            <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <!-- コンパクト・ステータスバー（画面上部・タップで停止/再開可能） -->
        <div class="status-bar" id="statusBar">
            <div class="mini-orb-wrapper">
                <div class="mini-orb-ring"></div>
                <div class="mini-orb" id="orbIcon">🎙️</div>
            </div>
            <div class="status-info">
                <div class="status-text" id="statusText">運転モード停止中</div>
                <div class="status-subtext" id="statusSubtext">「運転開始」を押すとハンズフリー対話が始まります</div>
            </div>
        </div>

        <!-- 会話タイムライン（全文字表示エリア） -->
        <div class="chat-container" id="chatContainer">
            <div class="empty-chat" id="emptyChat">
                <div style="font-size: 2.8rem; margin-bottom: 10px;">🚗 🎙️</div>
                <div style="font-size: 1.15rem; font-weight: 700;">DriveVoice ハンズフリー対話</div>
                <div style="font-size: 0.85rem; color: var(--text-sub); margin-top: 6px;">
                    下の「運転開始」を押すと、声だけで会話できます<br>
                    話した内容とGeminiの回答がすべてここに文字で表示されます
                </div>
            </div>
            <!-- 会話吹き出しがここに追加される -->
            <div id="chatMessages" style="display: flex; flex-direction: column; gap: 14px;"></div>

            <!-- 現在発話中のリアルタイム表示吹き出し -->
            <div class="live-bubble" id="liveBubble" style="display: none;">
                <div class="bubble-meta">ドライバー発話中...</div>
                <div id="liveText"></div>
            </div>
        </div>

        <!-- コントロールボタン -->
        <div class="controls">
            <button class="main-btn btn-start" id="mainActionBtn">
                <span>▶ 運転開始（ハンズフリー）</span>
            </button>
            <button class="btn-clear-chat" id="clearChatBtn" title="会話ログを消去">
                🗑️
            </button>
        </div>
    </main>

    <!-- 設定モーダル -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 設定</h2>
                <button class="icon-btn" id="closeSettingsBtn">✕</button>
            </div>

            <!-- APIキー入力 -->
            <div class="form-group">
                <label for="apiKeyInput">Gemini API Key</label>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." autocomplete="off">
                <div class="tip">※APIキーはこの端末のブラウザ内（LocalStorage）にのみ安全に保存され、外部サーバーへは送信されません。</div>
            </div>

            <!-- モデル選択 -->
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="modelSelect" style="margin-bottom: 0;">使用モデル</label>
                    <button type="button" id="fetchModelsBtn" style="background: none; border: 1px solid rgba(56, 189, 248, 0.4); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">
                        🔄 使えるモデル一覧を取得
                    </button>
                </div>
                <select id="modelSelect">
                    <option value="gemini-1.5-flash">gemini-1.5-flash（公式標準・超安定）</option>
                    <option value="gemini-2.0-flash">gemini-2.0-flash（次世代超高速）</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro（高知能）</option>
                    <option value="custom">カスタム手入力</option>
                </select>
            </div>

            <!-- カスタムモデル名入力（カスタム時のみ表示） -->
            <div class="form-group" id="customModelGroup" style="display: none;">
                <label for="customModelInput">カスタムモデル名</label>
                <input type="text" id="customModelInput" placeholder="例: gemini-1.5-flash">
            </div>

            <!-- 接続テストボタン -->
            <div style="margin-bottom: 18px;">
                <button type="button" id="testApiBtn" style="width: 100%; padding: 12px; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: var(--primary); border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">
                    🔌 APIキーとモデルの接続テスト
                </button>
                <div id="testResult" style="font-size: 0.85rem; margin-top: 10px; line-height: 1.4; word-break: break-all;"></div>
            </div>

            <!-- 無音判定時間（沈黙時間） -->
            <div class="form-group">
                <label>話し終わり判定（無音検知）</label>
                <div class="range-wrap">
                    <input type="range" id="silenceTimeoutInput" min="1.0" max="3.5" step="0.2" value="1.6">
                    <span class="range-val" id="silenceVal">1.6秒</span>
                </div>
                <div class="tip">発言後、この秒数の沈黙があると自動でGeminiに送信されます。</div>
            </div>

            <!-- 読み上げ速度 -->
            <div class="form-group">
                <label>音声読み上げ速度</label>
                <div class="range-wrap">
                    <input type="range" id="speechRateInput" min="0.8" max="1.5" step="0.1" value="1.1">
                    <span class="range-val" id="rateVal">1.1x</span>
                </div>
            </div>

            <button class="btn-save" id="saveSettingsBtn">設定を保存</button>
        </div>
    </div>

    <!-- 会話ログモーダル -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 今回の会話ログ</h2>
                <div style="display: flex; gap: 8px;">
                    <button class="icon-btn" id="clearHistoryBtn" title="履歴消去" style="font-size: 1rem;">🗑️</button>
                    <button class="icon-btn" id="closeHistoryBtn">✕</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: var(--text-sub); padding: 20px;">まだ会話はありません</div>
            </div>
        </div>
    </div>

    <script>
        // --- 設定管理 (LocalStorage) ---
        const SETTINGS_KEY = "drive_gemini_settings";
        let config = {
            apiKey: "",
            model: "gemini-1.5-flash",
            customModel: "",
            silenceTimeout: 1.6,
            speechRate: 1.1
        };

        function loadConfig() {
            try {
                const saved = localStorage.getItem(SETTINGS_KEY);
                if (saved) {
                    config = { ...config, ...JSON.parse(saved) };
                }
            } catch (e) {
                console.error("設定ロード失敗:", e);
            }
            updateModelBadge();
        }

        function saveConfig() {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(config));
            updateModelBadge();
        }

        function getActiveModel() {
            return config.model === "custom" ? (config.customModel || "gemini-1.5-flash") : config.model;
        }

        function updateModelBadge() {
            const badge = document.getElementById("displayModelBadge");
            const active = getActiveModel();
            badge.textContent = active;
        }

        // --- 会話履歴 (セッション中保持) ---
        // Gemini API contents format: [{role: 'user', parts: [{text: ''}]}, {role: 'model', parts: [{text: ''}]}]
        let conversationHistory = [];
        let uiLog = [];

        // --- 状態管理 ---
        // 'idle', 'listening', 'thinking', 'speaking', 'error'
        let currentState = "idle";
        let isDrivingMode = false;
        let wakeLock = null;

        // 音声認識オブジェクト
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecognitionActive = false;
        let speechRecognitionRestartTimer = null;
        let silenceTimer = null;
        let currentTranscript = "";

        // Web Audio Context (効果音用)
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // ピッ（効果音）を生成
        function playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                console.warn("効果音再生エラー:", e);
            }
        }

        function playListenBeep() {
            // ピッ（聞くよ）
            playTone(880, 'sine', 0.08, 0.2);
        }

        function playSendBeep() {
            // ピロリン（送信）
            playTone(587, 'sine', 0.06, 0.15);
            setTimeout(() => playTone(880, 'sine', 0.09, 0.15), 60);
        }

        function playErrorBeep() {
            // ブブッ（エラー）
            playTone(220, 'sawtooth', 0.12, 0.2);
            setTimeout(() => playTone(180, 'sawtooth', 0.15, 0.2), 120);
        }

        // --- 画面スリープ防止 (Screen Wake Lock) ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock was released');
                    });
                } catch (err) {
                    console.warn(`Wake Lockエラー: ${err.name}, ${err.message}`);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        // --- UI状態の切り替え ---
        const statusBar = document.getElementById("statusBar");
        const orbIcon = document.getElementById("orbIcon");
        const statusText = document.getElementById("statusText");
        const statusSubtext = document.getElementById("statusSubtext");
        const liveBubble = document.getElementById("liveBubble");
        const liveText = document.getElementById("liveText");
        const chatContainer = document.getElementById("chatContainer");
        const chatMessages = document.getElementById("chatMessages");
        const emptyChat = document.getElementById("emptyChat");
        const mainActionBtn = document.getElementById("mainActionBtn");
        const clearChatBtn = document.getElementById("clearChatBtn");

        function setState(state, detail = "") {
            currentState = state;
            document.body.className = `state-${state}`;

            switch (state) {
                case "idle":
                    orbIcon.textContent = "💤";
                    statusText.textContent = "運転モード停止中";
                    statusSubtext.textContent = "「運転開始」を押すと完全ハンズフリーになります";
                    mainActionBtn.className = "main-btn btn-start";
                    mainActionBtn.innerHTML = "<span>▶ 運転開始（ハンズフリー）</span>";
                    if (liveBubble) liveBubble.style.display = "none";
                    break;

                case "listening":
                    orbIcon.textContent = "🎙️";
                    statusText.textContent = "聞いています...";
                    statusSubtext.textContent = "お話しください（話し終わると自動送信）";
                    break;

                case "thinking":
                    orbIcon.textContent = "💭";
                    statusText.textContent = "Gemini考え中...";
                    statusSubtext.textContent = "回答を生成しています";
                    if (liveBubble) liveBubble.style.display = "none";
                    break;

                case "speaking":
                    orbIcon.textContent = "🔊";
                    statusText.textContent = "Gemini回答中";
                    statusSubtext.textContent = "読み上げ完了で自動マイク再開します";
                    if (liveBubble) liveBubble.style.display = "none";
                    break;

                case "error":
                    orbIcon.textContent = "⚠️";
                    statusText.textContent = "エラー";
                    statusSubtext.textContent = detail || "電波状況をご確認ください";
                    if (liveBubble) liveBubble.style.display = "none";
                    break;
            }
        }

        // --- 音声認識の初期化 ---
        function initRecognition() {
            if (!SpeechRecognition) {
                alert("お使いのブラウザは音声認識に対応していません。iOS SafariまたはGoogle Chromeでお試しください。");
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ja-JP';

            recognition.onstart = () => {
                isRecognitionActive = true;
                if (currentState !== "listening" && isDrivingMode) {
                    setState("listening");
                    playListenBeep();
                }
            };

            recognition.onresult = (event) => {
                if (!isDrivingMode || currentState === "thinking" || currentState === "speaking") return;

                let interim = "";
                let final = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const trans = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += trans;
                    } else {
                        interim += trans;
                    }
                }

                const recognized = final || interim;
                if (recognized.trim().length > 0) {
                    currentTranscript = recognized;
                    if (liveBubble) liveBubble.style.display = "block";
                    liveText.textContent = currentTranscript;
                    chatContainer.scrollTop = chatContainer.scrollHeight;

                    // 無音タイマーのリセット（沈黙を検知して自動送信）
                    resetSilenceTimer();
                }
            };

            recognition.onerror = (event) => {
                console.warn("音声認識エラー:", event.error);
                if (event.error === "no-speech") {
                    // 単なる沈黙。無視して継続
                    return;
                }
                if (event.error === "not-allowed") {
                    stopDrivingMode();
                    alert("マイクの使用が許可されていません。ブラウザ設定でマイクを許可してください。");
                }
            };

            recognition.onend = () => {
                isRecognitionActive = false;
                // 運転モード中かつ、思考中・読み上げ中でなければマイクを自動再開
                if (isDrivingMode && currentState === "listening") {
                    clearTimeout(speechRecognitionRestartTimer);
                    speechRecognitionRestartTimer = setTimeout(() => {
                        startRecognitionSafely();
                    }, 300);
                }
            };

            return true;
        }

        function startRecognitionSafely() {
            if (!recognition) initRecognition();
            if (isRecognitionActive) return;

            try {
                recognition.start();
            } catch (e) {
                console.warn("Recognition start例外:", e);
                setTimeout(() => {
                    if (isDrivingMode && !isRecognitionActive) {
                        try { recognition.start(); } catch (err) {}
                    }
                }, 500);
            }
        }

        function stopRecognitionSafely() {
            clearTimeout(silenceTimer);
            clearTimeout(speechRecognitionRestartTimer);
            if (recognition && isRecognitionActive) {
                try {
                    recognition.stop();
                } catch (e) {}
            }
            isRecognitionActive = false;
        }

        // 発話終了（無音検知）のタイマー
        function resetSilenceTimer() {
            clearTimeout(silenceTimer);
            const timeoutMs = (parseFloat(config.silenceTimeout) || 1.6) * 1000;

            silenceTimer = setTimeout(() => {
                if (currentTranscript.trim().length > 0 && isDrivingMode && currentState === "listening") {
                    handleUserSpeechCompleted(currentTranscript.trim());
                }
            }, timeoutMs);
        }

        // ユーザーが話し終わったときの処理
        async function handleUserSpeechCompleted(text) {
            currentTranscript = "";
            clearTimeout(silenceTimer);

            // 音声認識を一旦一時停止（自分の読み上げやノイズを拾わないようにする）
            stopRecognitionSafely();

            playSendBeep();
            setState("thinking");
            liveText.textContent = `「${text}」`;
            liveText.className = "live-text";

            // 会話履歴に追加
            addUiLog("user", text);
            conversationHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            // 履歴が長すぎる場合は直近10往復（20件）に制限してトークン節約＆高速化
            if (conversationHistory.length > 20) {
                conversationHistory = conversationHistory.slice(-20);
            }

            // Gemini API呼び出し
            try {
                const replyText = await callGeminiAPI();
                // 会話履歴に追加
                addUiLog("model", replyText);
                conversationHistory.push({
                    role: "model",
                    parts: [{ text: replyText }]
                });

                // 音声読み上げ
                speakReply(replyText);
            } catch (err) {
                console.error("Gemini呼び出し失敗:", err);
                playErrorBeep();

                let friendlyMsg = "通信エラーが発生しました。";
                const errStr = (err.message || "").toLowerCase();

                if (errStr.includes("not found") || errStr.includes("404")) {
                    friendlyMsg = `モデル「${getActiveModel()}」が存在しません。設定で gemini-1.5-flash に変更してください。`;
                } else if (errStr.includes("api key not valid") || errStr.includes("api_key_invalid") || errStr.includes("400")) {
                    friendlyMsg = "APIキーが無効です。設定でAPIキーをご確認ください。";
                } else if (errStr.includes("403") || errStr.includes("permission")) {
                    friendlyMsg = "APIの利用権限エラーです。キーの設定をご確認ください。";
                } else if (errStr.includes("quota") || errStr.includes("429")) {
                    friendlyMsg = "APIの利用枠上限に達しました。しばらく待ってからお試しください。";
                } else {
                    friendlyMsg = `通信エラー: ${err.message || "電波状況をご確認ください"}`;
                }

                setState("error", friendlyMsg);
                liveText.textContent = friendlyMsg;

                // 音声で案内
                speakReply(friendlyMsg, true);
            }
        }

        // --- Gemini API 呼び出し ---
        async function callGeminiAPI(retryCount = 0) {
            const trimmedKey = (config.apiKey || "").trim();
            if (!trimmedKey) {
                throw new Error("APIキーが未設定です。右上の歯車アイコンから設定してください。");
            }

            const activeModel = getActiveModel();
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(activeModel)}:generateContent?key=${encodeURIComponent(trimmedKey)}`;

            const requestBody = {
                contents: conversationHistory
            };

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000); // 12秒タイムアウト

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status} エラー`;
                    throw new Error(errMsg);
                }

                const data = await response.json();
                const candidate = data.candidates?.[0];
                if (!candidate || !candidate.content?.parts?.[0]?.text) {
                    throw new Error("回答が得られませんでした。");
                }

                return candidate.content.parts[0].text.trim();
            } catch (error) {
                clearTimeout(timeoutId);
                // 1回だけ自動リトライ
                if (retryCount < 1) {
                    console.log("通信リトライ中...");
                    await new Promise(r => setTimeout(r, 1000));
                    return callGeminiAPI(retryCount + 1);
                }
                throw error;
            }
        }

        // --- 音声合成（Text-to-Speech）読み上げ ---
        let speechChunks = [];
        let currentChunkIndex = 0;

        function splitTextIntoSentences(text) {
            // iOS Safariの長文停止バグ対策：句点・感嘆符・改行で適切に分割
            const regex = /[^。！？\n]+[。！？\n]?/g;
            const matches = text.match(regex) || [text];
            const chunks = [];
            let current = "";
            for (const m of matches) {
                if ((current + m).length > 100) {
                    if (current) chunks.push(current);
                    current = m;
                } else {
                    current += m;
                }
            }
            if (current) chunks.push(current);
            return chunks.length > 0 ? chunks : [text];
        }

        function speakReply(text, isErrorNotice = false) {
            if (!('speechSynthesis' in window)) {
                alert("お使いの端末は音声合成に対応していません。");
                if (isDrivingMode) resumeListening();
                return;
            }

            // マークダウン記号などを除去してクリアな読み上げにする
            const cleanText = text
                .replace(/[*#_~`>]/g, '')
                .replace(/https?:\/\/\S+/g, 'URL')
                .trim();

            setState("speaking");
            liveText.textContent = cleanText;

            window.speechSynthesis.cancel();
            speechChunks = splitTextIntoSentences(cleanText);
            currentChunkIndex = 0;

            playNextSpeechChunk();
        }

        function playNextSpeechChunk() {
            if (!isDrivingMode && currentState !== "speaking") return;

            // 全チャンク読み上げ完了
            if (currentChunkIndex >= speechChunks.length) {
                if (isDrivingMode) {
                    resumeListening();
                }
                return;
            }

            const chunkText = speechChunks[currentChunkIndex];
            currentChunkIndex++;

            const utterance = new SpeechSynthesisUtterance(chunkText);
            utterance.lang = 'ja-JP';
            utterance.rate = parseFloat(config.speechRate) || 1.1;

            const voices = window.speechSynthesis.getVoices();
            const jaVoice = voices.find(v => v.lang.startsWith('ja') || v.lang.includes('JP'));
            if (jaVoice) {
                utterance.voice = jaVoice;
            }

            utterance.onend = () => {
                playNextSpeechChunk();
            };

            utterance.onerror = (e) => {
                console.warn("読み上げエラー:", e);
                playNextSpeechChunk();
            };

            window.speechSynthesis.speak(utterance);
        }

        // マイクを聞き取りモードに自動復帰
        function resumeListening() {
            if (!isDrivingMode) return;
            setState("listening");
            liveText.textContent = "（聞いています...）";
            playListenBeep();
            startRecognitionSafely();
        }

        // --- 運転モード開始 / 停止 ---
        async function startDrivingMode() {
            if (!config.apiKey) {
                openSettingsModal();
                alert("まずはGemini API Keyを設定してください。");
                return;
            }

            // オーディオコンテキストのアクティベート（iOS Safariのサウンド制約解除）
            getAudioContext();

            // スリープ防止
            await requestWakeLock();

            isDrivingMode = true;
            mainActionBtn.className = "main-btn btn-stop";
            mainActionBtn.innerHTML = "<span>⏹ 運転モード終了</span>";

            setState("listening");
            liveText.textContent = "どうぞお話しください";
            playListenBeep();
            startRecognitionSafely();
        }

        function stopDrivingMode() {
            isDrivingMode = false;
            speechChunks = [];
            stopRecognitionSafely();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            releaseWakeLock();
            setState("idle");
            liveText.textContent = "「運転開始」を押してください";
        }

        // --- 会話ログ管理 ---
        function addUiLog(role, text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            uiLog.push({ role, text, time });
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById("historyList");
            if (uiLog.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 20px;">まだ会話はありません</div>';
                return;
            }

            list.innerHTML = uiLog.map(item => `
                <div class="history-item ${item.role}">
                    <div class="history-time">${item.role === 'user' ? 'あなた' : 'Gemini'} • ${item.time}</div>
                    <div>${escapeHtml(item.text)}</div>
                </div>
            `).join('');

            list.scrollTop = list.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // --- UI イベントリスナー ---
        // メインアクションボタン
        mainActionBtn.addEventListener("click", () => {
            if (isDrivingMode) {
                stopDrivingMode();
            } else {
                startDrivingMode();
            }
        });

        // 巨大オーブタップ（一時停止 / 再開のトグル）
        orbContainer.addEventListener("click", () => {
            if (!isDrivingMode) {
                startDrivingMode();
            } else {
                // 運転中ならトグル
                stopDrivingMode();
            }
        });

        // 設定モーダル
        const settingsModal = document.getElementById("settingsModal");
        const settingsBtn = document.getElementById("settingsBtn");
        const closeSettingsBtn = document.getElementById("closeSettingsBtn");
        const saveSettingsBtn = document.getElementById("saveSettingsBtn");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const modelSelect = document.getElementById("modelSelect");
        const customModelGroup = document.getElementById("customModelGroup");
        const customModelInput = document.getElementById("customModelInput");
        const silenceTimeoutInput = document.getElementById("silenceTimeoutInput");
        const silenceVal = document.getElementById("silenceVal");
        const speechRateInput = document.getElementById("speechRateInput");
        const rateVal = document.getElementById("rateVal");
        function openSettingsModal() {
            apiKeyInput.value = config.apiKey || "";
            modelSelect.value = config.model;
            customModelInput.value = config.customModel;
            customModelGroup.style.display = config.model === "custom" ? "block" : "none";
            silenceTimeoutInput.value = config.silenceTimeout;

        settingsBtn.addEventListener("click", openSettingsModal);
        closeSettingsBtn.addEventListener("click", () => settingsModal.classList.remove("open"));

        modelSelect.addEventListener("change", () => {

        });

        silenceTimeoutInput.addEventListener("input", () => {
            silenceVal.textContent = silenceTimeoutInput.value + "秒";
        });

        speechRateInput.addEventListener("input", () => {
            rateVal.textContent = speechRateInput.value + "x";
        });

        // モデル一覧取得機能
        const fetchModelsBtn = document.getElementById("fetchModelsBtn");
        fetchModelsBtn.addEventListener("click", async () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                testResult.textContent = "❌ 先にAPIキーを入力してください。";
                testResult.style.color = "#f87171";
                return;
            }

            testResult.textContent = "⏳ このAPIキーで利用可能なモデル一覧を取得中...";
            testResult.style.color = "#fbbf24";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status}`;
                    testResult.innerHTML = `<span style="color:#f87171">❌ 取得失敗 (${response.status}):</span><br><code style="font-size:0.75rem; color:#fca5a5; display:block; margin-top:4px; padding:6px; background:rgba(0,0,0,0.4); border-radius:6px;">${escapeHtml(errMsg)}</code>`;
                    return;
                }

                const data = await response.json();
                const availableModels = (data.models || [])
                    .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
                    .map(m => m.name.replace(/^models\//, ''));

                if (availableModels.length === 0) {
                    testResult.textContent = "⚠️ generateContent対応のモデルが見つかりませんでした。";
                    testResult.style.color = "#fbbf24";
                    return;
                }

                // セレクトボックスを再構築
                modelSelect.innerHTML = availableModels.map(m => 
                    `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`
                ).join('') + '<option value="custom">カスタム手入力</option>';

                // 優先モデルを選択
                const preferred = availableModels.find(m => m === "gemini-1.5-flash") || 
                                  availableModels.find(m => m === "gemini-2.0-flash") || 
                                  availableModels[0];
                if (preferred) {
                    modelSelect.value = preferred;
                }

                testResult.textContent = `✅ ${availableModels.length}個の利用可能モデルを取得しました！「${modelSelect.value}」を選択しました。`;

        // API接続テスト機能
        const testApiBtn = document.getElementById("testApiBtn");
        const testResult = document.getElementById("testResult");

        testApiBtn.addEventListener("click", async () => {
            const key = apiKeyInput.value.trim();
            const selectedModel = modelSelect.value === "custom" ? customModelInput.value.trim() : modelSelect.value;

            if (!key) {

                return;
            }

            testResult.textContent = `⏳「${selectedModel}」に接続テスト中...`;
            testResult.style.color = "#fbbf24";

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(selectedModel)}:generateContent?key=${encodeURIComponent(key)}`;
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: "こんにちは" }] }]
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status}`;
                    testResult.innerHTML = `<span style="color:#f87171">❌ 接続エラー (${response.status}):</span><br><code style="font-size:0.75rem; color:#fca5a5; display:block; margin-top:4px; padding:6px; background:rgba(0,0,0,0.4); border-radius:6px; word-break:break-all;">${escapeHtml(errMsg)}</code>`;
                    return;
                }

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "OK";
                testResult.innerHTML = `<span style="color:#4ade80">✅ 接続成功！「${selectedModel}」が正常に応答しました。</span><br><span style="font-size:0.75rem; color:#94a3b8;">返答: ${escapeHtml(reply.slice(0, 50))}...</span>`;
            } catch (e) {
                testResult.innerHTML = `<span style="color:#f87171">❌ 通信例外エラー:</span><br><code style="font-size:0.75rem; color:#fca5a5; display:block; margin-top:4px; padding:6px; background:rgba(0,0,0,0.4); border-radius:6px;">${escapeHtml(e.message)}</code>`;
            }
        });

        saveSettingsBtn.addEventListener("click", () => {
            config.apiKey = apiKeyInput.value.trim();
            config.model = modelSelect.value;
            config.customModel = customModelInput.value.trim();
            config.silenceTimeout = parseFloat(silenceTimeoutInput.value);
            config.speechRate = parseFloat(speechRateInput.value);

            saveConfig();
            settingsModal.classList.remove("open");
        });

        // 会話ログモーダル
        const historyModal = document.getElementById("historyModal");
        const historyBtn = document.getElementById("historyBtn");
        const closeHistoryBtn = document.getElementById("closeHistoryBtn");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");

        historyBtn.addEventListener("click", () => {
            renderHistory();
            historyModal.classList.add("open");
        });
        closeHistoryBtn.addEventListener("click", () => historyModal.classList.remove("open"));
        clearHistoryBtn.addEventListener("click", () => {
            if (confirm("会話ログをリセットしますか？")) {
                conversationHistory = [];
                uiLog = [];
                renderHistory();
            }
        });

        // ページロード時の初期化
        window.addEventListener("DOMContentLoaded", () => {
            loadConfig();
            initRecognition();

            // 音声一覧のロード（ブラウザキャッシュ用）
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }

            // 初回でAPIキーが未入力の場合は案内
            if (!config.apiKey) {
                setTimeout(() => {
                    openSettingsModal();
                }, 500);
            }
        });
    </script>
</body>
</html>
