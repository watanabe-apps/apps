        <div style="display:flex; align-items:center; gap:4px;">
          <span style="color:var(--text-sub);">開始(In):</span>
          <input type="number" step="0.1" min="0" value="${c.fadeIn}" style="width:60px;" onchange="updateCharaProp('${c.id}', 'fadeIn', parseFloat(this.value))">
          <span>s</span>
        </div>
        <div style="display:flex; align-items:center; gap:4px;">
          <span style="color:var(--text-sub);">終了(Out):</span>
          <input type="number" step="0.1" min="0" value="${c.fadeOut}" style="width:60px;" onchange="updateCharaProp('${c.id}', 'fadeOut', parseFloat(this.value))">
          <span>s</span>
        </div>
      </div>

      <div style="display:flex; gap:6px; margin-top:4px;">
        <button class="record-both-btn ${isRecordingBoth ? 'recording' : ''}" style="flex:1; padding:8px 6px; font-weight:bold;" onclick="toggleMotionAndAudioRecord('${c.id}')">
          ● 動き＋音声 同時記録 (Shift+R)
        </button>
      </div>
      <div style="display:flex; gap:6px; margin-top:2px;">
        <button class="record-btn ${isRecordingMotion && !isRecordingBoth ? 'recording' : ''}" style="flex:1;" onclick="toggleMotionRecord('${c.id}')">● 動きのみ記録 (R)</button>
        <button onclick="trimMotionAfter('${c.id}')">以降削除</button>
        <button class="btn-danger" onclick="clearMotion('${c.id}')">全消去</button>
      </div>
    </div>

    <!-- 強調演出 -->
    <div class="inspector-section">
      <div class="inspector-title">
        <span>強調・スポットライト演出</span>
        <button class="btn-sm" style="background:var(--highlight-color); border-color:var(--highlight-color); color:#fff;" onclick="addHighlight('${c.id}')">＋ 強調追加</button>
      </div>
      ${highlightsHTML.length > 0 ? highlightsHTML : '<div style="font-size:13px; color:#6b7280; padding:4px 0;">強調演出が登録されていません</div>'}
    </div>

    <!-- 字幕 -->
    <div class="inspector-section">
      <div class="inspector-title">
        <span>セリフ・吹き出し設定</span>
        <button class="btn-sm primary-btn" onclick="addDialogue('${c.id}')">＋ 字幕追加</button>
      </div>
      <div class="prop-row">
        <label>文字サイズ:</label>
        <input type="range" min="12" max="36" step="1" value="${c.fontSize}" oninput="updateCharaProp('${c.id}', 'fontSize', parseFloat(this.value)); this.nextElementSibling.textContent=this.value+'px'">
        <span class="val-indicator">${c.fontSize}px</span>
      </div>
      <div class="prop-row">
        <label>吹き出し幅:</label>
        <input type="range" min="100" max="600" step="10" value="${c.bubbleWidth || 260}" oninput="updateCharaProp('${c.id}', 'bubbleWidth', parseFloat(this.value)); this.nextElementSibling.textContent=this.value+'px'">
        <span class="val-indicator">${c.bubbleWidth || 260}px</span>
      </div>
      ${dialoguesHTML.length > 0 ? dialoguesHTML : '<div style="font-size:13px; color:#6b7280; padding:4px 0;">字幕が登録されていません</div>'}
    </div>

    <!-- 音声トラック一覧 -->
    <div class="inspector-section">
      <div class="inspector-title">
        <span>音声トラック管理 (${audioTracks.length}本)</span>
        <button class="btn-sm" style="background:#047857;" onclick="addAudioTrack()">＋ 追加</button>
      </div>
      ${audioTracksInspectorHTML}
    </div>
  `;
}

function updateCharaProp(id, prop, val) {
  const chara = characters.find(c => c.id === id);
  if (chara) {
    chara[prop] = val;
    updateStageElement(chara, currentTime);
    markUnsaved();
  }
}

function changeCharaImage(id, input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      const chara = characters.find(c => c.id === id);
      chara.imgSrc = e.target.result;
      loadImageObject(chara);
      document.getElementById('img_' + id).src = e.target.result;
      renderInspector();
      markUnsaved();
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function deleteCharacter(id) {
  characters = characters.filter(c => c.id !== id);
  const el = document.getElementById('stage_' + id);
  if (el) el.remove();
  selectedCharaId = characters.length > 0 ? characters[0].id : null;
  updateZIndexes();
  renderInspector();
  renderVisualTimeline();
  markUnsaved();
}

function getSerializedProject() {
  return {
    duration: duration,
    aspectRatio: currentAspectRatio,
    bgPreset: currentBgPreset,
    isCurtainOverlayActive: isCurtainOverlayActive,
    bgColor: bgColorPicker.value,
    customBgSrc: customBgSrc,
    characters: characters.map(c => ({
      id: c.id,
      name: c.name,
      imgSrc: c.imgSrc,
      group: c.group || 'none',
      muted: !!c.muted,
      size: c.size || 90,
      fontSize: c.fontSize || 16,
      bubbleWidth: c.bubbleWidth || 260,
      flipX: !!c.flipX,
      x: c.x,
      y: c.y,
      inTime: c.inTime,
      fadeIn: c.fadeIn,
      outTime: c.outTime,
      fadeOut: c.fadeOut,
      dialogues: c.dialogues || [],
      highlights: c.highlights || [],
      motion: c.motion || []
    })),
    audioTracks: audioTracks.map(t => ({
      id: t.id,
      name: t.name,
      muted: !!t.muted,
      clips: (t.clips || []).map(clip => ({
        id: clip.id,
        name: clip.name,
        base64: clip.base64,
        startTime: clip.startTime,
        duration: clip.duration,
        volume: clip.volume !== undefined ? clip.volume : 1.0
      }))
    }))
  };
}

function exportJSON() {
  const project = getSerializedProject();
  const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scene_project_' + Date.now() + '.json';
  a.click();
  markSaved('ファイルに書き出し完了');
}

async function restoreProjectData(data) {
  duration = data.duration || 30.0;
  document.getElementById('total-duration').value = duration;
  seekBar.max = duration;

  if (data.aspectRatio) {
    document.getElementById('aspect-ratio-select').value = data.aspectRatio;
    changeAspectRatio(data.aspectRatio);
  }

  if (data.bgColor) {
    bgColorPicker.value = data.bgColor;
    stage.style.backgroundColor = data.bgColor;
  }

  if (data.customBgSrc) {
    customBgSrc = data.customBgSrc;
  }

  if (data.isCurtainOverlayActive !== undefined) {
    isCurtainOverlayActive = data.isCurtainOverlayActive;
    curtainToggle.checked = isCurtainOverlayActive;
  }

  if (data.bgPreset) {
    bgPresetSelect.value = data.bgPreset;
    applyBgPreset(data.bgPreset);
  } else {
    bgPresetSelect.value = 'gym_stage';
    applyBgPreset('gym_stage');
  }

  stage.querySelectorAll('.character').forEach(el => el.remove());
  characters = data.characters || [];

  if (data.audioTracks && data.audioTracks.length > 0) {
    audioTracks = data.audioTracks;
  } else if (data.globalAudioClips && data.globalAudioClips.length > 0) {
    audioTracks = [{
      id: 'atk_' + Date.now(),
      name: '音声 1',
      muted: false,
      clips: data.globalAudioClips
    }];
  } else {
    audioTracks = [];
    initDefaultAudioTrack();
  }
  activeAudioTrackId = audioTracks[0].id;

  characters.forEach(c => {
    if (!c.group) c.group = 'none';
    if (!c.highlights) c.highlights = [];
    if (!c.bubbleWidth) c.bubbleWidth = 260;
    (c.dialogues || []).forEach(d => {
      if (!d.pos) d.pos = 'top';
    });
    (c.motion || []).forEach((pt, i) => {
      if (pt.isManual === undefined) {
        pt.isManual = (pt.isKeyframe || i === 0 || i === c.motion.length - 1);
      }
    });
  });

  const ctx = getAudioContext();
  for (const t of audioTracks) {
    for (const clip of (t.clips || [])) {
      if (clip.base64) {
        try {
          const resp = await fetch(clip.base64);
          const arrayBuf = await resp.arrayBuffer();
          clip.buffer = await ctx.decodeAudioData(arrayBuf);
        } catch (audioErr) {
          console.warn('Audio decode failed:', clip.id);
        }
      }
    }
  }

  for (const c of characters) {
    c.size = c.size || 90;
    c.fontSize = c.fontSize || 16;
    c.bubbleWidth = c.bubbleWidth || 260;
    c.flipX = !!c.flipX;
    loadImageObject(c);
    createStageElement(c);
  }

  updateZIndexes();
  selectedCharaId = characters.length > 0 ? characters[0].id : null;
  renderInspector();
  renderVisualTimeline();
  checkOutOfBoundsData();
  seekTo(0);
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async evt => {
    try {
      const data = JSON.parse(evt.target.result);
      await restoreProjectData(data);
      markSaved('ファイルから読み込み完了');
    } catch(err) {
      alert('ファイルの解析に失敗しました。');
    }
  };
  reader.readAsText(file);
}

// ショートカットキー
window.addEventListener('keydown', (e) => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

  if (e.code === 'Escape') {
    if (isTheaterMode) {
      e.preventDefault();
      exitTheaterMode();
      return;
    }
    if (saveChoiceModal.style.display === 'flex') {
      closeSaveModal();
      return;
    }
    if (closeConfirmModal.style.display === 'flex') {
      closeCloseConfirmModal();
      return;
    }
  }

  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
    return;
  }

  if (isTheaterMode) return;

  if ((e.key === 'r' || e.key === 'R') && e.shiftKey) {
    e.preventDefault();
    if (selectedCharaId) toggleMotionAndAudioRecord(selectedCharaId);
  } else if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    if (selectedCharaId) toggleMotionRecord(selectedCharaId);
  } else if (e.key === 'k' || e.key === 'K') {
    e.preventDefault();
    if (selectedCharaId) addCurrentKeyframe(selectedCharaId);
  } else if (e.key === 'm' || e.key === 'M') {
    e.preventDefault();
    toggleGlobalAudioRecord();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    seekTo(currentTime - (e.shiftKey ? 2.0 : 0.2));
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    seekTo(currentTime + (e.shiftKey ? 2.0 : 0.2));
  } else if (e.code === 'Home' || e.key === '0') {
    e.preventDefault();
    seekTo(0);
  } else if (e.code === 'Tab') {
    e.preventDefault();
    cycleCharacterSelection(e.shiftKey ? -1 : 1);
  }
});

window.addEventListener('DOMContentLoaded', async () => {
  changeAspectRatio('16:9');
  applyBgPreset('gym_stage');
  setStageEditingMode(true);
  syncTimelineUI();
  await checkAndPromptRestore();
});
</script>
</body>
