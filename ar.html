<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>人を野菜だと思え - 聴衆変身AR</title>

  <!-- TensorFlow.js & BlazeFace (軽量CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* メイン描画キャンバス（全画面表示） */
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* バックグラウンド用ビデオ要素（完全非表示・インライン再生用） */
    #webcam {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
      z-index: -1;
    }

    /* 最小限のフローティングHUDトグルボタン */
    #hudBtn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 40;
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 22px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      transition: background 0.2s, transform 0.1s;
    }
    #hudBtn:active {
      transform: scale(0.96);
    }

    .badge-count {
      background: #ea580c;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .badge-fps {
      color: #a3e635;
      font-size: 11px;
      font-family: monospace;
      font-weight: 700;
    }

    /* 調整ドロワー（デフォルト非表示・本番プレゼン時は完全ゼロUI） */
    #hudPanel {
      position: absolute;
      top: 58px;
      right: 14px;
      z-index: 40;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 14px 16px;
      width: 250px;
      color: #f1f5f9;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #hudPanel.closed {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .hud-row {
      margin-bottom: 12px;
    }

    .hud-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fed7aa;
    }

    .hud-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      accent-color: #f97316;
      cursor: pointer;
    }

    .hud-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .hud-button {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .hud-button:active:not(:disabled) {
      transform: scale(0.97);
    }
    .hud-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hud-button.active {
      background: #ea580c;
      border-color: #f97316;
    }
    .hud-button.span-all {
      grid-column: span 2;
      background: #2563eb;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <video id="webcam" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="stage"></canvas>

  <!-- プレゼン検証用HUD（デフォルトは格納・ワンタップで開閉） -->
  <button id="hudBtn" type="button">
    <span>⚙️ 調整</span>
    <span id="badgeCount" class="badge-count">0人</span>
    <span id="badgeFps" class="badge-fps">--fps</span>
  </button>

  <div id="hudPanel" class="closed">
    <div class="hud-row">
      <div class="hud-label">
        <span>検出閾値</span>
        <span id="thresholdVal">0.40</span>
      </div>
      <input id="thresholdSlider" class="hud-slider" type="range" min="0.10" max="0.90" step="0.05" value="0.40">
    </div>

    <div class="hud-actions">
      <button id="switchCameraBtn" class="hud-button" type="button">📷 背面カメラ</button>
      <button id="toggleDebugBtn" class="hud-button" type="button">デバッグ枠 OFF</button>
      <button id="shuffleVegBtn" class="hud-button span-all" type="button">🎲 野菜シャッフル</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });

    const hudBtn = document.getElementById('hudBtn');
    const hudPanel = document.getElementById('hudPanel');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdVal = document.getElementById('thresholdVal');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const toggleDebugBtn = document.getElementById('toggleDebugBtn');
    const shuffleVegBtn = document.getElementById('shuffleVegBtn');
    const badgeCount = document.getElementById('badgeCount');
    const badgeFps = document.getElementById('badgeFps');

    // 状態変数
    let scoreThreshold = 0.40;
    let isFrontCamera = false; // 研修本番用に背面カメラがデフォルト
    let showDebug = false;

    // カメラ切り替え＆ライフサイクル安全ガード
    let faceModel = null;
    let currentStream = null;
    let isInferring = false;
    let isRunning = false;
    let isCameraReady = false;      // カメラ映像が確定し推論可能な状態か
    let isSwitchingCamera = false;  // 切り替え処理中フラグ（連続押し防止）

    // FPS算出用バッファ
    const fpsWindow = [];
    let lastFpsTextUpdate = 0;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    hudBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hudPanel.classList.toggle('closed');
    });

    thresholdSlider.addEventListener('input', (e) => {
      scoreThreshold = parseFloat(e.target.value);
      thresholdVal.textContent = scoreThreshold.toFixed(2);
    });

    toggleDebugBtn.addEventListener('click', () => {
      showDebug = !showDebug;
      toggleDebugBtn.textContent = showDebug ? 'デバッグ枠 ON' : 'デバッグ枠 OFF';
      toggleDebugBtn.classList.toggle('active', showDebug);
    });

    shuffleVegBtn.addEventListener('click', () => {
      tracker.shuffle();
    });

    const VEGETABLE_TYPES = [
      'pumpkin',   // 0: カボチャ
      'tomato',    // 1: トマト
      'eggplant',  // 2: ナス
      'carrot',    // 3: ニンジン
      'onion',     // 4: タマネギ
      'pepper',    // 5: ピーマン
      'broccoli',  // 6: ブロッコリー
      'daikon'     // 7: ダイコン
    ];

    /** 1. カボチャ (Pumpkin) - 王道のジャック・オー・ランタン */
    function drawPumpkin(c, r) {
      c.fillStyle = '#1e3a12';
      c.beginPath();
      c.moveTo(-r * 0.08, -r * 0.78);
      c.quadraticCurveTo(-r * 0.16, -r * 1.15, -r * 0.04, -r * 1.18);
      c.quadraticCurveTo(r * 0.14, -r * 1.08, r * 0.08, -r * 0.78);
      c.fill();

      const grad = c.createRadialGradient(0, -r * 0.2, r * 0.1, 0, 0, r * 1.05);
      grad.addColorStop(0, '#fed7aa');
      grad.addColorStop(0.3, '#f97316');
      grad.addColorStop(0.8, '#c2410c');
      grad.addColorStop(1, '#431407');
      c.fillStyle = grad;
      c.strokeStyle = '#280c05';
      c.lineWidth = Math.max(1.8, r * 0.03);

      c.beginPath(); c.ellipse(-r * 0.52, 0, r * 0.42, r * 0.86, -0.12, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(r * 0.52, 0, r * 0.42, r * 0.86, 0.12, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(-r * 0.26, 0, r * 0.43, r * 0.93, -0.05, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(r * 0.26, 0, r * 0.43, r * 0.93, 0.05, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(0, 0, r * 0.42, r * 0.96, 0, 0, Math.PI * 2); c.fill(); c.stroke();

      c.fillStyle = '#1c0502';
      c.beginPath();
      c.moveTo(-r * 0.38, -r * 0.12); c.lineTo(-r * 0.16, -r * 0.26); c.lineTo(-r * 0.20, -r * 0.04); c.closePath();
      c.moveTo(r * 0.38, -r * 0.12); c.lineTo(r * 0.16, -r * 0.26); c.lineTo(r * 0.20, -r * 0.04); c.closePath();
      c.moveTo(0, -r * 0.10); c.lineTo(-r * 0.08, 0.04 * r); c.lineTo(r * 0.08, 0.04 * r); c.closePath();
      const mw = r * 0.56;
      c.moveTo(-mw * 0.9, r * 0.22);
      c.lineTo(-mw * 0.5, r * 0.35); c.lineTo(-mw * 0.2, r * 0.24);
      c.lineTo(0, r * 0.34);
      c.lineTo(mw * 0.2, r * 0.24); c.lineTo(mw * 0.5, r * 0.35); c.lineTo(mw * 0.9, r * 0.22);
      c.lineTo(mw * 0.65, r * 0.48); c.lineTo(mw * 0.35, r * 0.37); c.lineTo(mw * 0.12, r * 0.50);
      c.lineTo(-mw * 0.12, r * 0.38); c.lineTo(-mw * 0.35, r * 0.50); c.lineTo(-mw * 0.65, r * 0.37);
      c.closePath();
      c.fill();

      c.fillStyle = '#fef08a';
      c.shadowColor = '#ea580c';
      c.shadowBlur = 8;
      c.fill();
      c.shadowBlur = 0;
    }

    /** 2. トマト (Tomato) - ツヤツヤ赤丸＆ウインク笑顔 */
    function drawTomato(c, r) {
      const grad = c.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.1, 0, 0, r);
      grad.addColorStop(0, '#f87171');
      grad.addColorStop(0.4, '#ef4444');
      grad.addColorStop(0.85, '#dc2626');
      grad.addColorStop(1, '#7f1d1d');
      c.fillStyle = grad;
      c.beginPath();
      c.ellipse(0, 0, r * 0.92, r * 0.88, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(255, 255, 255, 0.45)';
      c.beginPath();
      c.ellipse(-r * 0.42, -r * 0.35, r * 0.22, r * 0.12, -0.4, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#15803d';
      c.beginPath();
      for (let i = 0; i < 5; i++) {
        const ang = (i * Math.PI * 2) / 5 - Math.PI / 2;
        const ox = Math.cos(ang) * (r * 0.45);
        const oy = -r * 0.82 + Math.sin(ang) * (r * 0.28);
        const inAng = ang + Math.PI / 5;
        const ix = Math.cos(inAng) * (r * 0.18);
        const iy = -r * 0.82 + Math.sin(inAng) * (r * 0.14);
        if (i === 0) c.moveTo(ox, oy); else c.lineTo(ox, oy);
        c.lineTo(ix, iy);
      }
      c.closePath();
      c.fill();

      c.fillStyle = '#1e1b4b';
      c.beginPath(); c.arc(r * 0.32, -r * 0.1, r * 0.11, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(r * 0.35, -r * 0.13, r * 0.04, 0, Math.PI * 2); c.fill();

      c.strokeStyle = '#1e1b4b';
      c.lineWidth = Math.max(3, r * 0.05);
      c.beginPath();
      c.moveTo(-r * 0.42, -r * 0.15);
      c.lineTo(-r * 0.24, -r * 0.08);
      c.lineTo(-r * 0.42, -r * 0.01);
      c.stroke();

      c.beginPath();
      c.arc(0, r * 0.15, r * 0.28, 0, Math.PI);
      c.fillStyle = '#7f1d1d';
      c.fill();
      c.stroke();
      c.fillStyle = '#fb7185';
      c.beginPath();
      c.arc(r * 0.06, r * 0.3, r * 0.14, 0, Math.PI);
      c.fill();
    }

    /** 3. ナス (Eggplant) - 洋梨シェイプ＆ニヤリドヤ顔 */
    function drawEggplant(c, r) {
      const grad = c.createRadialGradient(-r * 0.2, -r * 0.1, r * 0.1, 0, 0.2 * r, r * 1.1);
      grad.addColorStop(0, '#c084fc');
      grad.addColorStop(0.35, '#7e22ce');
      grad.addColorStop(0.8, '#3b0764');
      grad.addColorStop(1, '#1e0533');
      c.fillStyle = grad;

      c.beginPath();
      c.moveTo(-r * 0.35, -r * 0.65);
      c.bezierCurveTo(-r * 0.45, -r * 0.2, -r * 0.85, r * 0.2, -r * 0.75, r * 0.65);
      c.bezierCurveTo(-r * 0.65, r * 1.05, r * 0.65, r * 1.05, r * 0.75, r * 0.65);
      c.bezierCurveTo(r * 0.85, r * 0.2, r * 0.45, -r * 0.2, r * 0.35, -r * 0.65);
      c.closePath();
      c.fill();

      c.fillStyle = '#15803d';
      c.beginPath();
      c.moveTo(-r * 0.45, -r * 0.6);
      c.lineTo(-r * 0.5, -r * 0.35); c.lineTo(-r * 0.25, -r * 0.45);
      c.lineTo(0, -r * 0.25);
      c.lineTo(r * 0.25, -r * 0.45); c.lineTo(r * 0.5, -r * 0.35);
      c.lineTo(r * 0.45, -r * 0.6); c.lineTo(r * 0.1, -r * 0.95);
      c.lineTo(-r * 0.1, -r * 0.95);
      c.closePath();
      c.fill();

      c.fillStyle = '#fff';
      c.beginPath();
      c.ellipse(-r * 0.28, r * 0.05, r * 0.15, r * 0.12, 0.2, 0, Math.PI * 2);
      c.ellipse(r * 0.28, r * 0.05, r * 0.15, r * 0.12, -0.2, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#0f172a';
      c.beginPath();
      c.arc(-r * 0.24, r * 0.06, r * 0.06, 0, Math.PI * 2);
      c.arc(r * 0.24, r * 0.06, r * 0.06, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = '#0f172a';
      c.lineWidth = Math.max(3, r * 0.05);
      c.beginPath();
      c.arc(0, r * 0.28, r * 0.3, 0.2, Math.PI - 0.5);
      c.stroke();
    }

    /** 4. ニンジン (Carrot) - 出っ歯＆アホ毛草 */
    function drawCarrot(c, r) {
      c.fillStyle = '#22c55e';
      c.beginPath();
      c.ellipse(-r * 0.2, -r * 0.95, r * 0.12, r * 0.35, -0.4, 0, Math.PI * 2);
      c.ellipse(0, -r * 1.05, r * 0.12, r * 0.4, 0, 0, Math.PI * 2);
      c.ellipse(r * 0.2, -r * 0.95, r * 0.12, r * 0.35, 0.4, 0, Math.PI * 2);
      c.fill();

      const grad = c.createLinearGradient(-r * 0.5, 0, r * 0.5, 0);
      grad.addColorStop(0, '#fb923c');
      grad.addColorStop(0.5, '#ea580c');
      grad.addColorStop(1, '#9a3412');
      c.fillStyle = grad;

      c.beginPath();
      c.moveTo(-r * 0.5, -r * 0.65);
      c.quadraticCurveTo(-r * 0.45, r * 0.3, -r * 0.15, r * 0.95);
      c.quadraticCurveTo(0, r * 1.08, r * 0.15, r * 0.95);
      c.quadraticCurveTo(r * 0.45, r * 0.3, r * 0.5, -r * 0.65);
      c.quadraticCurveTo(0, -r * 0.75, -r * 0.5, -r * 0.65);
      c.fill();

      c.strokeStyle = '#c2410c';
      c.lineWidth = Math.max(2, r * 0.035);
      c.beginPath();
      c.moveTo(-r * 0.38, -r * 0.35); c.lineTo(-r * 0.15, -r * 0.35);
      c.moveTo(r * 0.1, -r * 0.15); c.lineTo(r * 0.35, -r * 0.15);
      c.moveTo(-r * 0.25, r * 0.35); c.lineTo(0, r * 0.35);
      c.stroke();

      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(-r * 0.2, -r * 0.1, r * 0.12, 0, Math.PI * 2);
      c.arc(r * 0.2, -r * 0.1, r * 0.12, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#000';
      c.beginPath();
      c.arc(-r * 0.18, -r * 0.1, r * 0.05, 0, Math.PI * 2);
      c.arc(r * 0.18, -r * 0.1, r * 0.05, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#fff';
      c.strokeStyle = '#000';
      c.lineWidth = 2.5;
      c.fillRect(-r * 0.08, r * 0.18, r * 0.16, r * 0.14);
      c.strokeRect(-r * 0.08, r * 0.18, r * 0.16, r * 0.14);
      c.beginPath(); c.moveTo(0, r * 0.18); c.lineTo(0, r * 0.32); c.stroke();
    }

    /** 5. タマネギ (Onion) - とんがり頭＆嬉し泣き顔 */
    function drawOnion(c, r) {
      const grad = c.createRadialGradient(0, -r * 0.1, r * 0.1, 0, 0, r);
      grad.addColorStop(0, '#fef08a');
      grad.addColorStop(0.4, '#fde047');
      grad.addColorStop(0.8, '#d97706');
      grad.addColorStop(1, '#78350f');
      c.fillStyle = grad;

      c.beginPath();
      c.moveTo(0, -r * 1.05);
      c.bezierCurveTo(r * 0.5, -r * 0.5, r * 0.85, 0, r * 0.7, r * 0.55);
      c.bezierCurveTo(r * 0.5, r * 0.95, -r * 0.5, r * 0.95, -r * 0.7, r * 0.55);
      c.bezierCurveTo(-r * 0.85, 0, -r * 0.5, -r * 0.5, 0, -r * 1.05);
      c.fill();

      c.strokeStyle = 'rgba(180, 83, 9, 0.4)';
      c.lineWidth = Math.max(1.5, r * 0.025);
      c.beginPath();
      c.moveTo(0, -r * 0.95); c.quadraticCurveTo(-r * 0.45, 0, 0, r * 0.85);
      c.moveTo(0, -r * 0.95); c.quadraticCurveTo(r * 0.45, 0, 0, r * 0.85);
      c.stroke();

      c.strokeStyle = '#451a03';
      c.lineWidth = Math.max(3, r * 0.05);
      c.beginPath();
      c.arc(-r * 0.3, 0, r * 0.12, Math.PI, 0);
      c.arc(r * 0.3, 0, r * 0.12, Math.PI, 0);
      c.stroke();

      c.fillStyle = '#38bdf8';
      c.beginPath();
      c.arc(-r * 0.42, r * 0.18, r * 0.07, 0, Math.PI * 2);
      c.arc(r * 0.42, r * 0.18, r * 0.07, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#7f1d1d';
      c.beginPath();
      c.arc(0, r * 0.22, r * 0.22, 0, Math.PI);
      c.fill();
    }

    /** 6. ピーマン (Bell Pepper) - 深緑プリプリ＆大口元気顔 */
    function drawPepper(c, r) {
      c.fillStyle = '#14532d';
      c.fillRect(-r * 0.08, -r * 1.0, r * 0.16, r * 0.3);

      const grad = c.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
      grad.addColorStop(0, '#86efac');
      grad.addColorStop(0.3, '#22c55e');
      grad.addColorStop(0.8, '#16a34a');
      grad.addColorStop(1, '#052e16');
      c.fillStyle = grad;

      c.beginPath();
      c.ellipse(-r * 0.42, 0, r * 0.36, r * 0.78, -0.08, 0, Math.PI * 2);
      c.ellipse(r * 0.42, 0, r * 0.36, r * 0.78, 0.08, 0, Math.PI * 2);
      c.ellipse(0, 0, r * 0.38, r * 0.84, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#022c22';
      c.beginPath();
      c.arc(-r * 0.28, -r * 0.15, r * 0.09, 0, Math.PI * 2);
      c.arc(r * 0.28, -r * 0.15, r * 0.09, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#14532d';
      c.beginPath();
      c.ellipse(0, r * 0.25, r * 0.32, r * 0.22, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#f87171';
      c.beginPath();
      c.arc(0, r * 0.32, r * 0.16, Math.PI, 0);
      c.fill();
    }

    /** 7. ブロッコリー (Broccoli) - モコモコ＆紳士ヒゲ */
    function drawBroccoli(c, r) {
      c.fillStyle = '#bbf7d0';
      c.fillRect(-r * 0.25, r * 0.15, r * 0.5, r * 0.75);

      const grad = c.createRadialGradient(0, -r * 0.4, r * 0.2, 0, -r * 0.2, r * 0.9);
      grad.addColorStop(0, '#4ade80');
      grad.addColorStop(0.5, '#16a34a');
      grad.addColorStop(1, '#14532d');
      c.fillStyle = grad;

      const bumps = [
        { x: 0, y: -r * 0.55, br: r * 0.45 },
        { x: -r * 0.45, y: -r * 0.35, br: r * 0.38 },
        { x: r * 0.45, y: -r * 0.35, br: r * 0.38 },
        { x: -r * 0.65, y: 0, br: r * 0.34 },
        { x: r * 0.65, y: 0, br: r * 0.34 },
        { x: -r * 0.28, y: -r * 0.15, br: r * 0.4 },
        { x: r * 0.28, y: -r * 0.15, br: r * 0.4 }
      ];
      c.beginPath();
      for (const b of bumps) {
        c.moveTo(b.x + b.br, b.y);
        c.arc(b.x, b.y, b.br, 0, Math.PI * 2);
      }
      c.fill();

      c.fillStyle = '#064e3b';
      c.beginPath();
      c.arc(-r * 0.25, -r * 0.1, r * 0.08, 0, Math.PI * 2);
      c.arc(r * 0.25, -r * 0.1, r * 0.08, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = '#064e3b';
      c.lineWidth = Math.max(3, r * 0.06);
      c.beginPath();
      c.moveTo(-r * 0.28, r * 0.12);
      c.quadraticCurveTo(-r * 0.1, r * 0.04, 0, r * 0.15);
      c.quadraticCurveTo(r * 0.1, r * 0.04, r * 0.28, r * 0.12);
      c.stroke();
    }

    /** 8. ダイコン (Radish) - 白美肌＆おだやかな仏笑顔 */
    function drawDaikon(c, r) {
      c.fillStyle = '#16a34a';
      c.beginPath();
      c.moveTo(-r * 0.25, -r * 0.65); c.lineTo(-r * 0.35, -r * 1.05);
      c.lineTo(0, -r * 0.7);
      c.lineTo(r * 0.35, -r * 1.05); c.lineTo(r * 0.25, -r * 0.65);
      c.fill();

      const grad = c.createLinearGradient(-r * 0.4, 0, r * 0.4, 0);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.6, '#f8fafc');
      grad.addColorStop(1, '#cbd5e1');
      c.fillStyle = grad;

      c.beginPath();
      c.moveTo(-r * 0.48, -r * 0.65);
      c.quadraticCurveTo(-r * 0.42, r * 0.2, -r * 0.18, r * 0.95);
      c.quadraticCurveTo(0, r * 1.1, r * 0.18, r * 0.95);
      c.quadraticCurveTo(r * 0.42, r * 0.2, r * 0.48, -r * 0.65);
      c.quadraticCurveTo(0, -r * 0.72, -r * 0.48, -r * 0.65);
      c.fill();

      c.strokeStyle = '#334155';
      c.lineWidth = Math.max(3, r * 0.05);
      c.beginPath();
      c.arc(-r * 0.22, -r * 0.1, r * 0.1, 0, Math.PI);
      c.stroke();
      c.beginPath();
      c.arc(r * 0.22, -r * 0.1, r * 0.1, 0, Math.PI);
      c.stroke();

      c.fillStyle = 'rgba(251, 113, 133, 0.45)';
      c.beginPath();
      c.arc(-r * 0.28, r * 0.08, r * 0.09, 0, Math.PI * 2);
      c.arc(r * 0.28, r * 0.08, r * 0.09, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = '#334155';
      c.beginPath();
      c.arc(0, r * 0.12, r * 0.12, 0.2, Math.PI - 0.2);
      c.stroke();
    }

    /** 野菜描画ディスパッチャー */
    function renderVegetable(context, typeIdx, cx, cy, r, angle, alpha = 1.0) {
      context.save();
      context.globalAlpha = alpha;
      context.translate(cx, cy);
      context.rotate(angle);

      switch (typeIdx % 8) {
        case 0: drawPumpkin(context, r); break;
        case 1: drawTomato(context, r); break;
        case 2: drawEggplant(context, r); break;
        case 3: drawCarrot(context, r); break;
        case 4: drawOnion(context, r); break;
        case 5: drawPepper(context, r); break;
        case 6: drawBroccoli(context, r); break;
        case 7: drawDaikon(context, r); break;
      }

      context.restore();
    }

    class FaceTracker {
      constructor() {
        this.tracks = [];
        this.nextId = 1;
        this.lostMax = 10;
      }

      shuffle() {
        for (const t of this.tracks) {
          t.vegType = Math.floor(Math.random() * VEGETABLE_TYPES.length);
        }
      }

      clear() {
        this.tracks = [];
      }

      update(detections) {
        for (const track of this.tracks) {
          let minDist = Infinity;
          let matchedIdx = -1;

          for (let i = 0; i < detections.length; i++) {
            if (detections[i].assigned) continue;
            const dist = Math.hypot(track.targetX - detections[i].cx, track.targetY - detections[i].cy);
            if (dist < minDist && dist < track.radius * 1.5) {
              minDist = dist;
              matchedIdx = i;
            }
          }

          if (matchedIdx !== -1) {
            const hit = detections[matchedIdx];
            hit.assigned = true;

            track.targetX = hit.cx;
            track.targetY = hit.cy;
            track.targetR = hit.radius;
            track.targetAngle = hit.angle;
            track.rawScore = hit.score;
            track.landmarks = hit.landmarks;
            track.lostFrames = 0;
          } else {
            track.lostFrames++;
          }
        }

        // 新規顔の登録
        for (const hit of detections) {
          if (!hit.assigned) {
            this.tracks.push({
              id: this.nextId++,
              cx: hit.cx,
              cy: hit.cy,
              radius: hit.radius,
              angle: hit.angle,
              targetX: hit.cx,
              targetY: hit.cy,
              targetR: hit.radius,
              targetAngle: hit.angle,
              rawScore: hit.score,
              landmarks: hit.landmarks,
              vegType: Math.floor(Math.random() * VEGETABLE_TYPES.length),
              lostFrames: 0
            });
          }
        }

        this.tracks = this.tracks.filter(t => t.lostFrames <= this.lostMax);
      }

      tickInterpolation() {
        for (const t of this.tracks) {
          t.cx += (t.targetX - t.cx) * 0.40;
          t.cy += (t.targetY - t.cy) * 0.40;
          t.radius += (t.targetR - t.radius) * 0.30;

          let diffAngle = t.targetAngle - t.angle;
          while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
          while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
          t.angle += diffAngle * 0.35;
        }
      }

      getActiveTracks() {
        return this.tracks;
      }
    }

    const tracker = new FaceTracker();

    async function inferenceLoop() {
      if (!isRunning) return;

      // カメラが安全に再生準備完了している時のみ推論を実行
      if (isCameraReady && faceModel && !isInferring && video.readyState >= 2 && video.videoWidth > 0) {
        isInferring = true;
        try {
          const faces = await faceModel.estimateFaces(video, false);

          const vw = video.videoWidth;
          const vh = video.videoHeight;
          const cw = canvas.width;
          const ch = canvas.height;

          // カバー表示スケール計算
          const scale = Math.max(cw / vw, ch / vh);
          const renderW = vw * scale;
          const renderH = vh * scale;
          const offsetX = (cw - renderW) / 2;
          const offsetY = (ch - renderH) / 2;

          // ビデオ座標からキャンバス座標への変換（インカメラ時はX反転）
          const toScreenX = (vx) => {
            if (isFrontCamera) {
              return cw - (offsetX + vx * scale);
            }
            return offsetX + vx * scale;
          };
          const toScreenY = (vy) => offsetY + vy * scale;

          const detections = [];

          for (let i = 0; i < faces.length; i++) {
            const face = faces[i];
            const prob = face.probability ? (Array.isArray(face.probability) ? face.probability[0] : face.probability) : 1.0;

            if (prob < scoreThreshold) continue;

            const [vx1, vy1] = face.topLeft;
            const [vx2, vy2] = face.bottomRight;
            const boxW = Math.abs(vx2 - vx1) * scale;
            const boxH = Math.abs(vy2 - vy1) * scale;

            // 大きさ1.0: 顔サイズに自然にフィットするスケール
            const radius = Math.max(boxW, boxH) * 0.54;

            // ランドマーク（両目・鼻）
            const ptRightEye = face.landmarks[0]; // 被写体の右目
            const ptLeftEye = face.landmarks[1];  // 被写体の左目
            const ptNose = face.landmarks[2];

            const eyeA = { x: toScreenX(ptRightEye[0]), y: toScreenY(ptRightEye[1]) };
            const eyeB = { x: toScreenX(ptLeftEye[0]), y: toScreenY(ptLeftEye[1]) };
            const noseScr = { x: toScreenX(ptNose[0]), y: toScreenY(ptNose[1]) };

            // 【首の傾き（Roll角）の計算】
            // 画面上のX座標順で左右の目をソートすることで、前面・背面どちらでも正確に追従
            const leftEyeScreen = eyeA.x < eyeB.x ? eyeA : eyeB;
            const rightEyeScreen = eyeA.x < eyeB.x ? eyeB : eyeA;
            const tiltAngle = Math.atan2(rightEyeScreen.y - leftEyeScreen.y, rightEyeScreen.x - leftEyeScreen.x);

            // 顔の中心点
            const midEyeX = (eyeA.x + eyeB.x) * 0.5;
            const midEyeY = (eyeA.y + eyeB.y) * 0.5;
            const faceCenterX = midEyeX + (noseScr.x - midEyeX) * 0.22;
            const faceCenterY = midEyeY + (noseScr.y - midEyeY) * 0.32;

            const screenLandmarks = face.landmarks.map(pt => ({
              x: toScreenX(pt[0]),
              y: toScreenY(pt[1])
            }));

            detections.push({
              cx: faceCenterX,
              cy: faceCenterY,
              radius: radius,
              angle: tiltAngle,
              score: prob,
              landmarks: screenLandmarks,
              assigned: false
            });
          }

          tracker.update(detections);
          badgeCount.textContent = `${tracker.getActiveTracks().length}人`;
        } catch (err) {
          // カメラ切替タイミングなどでのフレーム破棄を安全に無視
        } finally {
          isInferring = false;
        }
      }

      // 非ブロッキングで継続実行（約24ms間隔）
      setTimeout(inferenceLoop, 24);
    }

    function render(now) {
      if (!isRunning) return;

      // FPS計測
      fpsWindow.push(now);
      while (fpsWindow.length > 0 && fpsWindow[0] < now - 1000) {
        fpsWindow.shift();
      }
      if (now - lastFpsTextUpdate > 250) {
        badgeFps.textContent = `${fpsWindow.length}fps`;
        lastFpsTextUpdate = now;
      }

      tracker.tickInterpolation();

      if (isCameraReady && video.readyState >= 2 && video.videoWidth > 0) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const cw = canvas.width;
        const ch = canvas.height;

        const scale = Math.max(cw / vw, ch / vh);
        const renderW = vw * scale;
        const renderH = vh * scale;
        const offsetX = (cw - renderW) / 2;
        const offsetY = (ch - renderH) / 2;

        // カメラ映像の描画（インカメラ時は鏡像反転）
        ctx.save();
        if (isFrontCamera) {
          ctx.translate(cw, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, offsetX, offsetY, renderW, renderH);
        ctx.restore();

        // 検出トラックの野菜描画
        const activeTracks = tracker.getActiveTracks();
        for (let i = 0; i < activeTracks.length; i++) {
          const t = activeTracks[i];
          let alpha = 1.0;
          if (t.lostFrames > 2) {
            alpha = Math.max(0, 1.0 - (t.lostFrames - 2) / (tracker.lostMax - 2));
          }

          renderVegetable(ctx, t.vegType, t.cx, t.cy, t.radius, t.angle, alpha);

          // デバッグ枠
          if (showDebug) {
            ctx.save();
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 2;
            ctx.strokeRect(t.cx - t.radius, t.cy - t.radius, t.radius * 2, t.radius * 2);

            ctx.fillStyle = '#22c55e';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(`${VEGETABLE_TYPES[t.vegType]} (${(t.rawScore * 100).toFixed(0)}%)`, t.cx - t.radius, t.cy - t.radius - 6);

            if (t.landmarks) {
              ctx.fillStyle = '#ef4444';
              for (const pt of t.landmarks) {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fill();
              }
            }
            ctx.restore();
          }
        }
      } else {
        // カメラ切り替え待機中は背景をクリア
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(render);
    }

    /**
     * カメラの起動および切り替えライフサイクル管理
     * 連続実行時のハードウェア競合（NotReadableError/AbortError）を徹底防止
     */
    async function startCamera(facingMode) {
      isCameraReady = false;

      // 1. 既存ストリームの完全解放と破棄
      if (currentStream) {
        currentStream.getTracks().forEach(tr => {
          try { tr.stop(); } catch (e) {}
        });
        currentStream = null;
      }
      try {
        video.pause();
        video.srcObject = null;
      } catch (e) {}

      // 既存トラックの追従キャッシュをリセット
      tracker.clear();
      badgeCount.textContent = '0人';

      // 2. モバイルOSのカメラセンサーおよびハードウェア解放待ちクールダウン（250ms）
      await new Promise(resolve => setTimeout(resolve, 250));

      // 3. モバイル向けに640x480の快適解像度を指定
      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;

      // iOS Safari/Chrome等での完全自動再生設定
      video.muted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      await video.play();

      // 4. ビデオフレームが正しく読み出せるまで確実に待機
      await new Promise(resolve => {
        if (video.readyState >= 2 && video.videoWidth > 0) return resolve();
        const onReady = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            video.removeEventListener('loadeddata', onReady);
            video.removeEventListener('canplay', onReady);
            resolve();
          }
        };
        video.addEventListener('loadeddata', onReady);
        video.addEventListener('canplay', onReady);
        // 万一のフォールバックタイムアウト
        setTimeout(resolve, 1500);
      });

      isCameraReady = true;
    }

    // カメラ切り替えボタンのクリックハンドラ（二重呼び出し防止排他ガード付き）
    switchCameraBtn.addEventListener('click', async () => {
      if (isSwitchingCamera) return;
      isSwitchingCamera = true;
      switchCameraBtn.disabled = true;

      const prevBtnText = switchCameraBtn.textContent;
      switchCameraBtn.textContent = '🔄 切替中...';

      // 前面/背面のトグル
      isFrontCamera = !isFrontCamera;

      try {
        await startCamera(isFrontCamera ? 'user' : 'environment');
        switchCameraBtn.textContent = isFrontCamera ? '🤳 前面カメラ' : '📷 背面カメラ';
      } catch (err) {
        console.error("Camera switch error:", err);
        // 万一失敗した場合は元に戻す
        isFrontCamera = !isFrontCamera;
        switchCameraBtn.textContent = prevBtnText;
        try {
          await startCamera(isFrontCamera ? 'user' : 'environment');
        } catch (e) {}
      } finally {
        switchCameraBtn.disabled = false;
        isSwitchingCamera = false;
      }
    });

    /**
     * アプリケーションの自動起動（タップ不要）
     */
    async function bootstrap() {
      if (isRunning) return;
      isRunning = true;

      // 1. 描画ループを直ちに開始
      requestAnimationFrame(render);

      // 2. カメラの自動起動（初回は研修用に背面カメラ）
      try {
        await startCamera(isFrontCamera ? 'user' : 'environment');
      } catch (err) {
        console.warn("Camera init retry listener attached:", err);
        const fallback = async () => {
          window.removeEventListener('pointerdown', fallback);
          try {
            await startCamera(isFrontCamera ? 'user' : 'environment');
          } catch (e) {}
        };
        window.addEventListener('pointerdown', fallback);
      }

      // 3. BlazeFaceモデルのバックグラウンド非同期ロード
      try {
        faceModel = await blazeface.load({ maxFaces: 20, scoreThreshold: 0.15 });
        // ロード完了次第、推論ループを稼働
        inferenceLoop();
      } catch (e) {
        console.error("Model load failed:", e);
      }
    }

    // ページロード完了で即座に開始
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
