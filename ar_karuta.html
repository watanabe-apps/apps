<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quest 3 MR カルタ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, sans-serif;
    }
    #overlay-ui {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }
    .start-btn {
      background: #0070D1;
      color: #fff;
      font-size: 26px;
      font-weight: bold;
      padding: 20px 48px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 112, 209, 0.6);
    }
    .start-btn:active {
      transform: scale(0.96);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="overlay-ui">
    <button id="btn-enter-ar" class="start-btn">MR カルタをはじめる</button>
  </div>

  <script>
    // MARK: - 3D空間オーディオ（Web Audio API + PannerNode）
    class SpatialSoundSynth {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playAtPosition(position) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const panner = this.ctx.createPanner();
        panner.panningModel = 'HRTF';
        panner.distanceModel = 'inverse';
        panner.refDistance = 1;
        panner.maxDistance = 10;
        panner.rolloffFactor = 1;
        panner.positionX.setValueAtTime(position.x, now);
        panner.positionY.setValueAtTime(position.y, now);
        panner.positionZ.setValueAtTime(position.z, now);
        panner.connect(this.ctx.destination);

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.4, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
          osc.connect(gain);
          gain.connect(panner);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.25);
        });
      }
    }

    const sound = new SpatialSoundSynth();

    // MARK: - ゲーム定数
    const WORDS = [
      "いぬ", "ねこ", "くるま", "りんご", "ぼおる",
      "ひこうき", "ばなな", "とけい", "ぼうし", "くつ",
      "えんぴつ", "たいよう", "おはな", "とり", "さかな"
    ];
    let remainingWords = [];
    let currentTargetWord = "";
    let score = 0;

    // MARK: - Three.js 変数
    let scene, camera, renderer;
    let cardMeshes = {};
    let hand0, hand1;
    let controller0, controller1;
    let hudMesh = null;
    let hudCanvas, hudCtx, hudTexture;
    let laserLine = null;
    let laserFrames = 0;
    let isProcessingHit = false;

    document.getElementById("btn-enter-ar").addEventListener("click", () => {
      sound.init();
      startWebXR();
    });

    // MARK: - WebXR セッション開始
    async function startWebXR() {
      if (!navigator.xr) {
        alert("WebXR非対応ブラウザです。Quest 3のMeta Quest Browserで開いてください。");
        return;
      }
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        alert("immersive-ar に対応していません。");
        return;
      }

      initThreeJS();

      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local-floor'],
        optionalFeatures: ['hand-tracking', 'hit-test']
      });

      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);
      document.getElementById("overlay-ui").style.display = "none";

      setupGame();
    }

    function initThreeJS() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 50);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 環境光（カードが見やすくなる均等光）
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      // コントローラー・ハンドトラッキング初期化
      controller0 = renderer.xr.getController(0);
      controller1 = renderer.xr.getController(1);
      scene.add(controller0);
      scene.add(controller1);

      // コントローラーのトリガーでもヒント発動
      controller0.addEventListener('selectstart', triggerHint);
      controller1.addEventListener('selectstart', triggerHint);

      hand0 = renderer.xr.getHand(0);
      hand1 = renderer.xr.getHand(1);
      scene.add(hand0);
      scene.add(hand1);

      // 3D HUD（視界上部に追従するお題ボード）
      createFloatingHUD();

      // ヒント用3Dレーザービーム
      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
      const laserMat = new THREE.LineBasicMaterial({ color: 0xFFEB3B, linewidth: 5 });
      laserLine = new THREE.Line(laserGeo, laserMat);
      laserLine.visible = false;
      scene.add(laserLine);

      renderer.setAnimationLoop(renderLoop);
    }

    // MARK: - 3D HUD（視界追従パネル）
    function createFloatingHUD() {
      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 1024;
      hudCanvas.height = 360;
      hudCtx = hudCanvas.getContext('2d');
      hudTexture = new THREE.CanvasTexture(hudCanvas);

      const mat = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true });
      const geo = new THREE.PlaneGeometry(0.7, 0.25);
      hudMesh = new THREE.Mesh(geo, mat);
      scene.add(hudMesh);
      updateHUD("さがして タッチ！", "");
    }

    function updateHUD(subText, mainWord) {
      hudCtx.clearRect(0, 0, 1024, 360);
      
      // 角丸プレート
      hudCtx.fillStyle = "rgba(255, 255, 255, 0.95)";
      roundRect(hudCtx, 20, 20, 984, 320, 40);
      hudCtx.fill();

      // 枠線
      hudCtx.strokeStyle = "#0070D1";
      hudCtx.lineWidth = 12;
      roundRect(hudCtx, 20, 20, 984, 320, 40);
      hudCtx.stroke();

      // サブ情報
      hudCtx.fillStyle = "#555";
      hudCtx.font = "bold 44px sans-serif";
      hudCtx.textAlign = "center";
      hudCtx.fillText(`${subText}   (とったかず: ${score})`, 512, 100);

      // メイン単語
      hudCtx.fillStyle = "#0070D1";
      hudCtx.font = "900 120px sans-serif";
      hudCtx.fillText(mainWord || "---", 512, 240);

      hudTexture.needsUpdate = true;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // MARK: - ゲームロジック
    function setupGame() {
      score = 0;
      remainingWords = [...WORDS].sort(() => 0.5 - Math.random()).slice(0, 10);
      spawnCards(remainingWords);
      nextTarget();
    }

    function nextTarget() {
      if (remainingWords.length > 0) {
        currentTargetWord = remainingWords[Math.floor(Math.random() * remainingWords.length)];
        updateHUD("つぎの カードに てで タッチ！", currentTargetWord);
      } else {
        currentTargetWord = "";
        updateHUD("ぜんぶ とれたよ！ クリア！", "🎉");
      }
      isProcessingHit = false;
    }

    // 部屋の中（床から0.6m〜1.2m、周囲1.2m〜2.2m）にカードを分散配置
    function spawnCards(words) {
      Object.values(cardMeshes).forEach(mesh => scene.remove(mesh));
      cardMeshes = {};

      const count = words.length;
      words.forEach((word, i) => {
        const mesh = createCardMesh(word);
        const angle = (i / count) * Math.PI * 2 + (Math.random() * 0.4 - 0.2);
        const dist = 1.3 + Math.random() * 0.8;

        mesh.position.set(
          Math.sin(angle) * dist,
          0.65 + Math.random() * 0.55, // 床から65cm〜120cmの高さ
          -Math.cos(angle) * dist
        );

        scene.add(mesh);
        cardMeshes[word] = mesh;
      });
    }

    // 厚み1cmの直方体カードメッシュ生成
    function createCardMesh(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 360;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = "#FFFFFF";
      roundRect(ctx, 12, 12, 336, 456, 32);
      ctx.fill();

      ctx.strokeStyle = "#0070D1";
      ctx.lineWidth = 16;
      roundRect(ctx, 12, 12, 336, 456, 32);
      ctx.stroke();

      ctx.fillStyle = "#111";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let fontSize = 110;
      ctx.font = `bold ${fontSize}px sans-serif`;
      while (ctx.measureText(text).width > 300 && fontSize > 36) {
        fontSize -= 6;
        ctx.font = `bold ${fontSize}px sans-serif`;
      }
      ctx.fillText(text, 180, 240);

      const texture = new THREE.CanvasTexture(canvas);
      const faceMat = new THREE.MeshBasicMaterial({ map: texture });
      const sideMat = new THREE.MeshBasicMaterial({ color: 0x0070D1 });

      // 直方体（幅22cm, 高さ28cm, 厚み1cm）
      const geo = new THREE.BoxGeometry(0.22, 0.28, 0.01);
      const materials = [sideMat, sideMat, sideMat, sideMat, faceMat, sideMat];
      const mesh = new THREE.Mesh(geo, materials);
      mesh.name = text;
      return mesh;
    }

    // MARK: - ヒント（手元からカードへのレーザー照射）
    function triggerHint() {
      if (!currentTargetWord || !cardMeshes[currentTargetWord]) return;
      laserFrames = 120; // 2秒間照射
      laserLine.visible = true;
    }

    // MARK: - ハンドトラッキング取得判定
    function checkTouchInteractions() {
      if (isProcessingHit || !currentTargetWord || !cardMeshes[currentTargetWord]) return;

      const targetMesh = cardMeshes[currentTargetWord];
      const cardPos = targetMesh.position;
      const touchThreshold = 0.12; // 12cm以内判定

      // 判定対象のポイント（右手・左手の人差し指先、またはコントローラー先端）
      const touchPoints = [];

      // ハンドトラッキング（人差し指先端: index-finger-tip）
      [hand0, hand1].forEach(hand => {
        if (hand && hand.joints && hand.joints['index-finger-tip']) {
          const tip = hand.joints['index-finger-tip'];
          if (tip.position) {
            touchPoints.push(tip.position);
          }
        }
      });

      // コントローラー先端
      [controller0, controller1].forEach(c => {
        if (c && c.visible) {
          touchPoints.push(c.position);
        }
      });

      // 接触判定
      for (const pt of touchPoints) {
        if (pt.distanceTo(cardPos) < touchThreshold) {
          isProcessingHit = true;
          collectCard(currentTargetWord, targetMesh);
          break;
        }
      }
    }

    function collectCard(word, mesh) {
      sound.playAtPosition(mesh.position);
      create3DParticleBurst(mesh.position);

      delete cardMeshes[word];
      score++;
      remainingWords = remainingWords.filter(w => w !== word);

      // 取得アニメーション（縮小消滅）
      const startScale = mesh.scale.x;
      const startTime = performance.now();
      function shrink(now) {
        const elapsed = (now - startTime) / 180;
        if (elapsed < 1) {
          const s = startScale * (1 - elapsed);
          mesh.scale.set(s, s, s);
          requestAnimationFrame(shrink);
        } else {
          scene.remove(mesh);
          nextTarget();
        }
      }
      requestAnimationFrame(shrink);
    }

    // 3Dスパークル爆発パーティクル
    function create3DParticleBurst(position) {
      const count = 20;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const velocities = [];

      for (let i = 0; i < count; i++) {
        positions[i * 3] = position.x;
        positions[i * 3 + 1] = position.y;
        positions[i * 3 + 2] = position.z;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const speed = 0.8 + Math.random() * 1.2;
        velocities.push(new THREE.Vector3(
          Math.sin(phi) * Math.cos(theta) * speed,
          Math.sin(phi) * Math.sin(theta) * speed,
          Math.cos(phi) * speed
        ));
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xFFEB3B, size: 0.04, transparent: true, opacity: 1.0 });
      const pSystem = new THREE.Points(geo, mat);
      scene.add(pSystem);

      const startTime = performance.now();
      function animParticles(now) {
        const elapsed = (now - startTime) / 400;
        if (elapsed < 1) {
          const posArr = pSystem.geometry.attributes.position.array;
          for (let i = 0; i < count; i++) {
            posArr[i * 3] += velocities[i].x * 0.016;
            posArr[i * 3 + 1] += velocities[i].y * 0.016;
            posArr[i * 3 + 2] += velocities[i].z * 0.016;
          }
          pSystem.geometry.attributes.position.needsUpdate = true;
          mat.opacity = 1.0 - elapsed;
          requestAnimationFrame(animParticles);
        } else {
          scene.remove(pSystem);
        }
      }
      requestAnimationFrame(animParticles);
    }

    // MARK: - メインレンダーループ
    function renderLoop() {
      // 1. HUDを視界前方（視線やや上、0.9m先）にスムーズ追従
      if (hudMesh) {
        const forward = new THREE.Vector3(0, 0.22, -0.9).applyQuaternion(camera.quaternion);
        hudMesh.position.copy(camera.position).add(forward);
        hudMesh.lookAt(camera.position);
      }

      // 2. 全カードをプレイヤー正面に向ける（ビルボード）
      Object.values(cardMeshes).forEach(mesh => {
        mesh.lookAt(camera.position);
      });

      // 3. ハンドトラッキング / コントローラー接触判定
      checkTouchInteractions();

      // 4. 3Dレーザービームの追従描画
      if (laserFrames > 0 && currentTargetWord && cardMeshes[currentTargetWord]) {
        laserFrames--;
        const targetPos = cardMeshes[currentTargetWord].position;
        
        // 手元座標（右手ハンド先端、なければコントローラー、なければヘッドセット前方下）
        let startPos = camera.position.clone().add(new THREE.Vector3(0.1, -0.15, -0.3).applyQuaternion(camera.quaternion));
        if (hand0 && hand0.joints && hand0.joints['index-finger-tip'] && hand0.joints['index-finger-tip'].position) {
          startPos = hand0.joints['index-finger-tip'].position;
        } else if (controller0 && controller0.visible) {
          startPos = controller0.position;
        }

        const positions = laserLine.geometry.attributes.position.array;
        positions[0] = startPos.x; positions[1] = startPos.y; positions[2] = startPos.z;
        positions[3] = targetPos.x; positions[4] = targetPos.y; positions[5] = targetPos.z;
        laserLine.geometry.attributes.position.needsUpdate = true;
      } else {
        laserLine.visible = false;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
