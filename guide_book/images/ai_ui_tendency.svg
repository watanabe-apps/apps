<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="auto" style="background:#ffffff; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'UD Digi Kyokasho NK-R', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;">
  <defs>
    <!-- ドロップシャドウ -->
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ==================== 左側：AIが作成した画面実例（タブレット） ==================== -->
  <!-- タブレットベゼル -->
  <rect x="20" y="20" width="580" height="460" rx="16" fill="#0f172a"/>
  <!-- 液晶画面エリア -->
  <rect x="34" y="34" width="552" height="432" rx="6" fill="#ffffff"/>

  <!-- [② ヘッダー] 上部ヘッダーバー -->
  <rect x="34" y="34" width="552" height="42" fill="#334155"/>
  <text x="50" y="60" font-size="14" font-weight="bold" fill="#ffffff">🧩 たのしいくだものあわせ</text>
  <rect x="440" y="44" width="130" height="22" rx="4" fill="#1e293b"/>
  <text x="455" y="59" font-size="11" font-weight="bold" fill="#38bdf8">もんだい 1 / 5 ⭐️</text>

  <!-- 文字指示文バナー（ノイズ） -->
  <rect x="46" y="84" width="528" height="30" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>
  <text x="58" y="104" font-size="11" font-weight="bold" fill="#854d0e">⚠️ しじ：したの ３つのわくのなかに、くだものをいれてね！</text>

  <!-- [④ 枠の多用] 上部受け皿セクション枠 -->
  <rect x="46" y="122" width="528" height="122" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="58" y="140" font-size="11" font-weight="bold" fill="#64748b">【うけざらエリア（不要な外枠）】</text>

  <!-- [① 隙間・角丸] スロット枠 -->
  <rect x="110" y="152" width="76" height="76" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="135" y="196" font-size="13" font-weight="bold" fill="#94a3b8">枠 1</text>

  <rect x="272" y="152" width="76" height="76" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="297" y="196" font-size="13" font-weight="bold" fill="#94a3b8">枠 2</text>

  <rect x="434" y="152" width="76" height="76" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="459" y="196" font-size="13" font-weight="bold" fill="#94a3b8">枠 3</text>

  <!-- 隙間（gap）の図示矢印 -->
  <line x1="190" y1="190" x2="268" y2="190" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="206" y="183" font-size="11" font-weight="bold" fill="#ef4444">隙間 (gap)</text>

  <line x1="352" y1="190" x2="430" y2="190" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="368" y="183" font-size="11" font-weight="bold" fill="#ef4444">隙間 (gap)</text>

  <!-- [④ 枠の多用] 下部くだもの置き場セクション枠 -->
  <rect x="46" y="254" width="528" height="136" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="272" font-size="11" font-weight="bold" fill="#64748b">【くだものトレイ（さらに二重枠）】</text>

  <!-- [③ カード化] りんご・バナナ・ぶどう -->
  <g transform="translate(110, 286)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="76" height="76" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="20" y="52" font-size="38">🍎</text>
  </g>

  <g transform="translate(272, 286)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="76" height="76" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="20" y="52" font-size="38">🍌</text>
  </g>

  <g transform="translate(434, 286)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="76" height="76" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="20" y="52" font-size="38">🍇</text>
  </g>


  <!-- ==================== 右側：本文4.6の項目と完全一致した解説 ==================== -->

  <!-- ① 枠と枠の間に隙間を空けて配置する -->
  <g transform="translate(620, 24)" filter="url(#panel-shadow)">
    <rect x="0" y="0" width="300" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="24" rx="4" fill="#fee2e2"/>
    <text x="18" y="26" font-size="12" font-weight="bold" fill="#b91c1c">① 枠と枠の間に隙間を空ける</text>
    <text x="14" y="52" font-size="11" fill="#475569">・マス同士の間に不要な隙間（gap）ができる</text>
    <text x="14" y="70" font-size="11" fill="#475569">・角丸の四角形になり、紙プリントと形が乖離</text>
    <text x="14" y="86" font-size="10" font-weight="bold" fill="#0284c7">➜ 対策：プリント同様に枠をつなげて配置</text>
  </g>
  <!-- 引き出し線 ① -->
  <path d="M 620 73 L 420 178" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <!-- ② ヘッダーを配置する -->
  <g transform="translate(620, 136)" filter="url(#panel-shadow)">
    <rect x="0" y="0" width="300" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="24" rx="4" fill="#fee2e2"/>
    <text x="18" y="26" font-size="12" font-weight="bold" fill="#b91c1c">② ヘッダーを配置する</text>
    <text x="14" y="52" font-size="11" fill="#475569">・上部にタイトルバー等をドカンと置きがち</text>
    <text x="14" y="70" font-size="11" fill="#475569">・横長タブレットの貴重な上下幅を圧迫する</text>
    <text x="14" y="86" font-size="10" font-weight="bold" fill="#0284c7">➜ 対策：ヘッダー廃止、問題数は端に小さく</text>
  </g>
  <!-- 引き出し線 ② -->
  <path d="M 620 185 L 586 55" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <!-- ③ オブジェクトをカード化する -->
  <g transform="translate(620, 248)" filter="url(#panel-shadow)">
    <rect x="0" y="0" width="300" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="24" rx="4" fill="#fee2e2"/>
    <text x="18" y="26" font-size="12" font-weight="bold" fill="#b91c1c">③ オブジェクトをカード化する</text>
    <text x="14" y="52" font-size="11" fill="#475569">・画像をそのまま出さず四角い枠・影を付与</text>
    <text x="14" y="70" font-size="11" fill="#475569">・「りんごを動かす」感覚が薄れ枠幅も消費</text>
    <text x="14" y="86" font-size="10" font-weight="bold" fill="#0284c7">➜ 対策：枠なしイラストそのままでもOK</text>
  </g>
  <!-- 引き出し線 ③ -->
  <path d="M 620 297 L 515 324" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <!-- ④ 枠を多用する -->
  <g transform="translate(620, 360)" filter="url(#panel-shadow)">
    <rect x="0" y="0" width="300" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="24" rx="4" fill="#fee2e2"/>
    <text x="18" y="26" font-size="12" font-weight="bold" fill="#b91c1c">④ 枠を多用する（重層の囲み枠）</text>
    <text x="14" y="52" font-size="11" fill="#475569">・エリアごとに何重もの枠線で囲ってしまう</text>
    <text x="14" y="70" font-size="11" fill="#475569">・構造化のつもりが画面の情報量過多・ノイズに</text>
    <text x="14" y="86" font-size="10" font-weight="bold" fill="#0284c7">➜ 対策：不要な外枠を削り主役を際立たせる</text>
  </g>
  <!-- 引き出し線 ④ -->
  <path d="M 620 409 L 574 270" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
</svg>