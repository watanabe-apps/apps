<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>検証デモE：数字カード並べ替え（強化学習イメージ体験）</title>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: "UD Digi Kyokasho NK-R", "UD Digital Kyokasho NK-R", "Klee One", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    /* ヘッダー操作バー */
    header {
      background: #ffffff;
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }
    .back-link {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      touch-action: manipulation;
    }
    .back-link:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .range-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .range-label {
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 700;
      padding-left: 4px;
    }
    .range-btn {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .range-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
    }
    .reset-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }
    .reset-btn:active {
      background: #e2e8f0;
    }

    /* プレイエリア */
    #play-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 16px;
      position: relative;
    }

    /* 枠コンテナ（上部） */
    .section-title-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 6px;
    }
    .target-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #grid-container {
      display: flex;
      gap: 12px;
      padding: 12px 18px;
      background: #ffffff;
      border-radius: 14px;
      border: 2px dashed #94a3b8;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
    }
    .grid-cell {
      border: 3px solid #94a3b8;
      border-radius: 12px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #cbd5e1;
      position: relative;
    }
    .grid-cell::before {
      content: attr(data-hint);
      font-size: 0.45em;
      color: #cbd5e1;
      position: absolute;
      top: 4px;
      left: 6px;
      opacity: 0.8;
    }

    /* カード置き場（下部） */
    .tray-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #tray-container {
      display: flex;
      gap: 12px;
      min-height: 80px;
      padding: 12px 18px;
      background: #e2e8f0;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
    }

    /* 数字ブロック（カード） */
    .number-block {
      position: absolute;
      background: #ffffff;
      border: 3px solid #0284c7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #0284c7;
      box-shadow: 0 6px 12px rgba(2, 132, 199, 0.2);
      cursor: grab;
      touch-action: none;
      z-index: 10;
    }
    .number-block.dragging {
      cursor: grabbing;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
      transform: scale(1.08);
      z-index: 999;
      opacity: 0.95;
    }
    .number-block.animating {
      transition: left 0.22s ease-out, top 0.22s ease-out, transform 0.15s ease;
    }
    .number-block.correct {
      border-color: #15803d;
      color: #15803d;
      background: #f0fdf4;
      box-shadow: 0 2px 6px rgba(21, 128, 61, 0.2);
      cursor: default;
    }

    /* 正解エフェクト */
    #correct-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: clamp(140px, 35vw, 240px);
      color: #ef4444;
      font-weight: bold;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      line-height: 1;
    }
    #correct-mark.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.85;
    }

    /* クリア時オーバーレイボタン */
    #next-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      display: none;
    }
    .btn-next {
      background: #15803d;
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 6px 16px rgba(21, 128, 61, 0.35);
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }
    .btn-next:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <div class="range-selector">
      <span class="range-label">並べる範囲:</span>
      <button class="range-btn active" onclick="setRange(2)">1〜2</button>
      <button class="range-btn" onclick="setRange(3)">1〜3</button>
      <button class="range-btn" onclick="setRange(5)">1〜5</button>
      <button class="range-btn" onclick="setRange(10)">1〜10</button>
    </div>

    <button class="reset-btn" onclick="initGame()">もう一度</button>
  </header>

  <main id="play-area">
    <!-- 上部：並べる枠 -->
    <div class="target-wrapper">
      <div class="section-title-label">枠（左から小さい順に並べる）</div>
      <div id="grid-container"></div>
    </div>

    <!-- 下部：カード置き場 -->
    <div class="tray-wrapper">
      <div class="section-title-label">カード（数字を選んで枠へ運ぶ）</div>
      <div id="tray-container"></div>
    </div>

    <!-- 正解マーク -->
    <div id="correct-mark">◯</div>

    <!-- つぎへボタン -->
    <div id="next-overlay">
      <button class="btn-next" onclick="initGame()">できた！もう一度 ➜</button>
    </div>
  </main>

  <script>
    let currentMax = 2; // デフォルトは1〜2（すぐに成功体験が得られる設定）
    let panels = [];
    let blocks = [];
    let cellSize = 80;
    let zIndexCounter = 10;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    ['pointerdown', 'touchstart', 'click'].forEach(evt => {
      window.addEventListener(evt, initAudio, { once: true });
    });

    function playCorrectSound() {
      initAudio();
      if (!audioCtx) return;
      try {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
        osc2.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime + 0.15);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(audioCtx.currentTime);
        osc1.stop(audioCtx.currentTime + 0.15);
        osc2.start(audioCtx.currentTime + 0.15);
        osc2.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function setRange(max) {
      currentMax = max;
      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === `1〜${max}`);
      });
      initGame();
    }

    function calcCellSize() {
      const areaWidth = window.innerWidth - 48;
      const areaHeight = (window.innerHeight - 80) / 2 - 60;
      // currentMax個並べた時の幅と高さ
      const maxCol = currentMax;
      const widthPerCell = Math.floor((areaWidth - (maxCol - 1) * 12 - 36) / maxCol);
      const ideal = Math.min(widthPerCell, areaHeight, 100);
      cellSize = Math.max(ideal, 48);
    }

    function initGame() {
      document.getElementById('correct-mark').classList.remove('show');
      document.getElementById('next-overlay').style.display = 'none';

      // 既存ブロックの削除
      blocks.forEach(b => {
        if (b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
      });
      blocks = [];
      panels = [];

      calcCellSize();

      // 1. 枠（grid-container）の生成
      const gridContainer = document.getElementById('grid-container');
      gridContainer.innerHTML = '';
      for (let i = 1; i <= currentMax; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.style.width = `${cellSize}px`;
        cell.style.height = `${cellSize}px`;
        cell.style.fontSize = `${cellSize * 0.55}px`;
        cell.dataset.hint = i; // うっすらヒント
        cell.dataset.num = i;
        gridContainer.appendChild(cell);
        panels.push({ num: i, el: cell, answer: null });
      }

      // 2. トレイ（tray-container）のプレースホルダー生成
      const trayContainer = document.getElementById('tray-container');
      trayContainer.innerHTML = '';
      for (let i = 1; i <= currentMax; i++) {
        const placeholder = document.createElement('div');
        placeholder.style.width = `${cellSize}px`;
        placeholder.style.height = `${cellSize}px`;
        placeholder.style.opacity = '0';
        trayContainer.appendChild(placeholder);
      }

      // 枠・トレイの位置確定（レンダリング待機）
      requestAnimationFrame(() => {
        panels.forEach(p => {
          const rect = p.el.getBoundingClientRect();
          p.x = rect.left;
          p.y = rect.top;
        });

        // シャッフル用インデックス配列
        let indices = Array.from({ length: currentMax }, (_, i) => i);
        // 必ず一度はシャッフルされるようにする（currentMax >= 2 の場合）
        if (currentMax > 1) {
          do {
            indices.sort(() => Math.random() - 0.5);
          } while (indices.every((val, idx) => val === idx));
        }

        const trayPlaceholders = trayContainer.children;
        for (let i = 0; i < currentMax; i++) {
          const num = i + 1;
          const slotIndex = indices[i];
          const slotRect = trayPlaceholders[slotIndex].getBoundingClientRect();

          const blockEl = document.createElement('div');
          blockEl.className = 'number-block animating';
          blockEl.innerText = num;
          blockEl.style.width = `${cellSize}px`;
          blockEl.style.height = `${cellSize}px`;
          blockEl.style.fontSize = `${cellSize * 0.65}px`;
          blockEl.style.left = `${slotRect.left}px`;
          blockEl.style.top = `${slotRect.top}px`;
          document.body.appendChild(blockEl);

          const blockObj = {
            num: num,
            el: blockEl,
            startX: slotRect.left,
            startY: slotRect.top,
            currentX: slotRect.left,
            currentY: slotRect.top,
            isPlacedCorrectly: false
          };
          blocks.push(blockObj);
          setupDrag(blockObj);
        }
      });
    }

    function setupDrag(block) {
      let isDragging = false;
      let offsetX = 0, offsetY = 0;

      block.el.addEventListener('pointerdown', (e) => {
        if (block.isPlacedCorrectly) return;
        initAudio();
        isDragging = true;
        block.el.setPointerCapture(e.pointerId);
        block.el.classList.remove('animating');
        block.el.classList.add('dragging');
        block.el.style.zIndex = ++zIndexCounter;

        const rect = block.el.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        // 枠から剥がす
        const assignedPanel = panels.find(p => p.answer === block.num);
        if (assignedPanel) assignedPanel.answer = null;
      });

      block.el.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const newX = e.clientX - offsetX;
        const newY = e.clientY - offsetY;
        block.currentX = newX;
        block.currentY = newY;
        block.el.style.left = `${newX}px`;
        block.el.style.top = `${newY}px`;
      });

      const endDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { block.el.releasePointerCapture(e.pointerId); } catch(err){}
        block.el.classList.remove('dragging');
        block.el.classList.add('animating');

        const blockCenterX = block.currentX + cellSize / 2;
        const blockCenterY = block.currentY + cellSize / 2;
        const snapThreshold = cellSize * 0.75;
        let snapped = false;

        // 一番近い空いている枠を探す
        for (let panel of panels) {
          const panelCenterX = panel.x + cellSize / 2;
          const panelCenterY = panel.y + cellSize / 2;
          const dist = Math.hypot(blockCenterX - panelCenterX, blockCenterY - panelCenterY);

          if (dist < snapThreshold && panel.answer === null) {
            block.currentX = panel.x;
            block.currentY = panel.y;
            block.el.style.left = `${panel.x}px`;
            block.el.style.top = `${panel.y}px`;
            panel.answer = block.num;
            snapped = true;
            break;
          }
        }

        // 吸着しなかったら元の位置に戻る
        if (!snapped) {
          block.currentX = block.startX;
          block.currentY = block.startY;
          block.el.style.left = `${block.startX}px`;
          block.el.style.top = `${block.startY}px`;
        }

        setTimeout(checkAnswers, 250);
      };

      block.el.addEventListener('pointerup', endDrag);
      block.el.addEventListener('pointercancel', endDrag);
    }

    function checkAnswers() {
      const allFilled = panels.every(p => p.answer !== null);
      if (!allFilled) return;

      let allCorrect = true;
      panels.forEach(panel => {
        const block = blocks.find(b => b.num === panel.answer);
        if (!block) return;

        if (panel.num === panel.answer) {
          block.isPlacedCorrectly = true;
          block.el.classList.add('correct');
        } else {
          // 間違いならスッとトレイに戻す（弱化の制約）
          panel.answer = null;
          block.isPlacedCorrectly = false;
          block.el.classList.remove('correct');
          block.currentX = block.startX;
          block.currentY = block.startY;
          block.el.style.left = `${block.startX}px`;
          block.el.style.top = `${block.startY}px`;
          allCorrect = false;
        }
      });

      if (allCorrect) {
        playCorrectSound();
        document.getElementById('correct-mark').classList.add('show');
        document.getElementById('next-overlay').style.display = 'block';
      }
    }

    window.addEventListener('resize', () => {
      initGame();
    });

    window.addEventListener('load', () => {
      initGame();
    });
  </script>
</body>
</html>
