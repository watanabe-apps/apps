<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>検証デモF：視線誘導なぞり書きラボ</title>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --goal-color: #f59e0b;
      --goal-border: #d97706;
      --bg: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "UD Digi Kyokasho NK-R", "UD Digital Kyokasho NK-R", "Klee One", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      background: #ffffff;
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }
    .back-link {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      touch-action: manipulation;
    }
    .back-link:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .mode-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .mode-label {
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 700;
      padding-left: 4px;
    }
    .mode-btn {
      background: transparent;
      border: none;
      padding: 6px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #475569;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
    }
    .reset-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }
    .reset-btn:active {
      background: #e2e8f0;
    }

    #stage {
      flex: 1;
      position: relative;
      background: #ffffff;
      margin: 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 5;
    }

    /* スタート・ゴールの◯（サイズ・形状・アニメーションなし） */
    .point-marker {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      z-index: 10;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* スタートの◯（青色で統一） */
    .marker-start {
      background: var(--primary);
      border: 3px solid var(--primary-dark);
      color: #ffffff;
    }

    /* ゴールの◯（有色：オレンジで統一） */
    .marker-goal-colored {
      background: var(--goal-color);
      border: 3px solid var(--goal-border);
      color: #ffffff;
    }

    /* ゴールの◯（無色：枠線のみ・色なし） */
    .marker-goal-uncolored {
      background: #f8fafc;
      border: 3px dashed var(--border);
      color: #94a3b8;
      box-shadow: none;
    }

    /* モード①：文字説明ラベル */
    .mode1-label {
      font-size: 0.85rem;
      line-height: 1.2;
    }

    /* モード②：矢印指示アイコン */
    .mode2-arrow-wrapper {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .mode2-arrow {
      font-size: 1.8rem;
      color: #ffffff;
      line-height: 1;
    }

    /* クリア演出 */
    #clear-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.96);
      border: 3px solid #16a34a;
      border-radius: 16px;
      padding: 16px 36px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 100;
      opacity: 0;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
      pointer-events: none;
    }
    #clear-banner.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    #clear-banner h2 {
      font-size: 1.8rem;
      color: #16a34a;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="mode-selector">
      <span class="mode-label">視線誘導方式:</span>
      <button class="mode-btn" onclick="setMode(1)">① 文字で説明</button>
      <button class="mode-btn" onclick="setMode(2)">② 矢印で説明</button>
      <button class="mode-btn active" onclick="setMode(3)">③ 触れると色が付く</button>
    </div>

    <button class="reset-btn" onclick="randomizePositionsAndReset()">位置を変える / もう一度</button>
  </header>

  <div id="stage">
    <canvas id="drawCanvas"></canvas>

    <!-- スタート地点マーカー -->
    <div id="start-marker" class="point-marker"></div>

    <!-- ゴール地点マーカー -->
    <div id="goal-marker" class="point-marker"></div>

    <div id="clear-banner">
      <h2>できた！💮</h2>
      <p style="color:#475569; font-weight:700; font-size:0.9rem;">ゴールに到達しました</p>
    </div>
  </div>

  <script>
    let currentMode = 3;
    let canvas, ctx;
    let isDrawing = false;
    let isTouchingStart = false;
    let isCleared = false;
    let startX = 0, startY = 0;
    let goalX = 0, goalY = 0;
    const POINT_RADIUS = 36;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    ['pointerdown', 'touchstart', 'click'].forEach(evt => {
      window.addEventListener(evt, initAudio, { once: true });
    });

    function playSuccessSound() {
      initAudio();
      if (!audioCtx) return;
      try {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12); // E5
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime + 0.2);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.45);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(audioCtx.currentTime);
        osc1.stop(audioCtx.currentTime + 0.12);
        osc2.start(audioCtx.currentTime + 0.12);
        osc2.stop(audioCtx.currentTime + 0.45);
      } catch (e) {}
    }

    // スタートとゴールの位置をランダムに決定（方向を予想しにくくする）
    function randomizePositions() {
      const stage = document.getElementById('stage');
      const rect = stage.getBoundingClientRect();
      const padding = 70; // 画面端から離す（端末の特性への配慮）
      const minDistance = Math.min(rect.width, rect.height) * 0.55;

      // 4隅や上下左右の様々な方向パターン（右上→左下、下→上、右→左、左下→右上 など）
      const patterns = [
        { sx: 0.8, sy: 0.25, gx: 0.2, gy: 0.75 }, // 右上 ➜ 左下
        { sx: 0.5, sy: 0.8,  gx: 0.5, gy: 0.2 },  // 下 ➜ 上
        { sx: 0.82, sy: 0.5, gx: 0.18, gy: 0.5 }, // 右 ➜ 左
        { sx: 0.2, sy: 0.8,  gx: 0.8, gy: 0.2 },  // 左下 ➜ 右上
        { sx: 0.2, sy: 0.25, gx: 0.75, gy: 0.8 }, // 左上 ➜ 右下
        { sx: 0.5, sy: 0.2,  gx: 0.5, gy: 0.8 }   // 上 ➜ 下
      ];

      const chosen = patterns[Math.floor(Math.random() * patterns.length)];
      // 少しランダムな揺らぎを加える
      const jitterX = () => (Math.random() - 0.5) * 0.08;
      const jitterY = () => (Math.random() - 0.5) * 0.08;

      startX = Math.max(padding, Math.min(rect.width - padding, (chosen.sx + jitterX()) * rect.width));
      startY = Math.max(padding, Math.min(rect.height - padding, (chosen.sy + jitterY()) * rect.height));
      goalX  = Math.max(padding, Math.min(rect.width - padding, (chosen.gx + jitterX()) * rect.width));
      goalY  = Math.max(padding, Math.min(rect.height - padding, (chosen.gy + jitterY()) * rect.height));
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
      });
      resetCanvas();
    }

    function randomizePositionsAndReset() {
      randomizePositions();
      resetCanvas();
    }

    function drawGuideLine() {
      // スタートからゴールへ薄い点線ガイドを描画
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([8, 8]);
      ctx.moveTo(startX, startY);
      ctx.lineTo(goalX, goalY);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    function updateMarkers() {
      const sMarker = document.getElementById('start-marker');
      const gMarker = document.getElementById('goal-marker');

      sMarker.style.left = `${startX}px`;
      sMarker.style.top = `${startY}px`;
      gMarker.style.left = `${goalX}px`;
      gMarker.style.top = `${goalY}px`;

      // スタートの◯は常に青（#0284c7）で統一
      sMarker.className = 'point-marker marker-start';

      // 矢印の角度を計算（スタートからゴールへの角度）
      const angleRad = Math.atan2(goalY - startY, goalX - startX);
      const angleDeg = angleRad * (180 / Math.PI);

      if (currentMode === 1) {
        // ① 文字で説明（スタートもゴールも最初から色付き、文字でしか区別がつかない）
        sMarker.innerHTML = `<span class="mode1-label">スタート</span>`;
        gMarker.className = 'point-marker marker-goal-colored';
        gMarker.innerHTML = `<span class="mode1-label">ゴール</span>`;
      } else if (currentMode === 2) {
        // ② 矢印で説明（スタートもゴールも最初から色付き、矢印が向きを示す）
        sMarker.innerHTML = `
          <div class="mode2-arrow-wrapper" style="transform: rotate(${angleDeg}deg);">
            <span class="mode2-arrow">➔</span>
          </div>
        `;
        gMarker.className = 'point-marker marker-goal-colored';
        gMarker.innerHTML = `<span>●</span>`;
      } else if (currentMode === 3) {
        // ③ 色の変化（最初はゴールに色がついておらず、スタートするとゴールに付く）
        sMarker.innerHTML = `<span>●</span>`;

        if (isTouchingStart || isCleared) {
          // スタート中、またはクリア時：ゴールに色が付く
          gMarker.className = 'point-marker marker-goal-colored';
          gMarker.innerHTML = `<span>●</span>`;
        } else {
          // 初期状態：ゴールに色がついていない（枠線のみ）
          gMarker.className = 'point-marker marker-goal-uncolored';
          gMarker.innerHTML = `<span>○</span>`;
        }
      }
    }

    function resetCanvas() {
      isDrawing = false;
      isTouchingStart = false;
      isCleared = false;
      document.getElementById('clear-banner').classList.remove('show');
      if (ctx) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGuideLine();
      }
      updateMarkers();
    }

    function resizeCanvas() {
      const stage = document.getElementById('stage');
      const rect = stage.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (startX === 0) {
        randomizePositions();
      }
      resetCanvas();
    }

    window.addEventListener('load', () => {
      canvas = document.getElementById('drawCanvas');
      ctx = canvas.getContext('2d');
      randomizePositions();
      resizeCanvas();

      canvas.addEventListener('pointerdown', (e) => {
        if (isCleared) return;
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // スタート付近か判定
        const distToStart = Math.hypot(x - startX, y - startY);
        if (distToStart < POINT_RADIUS * 1.5) {
          isDrawing = true;
          isTouchingStart = true;
          canvas.setPointerCapture(e.pointerId);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawGuideLine();

          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#0284c7';
          updateMarkers();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || isCleared) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();

        // ゴール到達判定
        const distToGoal = Math.hypot(x - goalX, y - goalY);
        if (distToGoal < POINT_RADIUS * 1.3) {
          isCleared = true;
          isDrawing = false;
          try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
          playSuccessSound();
          document.getElementById('clear-banner').classList.add('show');
          updateMarkers();
        }
      });

      const stopDraw = (e) => {
        if (isDrawing && !isCleared) {
          isDrawing = false;
          isTouchingStart = false;
          // 途中で離したらリセット
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawGuideLine();
          updateMarkers();
        }
        try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
      };

      canvas.addEventListener('pointerup', stopDraw);
      canvas.addEventListener('pointercancel', stopDraw);
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
