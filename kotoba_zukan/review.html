  </div>

  <input type="file" id="json-file-input" accept=".json" style="display: none;" onchange="handleFileImport(event)">
  <div class="toast" id="toast">📋 コピーしました</div>

  <!-- Load Vocab DB & Candidates History -->
  <script src="../common/vocab.js"></script>
  <script src="./scripts/candidates/history.js"></script>

  <script>
    'use strict';

    // State & Constants
    const STORAGE_KEY = 'kotoba_zukan_review_flags_v1';
    const DT_SERVER = window.location.protocol === 'file:' ? 'http://127.0.0.1:8085' : '';

    const ISSUE_TYPES = [
      { id: 'image', label: '画像', fullLabel: '画像がダメ', icon: '🖼️', badgeClass: 'badge-image', btnClass: 'btn-image' },
      { id: 'audio', label: '音声', fullLabel: '音声がダメ', icon: '🔊', badgeClass: 'badge-audio', btnClass: 'btn-audio' },
      { id: 'text',  label: '表記', fullLabel: '表記がダメ', icon: '✍️', badgeClass: 'badge-text',  btnClass: 'btn-text' },
      { id: 'other', label: 'その他', fullLabel: 'その他',   icon: '💬', badgeClass: 'badge-other', btnClass: 'btn-other' }
    ];
    const ISSUE_TYPE_MAP = new Map(ISSUE_TYPES.map(t => [t.id, t]));

    let flaggedMap = {};
    let currentCategory = 'all';
    let currentSubCategory = 'all';
    let currentTypeFilter = 'all';
    let searchQuery = '';
    let currentModalItem = null;
    let modalSelectedTypes = new Set();
    let currentSummaryFilter = 'all';
    let audioPlayer = new Audio();

    // View Switch State: 'review' | 'compare'
    let currentMainView = 'review';

    // Compare View State
    let dtCurrentWord = null;
    let dtCurrentCandidateFilename = null;
    let currentCompareMode = 'split'; // 'split' | 'slider' | 'toggle'
    let isShowingNewInToggle = true;

    // History State
    let dtHistory = [];
    let drawerFilterMode = 'all'; // 'all' | 'current'

    const CATEGORIES_DEF = [
      { id: 'all', name: 'すべて' },
      { id: 'doubutsu', name: 'いきもの' },
      { id: 'tabemono', name: 'たべもの' },
      { id: 'norimono', name: 'のりもの' },
      { id: 'midikanamono', name: 'みぢかなもの' },
      { id: 'ugoki', name: 'うごき' },
      { id: 'kimochi', name: 'きもち' },
      { id: 'hito', name: 'ひと' }
    ];

    function getVocabList() {
      if (window.APP_VOCAB && Array.isArray(window.APP_VOCAB.list)) {
        return window.APP_VOCAB.list;
      }
      if (window.VocabDB && Array.isArray(window.VocabDB.list)) {
        return window.VocabDB.list;
      }
      return [];
    }

    function getVocabById(id) {
      if (window.APP_VOCAB && window.APP_VOCAB.byId && window.APP_VOCAB.byId[id]) {
        return window.APP_VOCAB.byId[id];
      }
      if (window.VocabDB && typeof window.VocabDB.findById === 'function') {
        return window.VocabDB.findById(id);
      }
      return null;
    }

    function getProductionImgUrl(wordId) {
      const item = getVocabById(wordId);
      const file = (item && item.file) ? item.file : `${wordId}.png`;
      return `../common/images/${file}?t=${Date.now()}`;
    }

    function getCandidateImgUrl(filename) {
      if (!filename) return '';
      const cleanName = filename.replace(/^http:\/\/[^\/]+/, '').replace(/^\/images\//, '').split('?')[0];
      const base = cleanName.split('/').pop();
      const buster = `t=${Date.now()}`;
      if (window.location.protocol === 'file:') {
        return `./scripts/candidates/${base}?${buster}`;
      }
      return `${DT_SERVER}/images/${base}?${buster}`;
    }

    // ========================================================
    // INITIALIZATION
    // ========================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadFlagsFromStorage();
      renderCategoryTabs();
      setupSearch();
      renderGrid();
      updateStats();

      initHistory();
      initCompareSlider();

      // Keyboard shortcuts for compare view
      window.addEventListener('keydown', (e) => {
        if (currentMainView !== 'compare') return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          if (currentCompareMode === 'toggle') {
            toggleCompareFlipImage();
          } else {
            setCompareMode('toggle');
          }
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          stepCompareWord(-1);
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          stepCompareWord(1);
        } else if (e.code === 'Escape') {
          switchMainView('review');
        }
      });
    });

    // ========================================================
    // STORAGE & FLAGS
    // ========================================================
    function loadFlagsFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          Object.keys(parsed).forEach(id => {
            const item = parsed[id];
            if (!Array.isArray(item.types) || item.types.length === 0) {
              item.types = ['image'];
            }
          });
          flaggedMap = parsed;
        }
      } catch (e) {
        flaggedMap = {};
      }
    }

    function saveFlagsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(flaggedMap));
      } catch (e) {}
      updateStats();
    }

    // ========================================================
    // VIEW SWITCHER (Review Grid vs Huge Compare Screen)
    // ========================================================
    function switchMainView(viewName) {
      currentMainView = viewName;
      const reviewView = document.getElementById('review-view');
      const compareView = document.getElementById('compare-view');
      const reviewToolbar = document.getElementById('review-toolbar');
      const subcatToolbar = document.getElementById('subcat-toolbar');
      const bottomDock = document.getElementById('bottom-dock');
      const mainHeader = document.getElementById('main-header');

      if (viewName === 'compare') {
        document.body.classList.remove('review-mode');
        reviewView.style.display = 'none';
        reviewToolbar.style.display = 'none';
        if (subcatToolbar) subcatToolbar.style.display = 'none';
        bottomDock.style.display = 'none';
        mainHeader.style.display = 'none';

        compareView.classList.add('active');
        populateCompareWordDropdown();
        if (dtCurrentWord) {
          loadCompareWord(dtCurrentWord);
        } else {
          const list = getVocabList();
          if (list.length > 0) loadCompareWord(list[0]);
        }
      } else {
        document.body.classList.add('review-mode');
        mainHeader.style.display = 'block';
        reviewView.style.display = 'block';
        reviewToolbar.style.display = 'flex';
        bottomDock.style.display = 'block';
        compareView.classList.remove('active');
        renderSubCategoryPills();
        renderGrid();
      }
    }

    // ========================================================
    // REVIEW VIEW CONTROLS & GRID RENDERING
    // ========================================================
    function setCardSize(size, btn) {
      document.documentElement.style.setProperty('--card-size', size + 'px');
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function setTypeFilter(type, btn) {
      currentTypeFilter = type;
      document.querySelectorAll('.type-filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderGrid();
    }

    function renderCategoryTabs() {
      const container = document.getElementById('cat-tabs');
      if (!container) return;
      const list = getVocabList();
      container.innerHTML = '';

      CATEGORIES_DEF.forEach(cat => {
        const count = cat.id === 'all'
          ? list.length
          : list.filter(w => w.category === cat.id).length;
        const btn = document.createElement('button');
        btn.className = `cat-tab ${cat.id === currentCategory ? 'active' : ''}`;
        btn.dataset.cat = cat.id;
        btn.textContent = `${cat.name} (${count})`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = cat.id;
          currentSubCategory = 'all';
          renderSubCategoryPills();
          renderGrid();
        });
        container.appendChild(btn);
      });

      renderSubCategoryPills();
    }

    function renderSubCategoryPills() {
      const toolbar = document.getElementById('subcat-toolbar');
      const pillsContainer = document.getElementById('subcat-pills');
      if (!toolbar || !pillsContainer) return;

      if (currentCategory === 'all') {
        toolbar.style.display = 'none';
        pillsContainer.innerHTML = '';
        return;
      }

      const list = getVocabList();
      const catWords = list.filter(w => w.category === currentCategory);
      
      const subMap = new Map();
      catWords.forEach(w => {
        if (w.subCategory) {
          const current = subMap.get(w.subCategory) || { name: w.subCategoryName || w.subCategory, count: 0 };
          current.count++;
          subMap.set(w.subCategory, current);
        }
      });

      if (subMap.size === 0) {
        toolbar.style.display = 'none';
        pillsContainer.innerHTML = '';
        return;
      }

      toolbar.style.display = 'block';
      pillsContainer.innerHTML = '';

      const allPill = document.createElement('button');
      allPill.className = `subcat-pill ${currentSubCategory === 'all' ? 'active' : ''}`;
      allPill.textContent = `すべて (${catWords.length})`;
      allPill.addEventListener('click', () => {
        currentSubCategory = 'all';
        renderSubCategoryPills();
        renderGrid();
      });
      pillsContainer.appendChild(allPill);

      subMap.forEach((info, subId) => {
        const pill = document.createElement('button');
        pill.className = `subcat-pill ${currentSubCategory === subId ? 'active' : ''}`;
        pill.textContent = `${info.name} (${info.count})`;
        pill.addEventListener('click', () => {
          currentSubCategory = subId;
          renderSubCategoryPills();
          renderGrid();
        });
        pillsContainer.appendChild(pill);
      });
    }

    function setupSearch() {
      const input = document.getElementById('search-input');
      if (!input) return;
      input.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderGrid();
      });
    }

    // Render Main Review Grid
    function renderGrid() {
      const container = document.getElementById('vocab-grid');
      if (!container) return;
      const list = getVocabList();
      
      const filtered = list.filter(item => {
        if (currentCategory !== 'all' && item.category !== currentCategory) return false;
        if (currentSubCategory !== 'all' && item.subCategory !== currentSubCategory) return false;

        const flagInfo = flaggedMap[item.id];
        const isFlagged = !!flagInfo && (Array.isArray(flagInfo.types) && flagInfo.types.length > 0 || !!flagInfo.reason);
        const types = (flagInfo && Array.isArray(flagInfo.types)) ? flagInfo.types : [];

        if (currentTypeFilter === 'flagged' && !isFlagged) return false;
        if (currentTypeFilter === 'image' && !types.includes('image')) return false;
        if (currentTypeFilter === 'audio' && !types.includes('audio')) return false;
        if (currentTypeFilter === 'text'  && !types.includes('text'))  return false;
        if (currentTypeFilter === 'other' && !types.includes('other')) return false;

        if (searchQuery) {
          const matchName = item.name && item.name.toLowerCase().includes(searchQuery);
          const matchId = item.id && item.id.toLowerCase().includes(searchQuery);
          const matchPrompt = item.prompt && item.prompt.toLowerCase().includes(searchQuery);
          const matchSub = item.subCategoryName && item.subCategoryName.toLowerCase().includes(searchQuery);
          const matchReason = flagInfo && flagInfo.reason && flagInfo.reason.toLowerCase().includes(searchQuery);
          if (!matchName && !matchId && !matchPrompt && !matchSub && !matchReason) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #64748b;">
            <p style="font-size: 1.1rem; font-weight: 700;">条件に一致する単語がありません</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const flagInfo = flaggedMap[item.id];
        const types = (flagInfo && Array.isArray(flagInfo.types)) ? flagInfo.types : [];
        const isFlagged = !!flagInfo && (types.length > 0 || !!flagInfo.reason);
        const reason = flagInfo ? (flagInfo.reason || '') : '';
        const imgPath = '../common/images/' + (item.file || (item.id + '.png'));

        const badgesHtml = types.map(t => {
          const conf = ISSUE_TYPE_MAP.get(t);
          if (!conf) return '';
          return `<span class="issue-tag-badge ${conf.badgeClass}">${conf.icon} ${conf.label}</span>`;
        }).join('');

        const hasMulti = types.length >= 2;
        const typeClasses = [
          isFlagged ? 'is-flagged' : '',
          types.includes('image') ? 'has-image-issue' : '',
          types.includes('audio') ? 'has-audio-issue' : '',
          types.includes('text') ? 'has-text-issue' : '',
          hasMulti ? 'has-multi-issues' : ''
        ].filter(Boolean).join(' ');

        return `
          <div class="card ${typeClasses}" id="card-${item.id}">
            <div class="card-issue-badges" id="badges-${item.id}">
              ${badgesHtml}
            </div>

            <div class="card-top-actions">
              <button class="icon-btn" title="詳細・理由を編集" onclick="openDetailModal(event, '${item.id}')">🔍</button>
              <button class="icon-btn" title="発音を再生" onclick="playAudio(event, '${item.id}')">🔊</button>
            </div>

            <div class="image-container" onclick="openDetailModal(event, '${item.id}')">
              <img src="${imgPath}" loading="lazy" alt="${escapeHtml(item.name)}">
            </div>

            <div class="card-info" onclick="openDetailModal(event, '${item.id}')">
              <div class="card-word">${escapeHtml(item.name)}</div>
              <div class="card-meta">
                <div class="card-tags">
                  <span class="cat-tag cat-${item.category}">${escapeHtml(item.categoryName || item.category)}</span>
                  ${item.subCategoryName ? `<span class="subcat-tag">${escapeHtml(item.subCategoryName)}</span>` : ''}
                </div>
                <span class="card-id">${item.id}</span>
              </div>
              <div class="card-comment ${reason ? 'has-text' : ''}" id="comment-${item.id}">${escapeHtml(reason)}</div>
            </div>

            <!-- クイック不備選択バー -->
            <div class="card-quick-types">
              <button class="quick-type-btn btn-image ${types.includes('image') ? 'active' : ''}" 
                      title="画像がダメ" 
                      onclick="toggleQuickType(event, '${item.id}', 'image')">
                <span>🖼️</span>
                <span>画像</span>
              </button>
              <button class="quick-type-btn btn-audio ${types.includes('audio') ? 'active' : ''}" 
                      title="音声がダメ" 
                      onclick="toggleQuickType(event, '${item.id}', 'audio')">
                <span>🔊</span>
                <span>音声</span>
              </button>
              <button class="quick-type-btn btn-text ${types.includes('text') ? 'active' : ''}" 
                      title="表記がダメ" 
                      onclick="toggleQuickType(event, '${item.id}', 'text')">
                <span>✍️</span>
                <span>表記</span>
              </button>
              <button class="quick-type-btn btn-other ${types.includes('other') ? 'active' : ''}" 
                      title="その他" 
                      onclick="toggleQuickType(event, '${item.id}', 'other')">
                <span>💬</span>
                <span>他</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Quick Issue Type Toggle
    function toggleQuickType(e, id, type) {
      if (e) e.stopPropagation();
      const item = getVocabById(id);
      if (!item) return;

      const typeConf = ISSUE_TYPE_MAP.get(type);
      const typeLabel = typeConf ? typeConf.label : type;

      if (!flaggedMap[id]) {
        flaggedMap[id] = {
          id: item.id,
          name: item.name,
          category: item.category,
          categoryName: item.categoryName || '',
          subCategory: item.subCategory || '',
          subCategoryName: item.subCategoryName || '',
          types: [type],
          reason: '',
          tts_text: item.tts_text || item.name
        };
        showToast(`🚨 「${item.name}」の [${typeLabel}] 不備を追加しました`);
      } else {
        const flagInfo = flaggedMap[id];
        if (!Array.isArray(flagInfo.types)) flagInfo.types = [];
        const idx = flagInfo.types.indexOf(type);
        if (idx !== -1) {
          flagInfo.types.splice(idx, 1);
          if (flagInfo.types.length === 0 && !flagInfo.reason) {
            delete flaggedMap[id];
            showToast(`⚪ 「${item.name}」の指摘をすべて解除しました`);
          } else {
            showToast(`⚪ 「${item.name}」の [${typeLabel}] 不備を解除しました`);
          }
        } else {
          flagInfo.types.push(type);
          showToast(`🚨 「${item.name}」の [${typeLabel}] 不備を追加しました`);
        }
      }

      saveFlagsToStorage();
      updateCardUI(id);
    }

    function updateCardUI(id) {
      const card = document.getElementById('card-' + id);
      const flagInfo = flaggedMap[id];
      const types = (flagInfo && Array.isArray(flagInfo.types)) ? flagInfo.types : [];
      const isFlagged = !!flagInfo && (types.length > 0 || !!flagInfo.reason);

      if (card) {
        card.classList.toggle('is-flagged', isFlagged);
        card.classList.toggle('has-image-issue', types.includes('image'));
        card.classList.toggle('has-audio-issue', types.includes('audio'));
        card.classList.toggle('has-text-issue', types.includes('text'));
        card.classList.toggle('has-multi-issues', types.length >= 2);

        const badgesContainer = document.getElementById('badges-' + id);
        if (badgesContainer) {
          badgesContainer.innerHTML = types.map(t => {
            const conf = ISSUE_TYPE_MAP.get(t);
            if (!conf) return '';
            return `<span class="issue-tag-badge ${conf.badgeClass}">${conf.icon} ${conf.label}</span>`;
          }).join('');
        }

        const btns = card.querySelectorAll('.quick-type-btn');
        btns.forEach(btn => {
          if (btn.classList.contains('btn-image')) btn.classList.toggle('active', types.includes('image'));
          if (btn.classList.contains('btn-audio')) btn.classList.toggle('active', types.includes('audio'));
          if (btn.classList.contains('btn-text'))  btn.classList.toggle('active', types.includes('text'));
          if (btn.classList.contains('btn-other')) btn.classList.toggle('active', types.includes('other'));
        });

        const commentEl = document.getElementById('comment-' + id);
        if (commentEl) {
          const reason = flagInfo ? (flagInfo.reason || '') : '';
          commentEl.textContent = reason;
          commentEl.classList.toggle('has-text', !!reason);
        }
      }

      if (currentTypeFilter !== 'all') {
        const matchesFilter = (
          (currentTypeFilter === 'flagged' && isFlagged) ||
          (currentTypeFilter === 'image' && types.includes('image')) ||
          (currentTypeFilter === 'audio' && types.includes('audio')) ||
          (currentTypeFilter === 'text' && types.includes('text')) ||
          (currentTypeFilter === 'other' && types.includes('other'))
        );
        if (!matchesFilter && card) {
          card.remove();
        }
      }
    }

    function updateStats() {
      const keys = Object.keys(flaggedMap).filter(id => {
        const it = flaggedMap[id];
        return (it.types && it.types.length > 0) || it.reason;
      });

      let imgCount = 0, audCount = 0, txtCount = 0, othCount = 0;
      keys.forEach(id => {
        const t = flaggedMap[id].types || [];
        if (t.includes('image')) imgCount++;
        if (t.includes('audio')) audCount++;
        if (t.includes('text')) txtCount++;
        if (t.includes('other')) othCount++;
      });

      const total = getVocabList().length;
      const count = keys.length;

      const totalEl = document.getElementById('total-count');
      if (totalEl) totalEl.textContent = total;

      document.getElementById('flagged-count').textContent = count;
      document.getElementById('dock-flag-count').textContent = count;
      document.getElementById('summary-count').textContent = count;

      const setTxt = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      setTxt('stat-image', imgCount);
      setTxt('stat-audio', audCount);
      setTxt('stat-text', txtCount);
      setTxt('stat-other', othCount);

      setTxt('dock-stat-image', imgCount);
      setTxt('dock-stat-audio', audCount);
      setTxt('dock-stat-text', txtCount);
      setTxt('dock-stat-other', othCount);

      setTxt('btn-count-flagged', count);
      setTxt('btn-count-image', imgCount);
      setTxt('btn-count-audio', audCount);
      setTxt('btn-count-text', txtCount);
      setTxt('btn-count-other', othCount);
    }

    // Audio Playback with Web Speech Fallback
    function playAudio(e, id) {
      if (e) e.stopPropagation();
      const item = getVocabById(id);
      const audioUrl = `audio/words/${id}.mp3`;

      audioPlayer.src = audioUrl;
      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          if (window.speechSynthesis && item) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(item.name);
            utter.lang = 'ja-JP';
            window.speechSynthesis.speak(utter);
          }
        });
      }
    }

    function playAudioFromModal() {
      if (currentModalItem) {
        playAudio(null, currentModalItem.id);
      }
    }

    // ========================================================
    // DETAIL / REASON MODAL LOGIC
    // ========================================================
    function openDetailModal(e, id) {
      if (e) e.stopPropagation();
      const item = getVocabById(id);
      if (!item) return;
      currentModalItem = item;

      const subInfo = item.subCategoryName ? ` ＞ ${item.subCategoryName}` : '';
      document.getElementById('modal-title').textContent = `${item.name} (${item.id})`;
      document.getElementById('modal-name-val').textContent = item.name;
      document.getElementById('modal-tts-val').textContent = item.tts_text || item.name;
      document.getElementById('modal-cat-val').textContent = `${item.categoryName || item.category}${subInfo}`;

      const modalImg = document.getElementById('modal-img');
      modalImg.onerror = null;
      modalImg.src = '../common/images/' + (item.file || (item.id + '.png'));
      document.getElementById('modal-prompt').textContent = item.prompt || '（プロンプト情報なし）';

      const flagInfo = flaggedMap[id];
      const types = (flagInfo && Array.isArray(flagInfo.types)) ? flagInfo.types : [];
      modalSelectedTypes = new Set(types);

      updateModalTypeButtons();

      document.getElementById('modal-reason-input').value = flagInfo ? (flagInfo.reason || '') : '';
      updateModalFlagAllBtn(modalSelectedTypes.size > 0 || (flagInfo && !!flagInfo.reason));

      document.getElementById('detail-modal').classList.add('active');
    }

    function updateModalTypeButtons() {
      ['image', 'audio', 'text', 'other'].forEach(type => {
        const btn = document.getElementById('mtype-' + type);
        if (btn) {
          btn.classList.toggle('active', modalSelectedTypes.has(type));
        }
      });
    }

    function toggleModalType(type) {
      if (modalSelectedTypes.has(type)) {
        modalSelectedTypes.delete(type);
      } else {
        modalSelectedTypes.add(type);
      }
      updateModalTypeButtons();
      updateModalFlagAllBtn(modalSelectedTypes.size > 0);
    }

    function updateModalFlagAllBtn(hasFlags) {
      const btn = document.getElementById('modal-flag-toggle-btn');
      if (hasFlags) {
        btn.textContent = '⚪ すべて解除';
        btn.className = 'btn btn-secondary';
      } else {
        btn.textContent = '🚨 画像を要修正にする';
        btn.className = 'btn btn-danger';
      }
    }

    function toggleModalFlagAll() {
      if (!currentModalItem) return;
      const id = currentModalItem.id;
      if (modalSelectedTypes.size > 0 || flaggedMap[id]) {
        modalSelectedTypes.clear();
        document.getElementById('modal-reason-input').value = '';
        delete flaggedMap[id];
        updateModalTypeButtons();
        updateModalFlagAllBtn(false);
        saveFlagsToStorage();
        updateCardUI(id);
        showToast(`⚪ 「${currentModalItem.name}」の指摘を解除しました`);
      } else {
        modalSelectedTypes.add('image');
        updateModalTypeButtons();
        updateModalFlagAllBtn(true);
      }
    }

    function addReasonTag(tag) {
      const input = document.getElementById('modal-reason-input');
      const val = input.value.trim();
      if (!val) {
        input.value = tag;
      } else if (!val.includes(tag)) {
        input.value = val + ' / ' + tag;
      }
    }

    function saveModalChanges() {
      if (!currentModalItem) return;
      const id = currentModalItem.id;
      const reason = document.getElementById('modal-reason-input').value.trim();
      const types = Array.from(modalSelectedTypes);

      if (types.length > 0 || reason) {
        flaggedMap[id] = {
          id: currentModalItem.id,
          name: currentModalItem.name,
          category: currentModalItem.category,
          categoryName: currentModalItem.categoryName || '',
          subCategory: currentModalItem.subCategory || '',
          subCategoryName: currentModalItem.subCategoryName || '',
          types: types.length > 0 ? types : ['other'],
          reason: reason,
          tts_text: currentModalItem.tts_text || currentModalItem.name
        };
        saveFlagsToStorage();
        updateCardUI(id);
        showToast(`💾 「${currentModalItem.name}」の変更を保存しました`);
      } else {
        if (flaggedMap[id]) {
          delete flaggedMap[id];
          saveFlagsToStorage();
          updateCardUI(id);
          showToast(`⚪ 「${currentModalItem.name}」の指摘を解除しました`);
        }
      }

      closeModal();
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('active');
      currentModalItem = null;
    }

    // ========================================================
    // SUMMARY MODAL (Flagged Words List)
    // ========================================================
    function showSummaryModal() {
      currentSummaryFilter = 'all';
      renderSummaryList();
      document.getElementById('summary-modal').classList.add('active');
    }

    function closeSummaryModal() {
      document.getElementById('summary-modal').classList.remove('active');
    }

    function filterSummaryList(type, btn) {
      currentSummaryFilter = type;
      document.querySelectorAll('#summary-filter-pills .subcat-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderSummaryList();
    }

    function renderSummaryList() {
      const container = document.getElementById('summary-list');
      const keys = Object.keys(flaggedMap).filter(id => {
        const item = flaggedMap[id];
        const isFlagged = (item.types && item.types.length > 0) || item.reason;
        if (!isFlagged) return false;
        if (currentSummaryFilter === 'all') return true;
        const types = item.types || [];
        return types.includes(currentSummaryFilter);
      });

      if (keys.length === 0) {
        container.innerHTML = '<p style="text-align: center; padding: 20px; color: #64748b;">該当する指摘はありません</p>';
        return;
      }

      container.innerHTML = keys.map(id => {
        const item = flaggedMap[id];
        const types = item.types || [];
        const typeBadges = types.map(t => {
          const conf = ISSUE_TYPE_MAP.get(t);
          return conf ? `<span class="issue-tag-badge ${conf.badgeClass}">${conf.icon} ${conf.label}</span>` : '';
        }).join(' ');

        return `
          <div style="padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                <span style="font-weight: 800; font-size: 0.95rem; color: #1e293b;">${escapeHtml(item.name)}</span>
                <span style="font-family: monospace; font-size: 0.72rem; color: #94a3b8;">${item.id}</span>
                ${typeBadges}
              </div>
              ${item.reason ? `<div style="font-size: 0.78rem; color: #dc2626; margin-top: 3px;">📝 ${escapeHtml(item.reason)}</div>` : ''}
            </div>
            <div style="display: flex; gap: 4px; flex-shrink: 0;">
              <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="openDetailModal(null, '${item.id}'); closeSummaryModal();">
                ✏️ 編集
              </button>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeFlagDirect('${item.id}')">
                ✕ 解除
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeFlagDirect(id) {
      delete flaggedMap[id];
      saveFlagsToStorage();
      updateCardUI(id);
      renderSummaryList();
      showToast('⚪ 解除しました');
    }

    // ========================================================
    // CHAT COPY & EXPORT / IMPORT
    // ========================================================
    function copyForChat() {
      const keys = Object.keys(flaggedMap).filter(id => {
        const it = flaggedMap[id];
        return (it.types && it.types.length > 0) || it.reason;
      });

      if (keys.length === 0) {
        showToast('⚠️ 指摘された単語がありません');
        return;
      }

      let text = '【ことばずかん 不備指摘リスト】\n';
      keys.forEach((id, idx) => {
        const item = flaggedMap[id];
        const typesStr = (item.types && item.types.length > 0) ? item.types.join(', ') : 'other';
        const reasonStr = item.reason ? ` / 理由: ${item.reason}` : '';
        text += `${idx + 1}. [${item.id}] ${item.name} (${typesStr})${reasonStr}\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 チャット用テキストをコピーしました！');
      }).catch(() => {
        showToast('❌ コピーに失敗しました');
      });
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(flaggedMap, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kotoba_zukan_issues_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('💾 指摘データをJSONとして保存しました');
    }

    function triggerImportJSON() {
      document.getElementById('json-file-input').click();
    }

    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (typeof parsed === 'object') {
            flaggedMap = parsed;
            saveFlagsToStorage();
            renderGrid();
            updateStats();
            showToast('📥 JSONデータを読み込みました');
          }
        } catch (err) {
          alert('JSONの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetAllFlags() {
      if (confirm('すべての要修正フラグをクリアしますか？')) {
        flaggedMap = {};
        saveFlagsToStorage();
        renderGrid();
        updateStats();
        showToast('🗑️ すべての指摘をクリアしました');
      }
    }

    // ========================================================
    // HISTORY & HUGE COMPARISON VIEW LOGIC
    // ========================================================
    function initHistory() {
      if (window.DT_CACHED_HISTORY && Array.isArray(window.DT_CACHED_HISTORY)) {
        loadHistoryItems(window.DT_CACHED_HISTORY);
      }
      syncHistoryFromServer();
      setInterval(syncHistoryFromServer, 4000);
    }

    function toggleHistoryDrawer(forceState = null) {
      const drawer = document.getElementById('history-drawer');
      const overlay = document.getElementById('drawer-overlay');
      const shouldOpen = forceState !== null ? forceState : !drawer.classList.contains('active');

      drawer.classList.toggle('active', shouldOpen);
      overlay.classList.toggle('active', shouldOpen);

      if (shouldOpen) {
        renderDrawerList();
        syncHistoryFromServer();
      }
    }

    function setDrawerFilter(mode) {
      drawerFilterMode = mode;
      document.getElementById('drawer-tab-all').classList.toggle('active', mode === 'all');
      document.getElementById('drawer-tab-current').classList.toggle('active', mode === 'current');
      renderDrawerList();
    }

    function loadHistoryItems(items) {
      if (!Array.isArray(items)) return;
      const seen = new Set();
      dtHistory = [];
      items.forEach(item => {
        const key = item.url ? item.url.split('?')[0] : '';
        if (key && !seen.has(key)) {
          seen.add(key);
          dtHistory.push(item);
        }
      });
      updateHistoryPillCount();
      renderWordCandidatesStrip();
    }

    function updateHistoryPillCount() {
      const realCands = dtHistory.filter(h => !h.is_backup);
      const pill = document.getElementById('hist-pill-count');
      if (pill) pill.textContent = realCands.length;
      const drawerCount = document.getElementById('drawer-hist-count');
      if (drawerCount) drawerCount.textContent = realCands.length;
    }

    async function syncHistoryFromServer() {
      try {
        const res = await fetch(`${DT_SERVER}/api/recent_images`);
        const serverData = await res.json();
        if (Array.isArray(serverData)) {
          loadHistoryItems(serverData);
          if (document.getElementById('history-drawer').classList.contains('active')) {
            renderDrawerList();
          }
        }
      } catch (e) {}
    }

    // Render Large History Drawer List
    function renderDrawerList() {
      const listContainer = document.getElementById('drawer-list');
      if (!listContainer) return;
      listContainer.innerHTML = '';

      let items = dtHistory.filter(h => !h.is_backup);
      if (drawerFilterMode === 'current' && dtCurrentWord) {
        items = items.filter(h => h.word_id === dtCurrentWord.id);
      }

      if (items.length === 0) {
        listContainer.innerHTML = `
          <div style="padding: 40px 20px; text-align: center; color: #64748b;">
            <p style="font-size: 1.5rem; margin-bottom: 8px;">📜</p>
            <p style="font-weight: 700;">生成履歴がありません</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const filename = item.url.split('/').pop();
        const candUrl = getCandidateImgUrl(filename);
        const w = getVocabById(item.word_id);
        const wordName = item.word_name || (w ? w.name : item.word_id);
        const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleString() : '';

        const card = document.createElement('div');
        card.className = 'drawer-item';
        card.innerHTML = `
          <div class="drawer-item-thumb" onclick="openCompareFromHistory('${item.word_id}', '${filename}')" title="クリックして大画面で新旧比較">
            <img src="${candUrl}" loading="lazy" alt="${wordName}" />
          </div>
          <div class="drawer-item-body">
            <div class="drawer-item-title">${escapeHtml(wordName)}</div>
            <div class="drawer-item-id">${item.word_id}</div>
            <div class="drawer-item-time">${timeStr}</div>
            <div class="drawer-item-actions">
              <button class="drawer-btn-compare" onclick="openCompareFromHistory('${item.word_id}', '${filename}')">
                👥 比較
              </button>
              <button class="drawer-btn-apply" onclick="applyHistoryDirect('${filename}', '${item.word_id}', '${wordName}')">
                ✨ 本番反映
              </button>
              <button class="drawer-btn-discard" onclick="discardHistoryDirect('${filename}')">
                🗑️ 破棄
              </button>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Open Huge Comparison View directly from History
    function openCompareFromHistory(wordId, candidateFilename) {
      const w = getVocabById(wordId);
      if (w) dtCurrentWord = w;
      toggleHistoryDrawer(false);
      switchMainView('compare');
      if (candidateFilename) {
        setCompareCandidateImage(candidateFilename);
      }
    }

    function populateCompareWordDropdown() {
      const select = document.getElementById('compare-word-select');
      if (!select) return;
      const list = getVocabList();
      select.innerHTML = '';

      const candCounts = {};
      dtHistory.forEach(h => {
        if (!h.is_backup) candCounts[h.word_id] = (candCounts[h.word_id] || 0) + 1;
      });

      list.forEach((w, i) => {
        const opt = document.createElement('option');
        opt.value = w.id;
        const flagMark = flaggedMap[w.id] ? '🚨 ' : '';
        const candMark = candCounts[w.id] ? ` [✨${candCounts[w.id]}件]` : '';
        opt.textContent = `[${i+1}/${list.length}] ${flagMark}${w.name}${candMark}`;
        select.appendChild(opt);
      });
    }

    function onCompareWordSelectChange() {
      const select = document.getElementById('compare-word-select');
      const w = getVocabById(select.value);
      if (w) loadCompareWord(w);
    }

    function stepCompareWord(direction) {
      const list = getVocabList();
      if (!dtCurrentWord || list.length === 0) return;
      let idx = list.findIndex(w => w.id === dtCurrentWord.id);
      if (idx === -1) idx = 0;
      let nextIdx = (idx + direction + list.length) % list.length;
      loadCompareWord(list[nextIdx]);
    }

    function loadCompareWord(word) {
      dtCurrentWord = word;

      const select = document.getElementById('compare-word-select');
      if (select) select.value = word.id;

      document.getElementById('compare-title-name').textContent = word.name;
      const reading = word.ruby || word.kana || word.tts_text || '';
      document.getElementById('compare-title-reading').textContent = reading ? `【${reading}】` : '';
      document.getElementById('compare-title-cat').textContent = `${word.categoryName || word.category} ＞ ${word.subCategoryName || ''}`;

      const prodImgUrl = getProductionImgUrl(word.id);
      document.getElementById('compare-img-old-split').src = prodImgUrl;
      document.getElementById('compare-img-old-slider').src = prodImgUrl;

      const wordCands = dtHistory.filter(h => h.word_id === word.id && !h.is_backup);
      if (wordCands.length > 0) {
        const latestBaseName = wordCands[0].url.split('/').pop();
        setCompareCandidateImage(latestBaseName);
      } else {
        clearCompareCandidateImage();
      }

      renderWordCandidatesStrip();
      updateCompareToggleView();
    }

    function clearCompareCandidateImage() {
      dtCurrentCandidateFilename = null;
      document.getElementById('compare-img-new-split').style.display = 'none';
      document.getElementById('compare-no-new-split').style.display = 'flex';
      document.getElementById('compare-img-new-slider').src = '';
      document.getElementById('compare-cand-timestamp').textContent = '-';
      document.getElementById('compare-apply-btn').disabled = true;
      document.getElementById('compare-discard-btn').disabled = true;
    }

    function setCompareCandidateImage(filename) {
      if (!filename) {
        clearCompareCandidateImage();
        return;
      }
      dtCurrentCandidateFilename = filename;
      const fullUrl = getCandidateImgUrl(filename);

      const histItem = dtHistory.find(h => h.url.split('/').pop() === filename);
      const timeStr = histItem && histItem.timestamp ? new Date(histItem.timestamp).toLocaleString() : '';
      document.getElementById('compare-cand-timestamp').textContent = timeStr ? `生成日時: ${timeStr}` : '生成候補';

      const imgSplit = document.getElementById('compare-img-new-split');
      imgSplit.dataset.retried = '0';
      imgSplit.onerror = function() {
        if (this.dataset.retried === '0') {
          this.dataset.retried = '1';
          setTimeout(() => { this.src = `${fullUrl}&retry=${Date.now()}`; }, 350);
        }
      };
      imgSplit.src = fullUrl;
      imgSplit.style.display = 'block';
      document.getElementById('compare-no-new-split').style.display = 'none';

      document.getElementById('compare-img-new-slider').src = fullUrl;
      document.getElementById('compare-apply-btn').disabled = false;
      document.getElementById('compare-discard-btn').disabled = false;

      updateCompareToggleView();
      renderWordCandidatesStrip();
    }

    function renderWordCandidatesStrip() {
      const container = document.getElementById('compare-cand-thumbs');
      if (!container || !dtCurrentWord) return;
      container.innerHTML = '';

      const cands = dtHistory.filter(h => h.word_id === dtCurrentWord.id && !h.is_backup);
      if (cands.length === 0) {
        container.innerHTML = '<span style="font-size: 0.75rem; color: #64748b;">候補なし</span>';
        return;
      }

      cands.forEach((cand) => {
        const filename = cand.url.split('/').pop();
        const candUrl = getCandidateImgUrl(filename);
        const thumb = document.createElement('div');
        thumb.className = `cand-thumb-card ${dtCurrentCandidateFilename === filename ? 'active' : ''}`;
        thumb.onclick = () => setCompareCandidateImage(filename);
        thumb.innerHTML = `<img src="${candUrl}" alt="cand" />`;
        container.appendChild(thumb);
      });
    }

    // Mode Switcher: Split / Slider / Toggle
    function setCompareMode(mode) {
      currentCompareMode = mode;
      document.getElementById('btn-mode-split').classList.toggle('active', mode === 'split');
      document.getElementById('btn-mode-slider').classList.toggle('active', mode === 'slider');
      document.getElementById('btn-mode-toggle').classList.toggle('active', mode === 'toggle');

      document.getElementById('compare-panes').style.display = mode === 'split' ? 'flex' : 'none';
      document.getElementById('compare-slider-stage').style.display = mode === 'slider' ? 'block' : 'none';
      document.getElementById('compare-toggle-stage').style.display = mode === 'toggle' ? 'flex' : 'none';

      if (mode === 'toggle') updateCompareToggleView();
    }

    function toggleCompareFlipImage() {
      isShowingNewInToggle = !isShowingNewInToggle;
      updateCompareToggleView();
    }

    function updateCompareToggleView() {
      if (!dtCurrentWord) return;
      const imgToggle = document.getElementById('compare-img-toggle');
      const badge = document.getElementById('compare-toggle-badge');
      if (!imgToggle || !badge) return;

      if (isShowingNewInToggle && dtCurrentCandidateFilename) {
        imgToggle.src = getCandidateImgUrl(dtCurrentCandidateFilename);
        badge.textContent = '✨ 新画像 (Draw Things)';
        badge.style.background = 'rgba(16, 185, 129, 0.2)';
        badge.style.border = '1px solid #10b981';
        badge.style.color = '#6ee7b7';
      } else {
        imgToggle.src = getProductionImgUrl(dtCurrentWord.id);
        badge.textContent = '現在の本番画像 (旧)';
        badge.style.background = 'rgba(239, 68, 68, 0.2)';
        badge.style.border = '1px solid #ef4444';
        badge.style.color = '#fca5a5';
      }
    }

    function initCompareSlider() {
      const stage = document.getElementById('compare-slider-stage');
      const divider = document.getElementById('compare-slider-divider');
      const over = document.getElementById('compare-slider-over');
      if (!stage || !divider || !over) return;

      let isDragging = false;
      const updateSlider = (clientX) => {
        const rect = stage.getBoundingClientRect();
        let pct = ((clientX - rect.left) / rect.width) * 100;
        pct = Math.max(0, Math.min(100, pct));
        over.style.width = pct + '%';
        divider.style.left = pct + '%';
      };

      divider.addEventListener('mousedown', () => isDragging = true);
      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('mousemove', (e) => {
        if (isDragging) updateSlider(e.clientX);
      });
      divider.addEventListener('touchstart', () => isDragging = true);
      window.addEventListener('touchend', () => isDragging = false);
      window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches[0]) updateSlider(e.touches[0].clientX);
      });
    }

    // ========================================================
    // ADOPT & DISCARD API HANDLERS
    // ========================================================
    async function handleCompareApply() {
      if (!dtCurrentWord || !dtCurrentCandidateFilename) return;
      if (!confirm(`「${dtCurrentWord.name}」(${dtCurrentWord.id}) の本番画像として保存し、図鑑に反映しますか？`)) {
        return;
      }

      try {
        const res = await fetch(`${DT_SERVER}/api/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            word_id: dtCurrentWord.id,
            filename: dtCurrentCandidateFilename
          })
        });
        const data = await res.json();
        if (data.success) {
          const newProdUrl = getProductionImgUrl(dtCurrentWord.id);
          document.getElementById('compare-img-old-split').src = newProdUrl;
          document.getElementById('compare-img-old-slider').src = newProdUrl;

          if (flaggedMap && flaggedMap[dtCurrentWord.id]) {
            delete flaggedMap[dtCurrentWord.id];
            saveFlagsToStorage();
            updateStats();
          }

          document.getElementById('compare-apply-btn').disabled = true;
          showToast(`🎉「${dtCurrentWord.name}」の本番画像を図鑑に反映しました！`);
          syncHistoryFromServer();
        } else {
          alert("保存エラー: " + (data.error || '不明なエラー'));
        }
      } catch (e) {
        alert("エラー: " + e);
      }
    }

    async function handleCompareDiscard() {
      if (!dtCurrentCandidateFilename) return;
      if (!confirm("この生成画像を破棄しますか？")) return;

      const discardedFilename = dtCurrentCandidateFilename;
      dtHistory = dtHistory.filter(h => h.url.split('/').pop() !== discardedFilename);
      clearCompareCandidateImage();
      updateHistoryPillCount();
      renderWordCandidatesStrip();
      renderDrawerList();

      try {
        await fetch(`${DT_SERVER}/api/discard`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: discardedFilename })
        });
        showToast("🗑️ 生成画像を破棄しました");
      } catch (e) {}
    }

    async function applyHistoryDirect(filename, wordId, wordName) {
      if (!confirm(`「${wordName}」(${wordId}) の画像を本番として図鑑に反映しますか？`)) return;
      try {
        const res = await fetch(`${DT_SERVER}/api/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ word_id: wordId, filename: filename })
        });
        const data = await res.json();
        if (data.success) {
          if (flaggedMap && flaggedMap[wordId]) {
            delete flaggedMap[wordId];
            saveFlagsToStorage();
            updateStats();
          }
          if (dtCurrentWord && dtCurrentWord.id === wordId) {
            loadCompareWord(dtCurrentWord);
          }
          showToast(`🎉「${wordName}」の本番画像を更新しました！`);
          syncHistoryFromServer();
        } else {
          alert("保存エラー: " + data.error);
        }
      } catch (e) {
        alert("エラー: " + e);
      }
    }

    async function discardHistoryDirect(filename) {
      if (!confirm("この生成画像を破棄しますか？")) return;
      dtHistory = dtHistory.filter(h => h.url.split('/').pop() !== filename);
      if (dtCurrentCandidateFilename === filename) {
        clearCompareCandidateImage();
      }
      renderDrawerList();
      updateHistoryPillCount();
      renderWordCandidatesStrip();

      try {
        await fetch(`${DT_SERVER}/api/discard`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: filename })
        });
        showToast("🗑️ 画像を破棄しました");
      } catch (e) {}
    }

    // ========================================================
    // TOAST & UTILITIES
    // ========================================================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
