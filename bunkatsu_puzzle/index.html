<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4T10JYJ9XC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-4T10JYJ9XC');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="写真やイラストを分割して遊ぶ、知育・学習向けスライド＆合体パズルアプリです。">
    <link rel="apple-touch-icon" href="img.png">
    <link rel="icon" href="img.png">
    <title>分割パズル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 1. ホーム画面 -->
        <div id="home-screen" class="screen active">
            <button id="btn-start" class="btn-start">スタート</button>
            <div class="setting-wrapper">
                <button id="btn-setting" class="btn-secondary">設定</button>
                <div class="setting-note">※トリプルタップ</div>
            </div>
            <div class="setting-wrapper">
                <button id="btn-history" class="btn-secondary">履歴</button>
                <div class="setting-note">※トリプルタップ</div>
            </div>
        </div>

        <!-- 2. プレイ画面 -->
        <div id="play-screen" class="screen">
            <button id="btn-back-home" class="btn-back">＜ もどる</button>
            <div id="clear-count" class="clear-count">0</div>

            <div id="puzzle-stage" class="puzzle-stage"></div>

            <div id="next-overlay" class="next-overlay hidden">
                <button id="btn-next" class="btn-next">つぎへ</button>
            </div>
        </div>

        <!-- 履歴モーダル -->
        <div id="history-modal" class="modal-overlay hidden">
            <div class="history-modal-container">
                <div class="history-modal-header">
                    <span class="history-modal-title">プレイ履歴</span>
                    <button id="btn-close-history" class="btn-modal-close">閉じる</button>
                </div>
                <div id="history-modal-list" class="history-modal-list"></div>
                <div class="history-modal-footer">
                    <button id="btn-clear-history" class="btn-modal-danger">履歴を消去</button>
                </div>
            </div>
        </div>

        <!-- 3. 設定画面 -->
        <div id="setting-screen" class="screen">
            <div class="setting-container">
                <div class="setting-header">
                    <span class="setting-title">設定</span>
                </div>

                <!-- 2カラム配置エリア -->
                <div class="setting-main-layout">
                    <!-- 左カラム：各種設定・写真管理 -->
                    <div class="setting-left-col">
                        <!-- 分割設定 -->
                        <div class="setting-section">
                            <div class="section-title">分割設定</div>
                            <div class="setting-row">
                                <label><span>縦 (行数)</span><span id="label-rows">1</span></label>
                                <input type="range" id="slider-rows" min="1" max="10" value="1">
                            </div>
                            <div class="setting-row">
                                <label><span>横 (列数)</span><span id="label-cols">2</span></label>
                                <input type="range" id="slider-cols" min="1" max="10" value="2">
                            </div>
                        </div>

                        <!-- 問題数・回転・戻るボタン設定 -->
                        <div class="setting-section">
                            <div class="section-title">ゲーム動作設定</div>
                            <div class="setting-row">
                                <label><span>問題数</span><span id="label-questions">10</span></label>
                                <input type="range" id="slider-questions" min="1" max="50" value="10">
                            </div>
                            <div class="setting-row checkbox-row">
                                <span>ピースの回転</span>
                                <input type="checkbox" id="toggle-rotation" checked>
                            </div>
                            <div class="setting-row checkbox-row">
                                <span>「もどる」ボタンを表示</span>
                                <input type="checkbox" id="toggle-back-btn" checked>
                            </div>
                        </div>

                        <!-- 写真の登録・管理 -->
                        <div class="setting-section">
                            <div class="section-title">写真の登録・管理</div>
                            <div class="photo-upload-row">
                                <label for="file-input" class="btn-add-photo">写真を追加する</label>
                                <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
                            </div>
                            <div id="photo-list" class="photo-list"></div>
                            <div class="photo-actions">
                                <button id="btn-clear-custom" class="btn-text-danger">追加した写真をすべて削除</button>
                                <button id="btn-reset-presets" class="btn-text-subtle">サンプル写真に戻す</button>
                            </div>
                        </div>

                        <button id="btn-done" class="btn-done">完了</button>
                    </div>

                    <!-- 右カラム：プレイ画面を忠実に再現したサンプルビュー -->
                    <div class="setting-right-col">
                        <div class="setting-section preview-section">
                            <div class="sample-view-title">サンプルビュー（プレイ画面）</div>
                            <div class="preview-box">
                                <div id="preview-btn-back" class="preview-btn-back">＜ もどる</div>
                                <div class="preview-clear-count">0</div>
                                <div id="preview-stage" class="preview-stage">
                                    <!-- 実際のピース分割と散らばりをミニチュア再現 -->
                                </div>
                            </div>
                            <div class="preview-hint">※設定した行数・列数・回転でピースが散らばる様子です</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
