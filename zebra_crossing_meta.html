<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横断歩道 ARシミュレーター (Meta Quest専用版)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      user-select: none;
    }
    #enter-ar-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #00e676;
      color: #000;
      border: none;
      font-weight: bold;
      font-size: 20px;
      padding: 18px 40px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 230, 118, 0.5);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<button id="enter-ar-btn" onclick="startXRSession()">Meta QuestでARを開始</button>

<script>
  let scene, camera, renderer;
  let roadAnchor, dimDome, reticle;
  let flashMesh3D, sparkleGroup;
  let sparkles = [];
  let hitTestSource = null;
  let hitTestSourceRequested = false;

  let controller, raycaster;
  let laserLine, pointerDot;

  let uiMesh, uiCanvas, uiCtx, uiTexture;
  let isUIMinimized = false;
  let isDraggingUI = false;

  let isPlaced = false;
  let isRunning = false;
  let currentSide = 'near';
  let isCrossing = false;
  let isCooldown = false;
  let isOffCrosswalkWarned = false;

  let roadMesh, sidewalkNear, sidewalkFar, stopLineNear, stopLineFar;
  let centerLineGroup, crosswalkGroup;

  let poleNear, poleFar, headNear, headFar;
  let redLampNear, greenLampNear, redLampFar, greenLampFar;
  let redTexOn, redTexOff, greenTexOn, greenTexOff;

  let isSignalHighlighted = false;
  let cars = [];
  let currentMode = 'no-signal';
  let difficulty = 'normal';
  let roadDepth = 3.0;
  let backgroundDim = 50;
  const crosswalkHalfWidth = 3.5;

  const diffConfigs = {
    easy:   { trafficDuration: 6.0, clearDuration: 8.5, spawnProb: 0.020, maxCars: 3, speedMin: 0.16, speedMax: 0.20, greenDur: 20, redDur: 10 },
    normal: { trafficDuration: 8.0, clearDuration: 5.5, spawnProb: 0.030, maxCars: 5, speedMin: 0.20, speedMax: 0.26, greenDur: 16, redDur: 12 },
    hard:   { trafficDuration: 11.0, clearDuration: 3.5, spawnProb: 0.040, maxCars: 6, speedMin: 0.24, speedMax: 0.30, greenDur: 14, redDur: 14 }
  };

  let trafficTimer = 0;
  let isClearPhase = false;
  const blinkDuration = 4;
  let checkedLeft = false;
  let checkedRight = false;
  let wasHonked = false;

  let signalTimer = 0;
  let isGreenLight = false;
  let isBlinking = false;

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playHorn() {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(420, now);
    osc2.frequency.setValueAtTime(470, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.25, now + 0.04);
    gain.gain.setValueAtTime(0.25, now + 0.38);
    gain.gain.linearRampToValueAtTime(0, now + 0.48);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.48);
    osc2.stop(now + 0.48);
  }

  function playSuccessSound() {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(659.25, now);
    gain1.gain.setValueAtTime(0, now);
    gain1.gain.linearRampToValueAtTime(0.28, now + 0.02);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.38);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(880.0, now + 0.16);
    gain2.gain.setValueAtTime(0, now + 0.16);
    gain2.gain.linearRampToValueAtTime(0.28, now + 0.18);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.70);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now + 0.16);
    osc2.stop(now + 0.70);
  }

  function triggerRedFlash(duration = 800) {
    if (flashMesh3D) {
      flashMesh3D.material.opacity = 0.55;
      setTimeout(() => {
        flashMesh3D.material.opacity = 0.0;
      }, duration);
    }
  }

  function createStarGeometry(outerRadius, innerRadius, points) {
    const shape = new THREE.Shape();
    let rot = Math.PI / 2 * 3;
    const step = Math.PI / points;

    shape.moveTo(0, -outerRadius);
    for (let i = 0; i < points; i++) {
      shape.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
      rot += step;
      shape.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
      rot += step;
    }
    shape.closePath();
    return new THREE.ShapeGeometry(shape);
  }

  function triggerSparkles() {
    const starGeo = createStarGeometry(0.07, 0.03, 4);
    const colors = [0xffd700, 0xffffff, 0x00e676, 0xffeb3b, 0x00e5ff];
    const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);

    const spawnOrigin = camPos.clone().add(camDir.multiplyScalar(1.2));

    for (let i = 0; i < 45; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        transparent: true,
        opacity: 1.0,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(starGeo, mat);
      mesh.position.copy(spawnOrigin);

      const angle = Math.random() * Math.PI * 2;
      const speed = 0.8 + Math.random() * 1.6;
      mesh.userData = {
        vx: Math.cos(angle) * speed * 0.016,
        vy: (Math.sin(angle) * speed + 0.5) * 0.016,
        vz: (Math.random() - 0.5) * 0.01,
        rotSpeed: (Math.random() - 0.5) * 0.15,
        decay: 0.018 + Math.random() * 0.012
      };

      sparkleGroup.add(mesh);
      sparkles.push(mesh);
    }
  }

  function updateSparkles() {
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const p = sparkles[i];
      p.position.x += p.userData.vx;
      p.position.y += p.userData.vy;
      p.position.z += p.userData.vz;
      p.userData.vy -= 0.0008;
      p.rotation.z += p.userData.rotSpeed;
      p.material.opacity -= p.userData.decay;

      if (p.material.opacity <= 0) {
        sparkleGroup.remove(p);
        p.geometry.dispose();
        p.material.dispose();
        sparkles.splice(i, 1);
      }
    }
  }

  function getCarScale() {
    return Math.min(1.0, roadDepth / 6.0);
  }

  init();

  function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
    scene.add(camera);

    const flashGeo = new THREE.PlaneGeometry(2, 2);
    const flashMat = new THREE.MeshBasicMaterial({
      color: 0xff1744,
      transparent: true,
      opacity: 0.0,
      depthTest: false,
      depthWrite: false
    });
    flashMesh3D = new THREE.Mesh(flashGeo, flashMat);
    flashMesh3D.position.set(0, 0, -0.1);
    flashMesh3D.renderOrder = 99999;
    camera.add(flashMesh3D);

    sparkleGroup = new THREE.Group();
    scene.add(sparkleGroup);

    const dimGeo = new THREE.SphereGeometry(200, 32, 16);
    const dimMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.5,
      side: THREE.BackSide,
      depthWrite: false
    });
    dimDome = new THREE.Mesh(dimGeo, dimMat);
    scene.add(dimDome);

    roadAnchor = new THREE.Group();
    roadAnchor.visible = false;
    scene.add(roadAnchor);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const reticleGeo = new THREE.RingGeometry(0.18, 0.22, 32).rotateX(-Math.PI / 2);
    const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00e676 });
    reticle = new THREE.Mesh(reticleGeo, reticleMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    generateSignalTextures();
    buildEnvironment();
    createPedestrianSignals();

    poleNear.visible = false;
    poleFar.visible = false;

    setupQuestControllers();
    buildFloating3DUI();

    window.addEventListener('resize', onWindowResize);
    renderer.setAnimationLoop(renderLoop);
  }

  function setupQuestControllers() {
    raycaster = new THREE.Raycaster();

    controller = renderer.xr.getController(0);
    controller.addEventListener('selectstart', onSelectStart);
    controller.addEventListener('selectend', onSelectEnd);
    controller.addEventListener('squeezestart', onSqueezeStart); // グリップボタンでUI呼び出し
    scene.add(controller);

    const laserGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -2.5)
    ]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0x00e676, transparent: true, opacity: 0.7 });
    laserLine = new THREE.Line(laserGeo, laserMat);
    controller.add(laserLine);

    const dotGeo = new THREE.RingGeometry(0.01, 0.015, 16);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x00e676, side: THREE.DoubleSide });
    pointerDot = new THREE.Mesh(dotGeo, dotMat);
    pointerDot.visible = false;
    scene.add(pointerDot);
  }

  function buildFloating3DUI() {
    uiCanvas = document.createElement('canvas');
    uiCanvas.width = 1024;
    uiCanvas.height = 512;
    uiCtx = uiCanvas.getContext('2d');

    uiTexture = new THREE.CanvasTexture(uiCanvas);
    const uiGeo = new THREE.PlaneGeometry(1.2, 0.6);
    const uiMat = new THREE.MeshBasicMaterial({ map: uiTexture, transparent: true, side: THREE.DoubleSide });

    uiMesh = new THREE.Mesh(uiGeo, uiMat);
    uiMesh.position.set(0, 1.3, -1.2);
    scene.add(uiMesh);

    renderCanvasUI();
  }

  const uiHitBoxes = [
    { id: 'btn_start', x: 40, y: 25, w: 200, h: 55 },
    { id: 'btn_repose', x: 260, y: 25, w: 180, h: 55 },
    { id: 'btn_hide', x: 800, y: 25, w: 180, h: 55 },
    { id: 'btn_mode', x: 40, y: 110, w: 440, h: 55 },
    { id: 'btn_diff', x: 40, y: 180, w: 440, h: 55 },
    { id: 'width_minus', x: 260, y: 250, w: 65, h: 55 },
    { id: 'width_plus', x: 415, y: 250, w: 65, h: 55 },
    { id: 'btn_highlight', x: 40, y: 320, w: 440, h: 55 },
    { id: 'dim_minus', x: 740, y: 110, w: 65, h: 55 },
    { id: 'dim_plus', x: 910, y: 110, w: 65, h: 55 },
    { id: 'btn_bring_ui', x: 540, y: 320, w: 440, h: 55 }
  ];

  function renderCanvasUI() {
    const ctx = uiCtx;
    ctx.clearRect(0, 0, 1024, 512);

    if (isUIMinimized) {
      // 最小化時のコンパクト表示
      ctx.fillStyle = 'rgba(15, 20, 25, 0.95)';
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.roundRect(40, 120, 944, 272, 36);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00e676';
      ctx.font = 'bold 54px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚙ 設定UIを表示', 512, 275);
    } else {
      // 通常展開時のフル表示
      ctx.fillStyle = 'rgba(15, 20, 25, 0.94)';
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(10, 10, 1004, 492, 24);
      ctx.fill();
      ctx.stroke();

      // ヘッダー部ドラッグ案内
      ctx.fillStyle = '#546e7a';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('≡ 余白をトリガーで掴んでドラッグ移動', 550, 60);

      // 上部メインボタン
      ctx.fillStyle = isRunning ? '#ff5252' : '#00e676';
      ctx.beginPath();
      ctx.roundRect(40, 25, 200, 55, 10);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(isRunning ? '■ 停止' : '▶ スタート', 140, 63);

      ctx.fillStyle = '#37474f';
      ctx.beginPath();
      ctx.roundRect(260, 25, 180, 55, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('位置再設定', 350, 61);

      // 非表示（最小化）ボタン
      ctx.fillStyle = '#b71c1c';
      ctx.beginPath();
      ctx.roundRect(800, 25, 180, 55, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('✕ 非表示', 890, 61);

      // 各種設定ボタン
      drawButton(ctx, 40, 110, 440, 55, `モード: ${currentMode === 'signal' ? '信号あり' : '信号なし'}`);
      const diffText = difficulty === 'easy' ? '難易度: かんたん (8.5s)' : difficulty === 'normal' ? '難易度: ふつう (5.5s)' : '難易度: むずかしい (3.5s)';
      drawButton(ctx, 40, 180, 440, 55, diffText);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`横断幅: ${roadDepth.toFixed(1)}m`, 40, 287);
      drawButton(ctx, 260, 250, 65, 55, '－');
      drawButton(ctx, 415, 250, 65, 55, '＋');

      drawButton(ctx, 40, 320, 440, 55, `灯器拡大: ${isSignalHighlighted ? 'ON' : 'OFF'}`);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`背景の暗さ: ${backgroundDim}%`, 540, 147);
      drawButton(ctx, 740, 110, 65, 55, '－');
      drawButton(ctx, 910, 110, 65, 55, '＋');

      // 首振りステータス
      ctx.fillStyle = '#1e282d';
      ctx.beginPath();
      ctx.roundRect(540, 180, 440, 115, 12);
      ctx.fill();
      ctx.fillStyle = '#90a4ae';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('首振り安全確認', 760, 212);

      ctx.fillStyle = checkedLeft ? '#2e7d32' : '#455a64';
      ctx.beginPath();
      ctx.roundRect(570, 230, 170, 45, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(checkedLeft ? '左確認済' : '左未確認', 655, 260);

      ctx.fillStyle = checkedRight ? '#2e7d32' : '#455a64';
      ctx.beginPath();
      ctx.roundRect(780, 230, 170, 45, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(checkedRight ? '右確認済' : '右未確認', 865, 260);

      drawButton(ctx, 540, 320, 440, 55, 'UIを目の前に呼ぶ');

      ctx.fillStyle = '#78909c';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isPlaced ? '道路設置済 (床を歩いて横断) / グリップボタンでUI呼び出し' : 'トリガーで道路設置 / グリップボタンでUI呼び出し', 512, 470);
    }

    uiTexture.needsUpdate = true;
  }

  function drawButton(ctx, x, y, w, h, text) {
    ctx.fillStyle = '#263238';
    ctx.strokeStyle = '#455a64';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(text, x + w / 2, y + h / 2 + 7);
  }

  function toggleUIMinimize() {
    isUIMinimized = !isUIMinimized;
    if (isUIMinimized) {
      uiMesh.geometry.dispose();
      uiMesh.geometry = new THREE.PlaneGeometry(0.35, 0.12);
    } else {
      uiMesh.geometry.dispose();
      uiMesh.geometry = new THREE.PlaneGeometry(1.2, 0.6);
    }
    renderCanvasUI();
  }

  function bringUIToFront() {
    const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const dist = isUIMinimized ? 0.9 : 1.2;
    uiMesh.position.set(
      camPos.x + camDir.x * dist,
      camPos.y - 0.1,
      camPos.z + camDir.z * dist
    );
    uiMesh.lookAt(camPos.x, camPos.y - 0.1, camPos.z);
  }

  function onSqueezeStart() {
    // グリップボタンを握るとUIを正面に呼び出し（最小化中なら展開）
    initAudio();
    if (isUIMinimized) {
      toggleUIMinimize();
    }
    bringUIToFront();
  }

  function onSelectStart() {
    initAudio();
    if (!controller) return;

    const tempMatrix = new THREE.Matrix4();
    tempMatrix.identity().extractRotation(controller.matrixWorld);

    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    const intersects = raycaster.intersectObject(uiMesh);

    if (intersects.length > 0) {
      if (isUIMinimized) {
        // 最小化時はクリックで展開
        toggleUIMinimize();
        return;
      }

      const uv = intersects[0].uv;
      const cx = uv.x * 1024;
      const cy = (1 - uv.y) * 512;

      let clickedButton = false;
      for (const btn of uiHitBoxes) {
        if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
          handleUIButton(btn.id);
          clickedButton = true;
          break;
        }
      }

      // ボタン以外のパネル余白をクリックした場合はドラッグ開始
      if (!clickedButton) {
        isDraggingUI = true;
        controller.attach(uiMesh);
      }
    } else {
      if (!isPlaced && reticle.visible) {
        anchorRoadToReticle();
      }
    }
  }

  function onSelectEnd() {
    if (isDraggingUI) {
      isDraggingUI = false;
      scene.attach(uiMesh);
    }
  }

  function handleUIButton(id) {
    switch (id) {
      case 'btn_start':
        if (!isPlaced) anchorRoadToUserFeet();
        isRunning = !isRunning;
        if (isRunning) resetSignalCycle();
        break;
      case 'btn_repose':
        anchorRoadToUserFeet();
        break;
      case 'btn_hide':
        toggleUIMinimize();
        break;
      case 'btn_mode':
        currentMode = (currentMode === 'signal') ? 'no-signal' : 'signal';
        poleNear.visible = (currentMode === 'signal');
        poleFar.visible = (currentMode === 'signal');
        resetCheckState();
        break;
      case 'btn_diff':
        if (difficulty === 'easy') difficulty = 'normal';
        else if (difficulty === 'normal') difficulty = 'hard';
        else difficulty = 'easy';
        trafficTimer = 0;
        isClearPhase = false;
        resetSignalCycle();
        break;
      case 'width_minus':
        if (roadDepth > 2.0) {
          roadDepth = Math.max(2.0, roadDepth - 0.5);
          updateRoadGeometryAndCars();
        }
        break;
      case 'width_plus':
        if (roadDepth < 7.0) {
          roadDepth = Math.min(7.0, roadDepth + 0.5);
          updateRoadGeometryAndCars();
        }
        break;
      case 'btn_highlight':
        isSignalHighlighted = !isSignalHighlighted;
        applySignalHighlight();
        break;
      case 'dim_minus':
        backgroundDim = Math.max(0, backgroundDim - 10);
        dimDome.material.opacity = backgroundDim / 100.0;
        break;
      case 'dim_plus':
        backgroundDim = Math.min(100, backgroundDim + 10);
        dimDome.material.opacity = backgroundDim / 100.0;
        break;
      case 'btn_bring_ui':
        bringUIToFront();
        break;
    }
    renderCanvasUI();
  }

  function startXRSession() {
    initAudio();
    if (!navigator.xr) {
      alert('Meta Quest Browserで開いてください。');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hit-test']
    }).then((session) => {
      renderer.xr.setSession(session);
      document.getElementById('enter-ar-btn').style.display = 'none';

      bringUIToFront();

      session.addEventListener('end', () => {
        document.getElementById('enter-ar-btn').style.display = 'block';
        isPlaced = false;
        isRunning = false;
        roadAnchor.visible = false;
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
    }).catch(e => {
      alert('XR起動エラー: ' + e.message);
    });
  }

  function anchorRoadToUserFeet() {
    const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const angle = Math.atan2(camDir.x, camDir.z) + Math.PI;
    roadAnchor.rotation.set(0, angle, 0);

    const offsetDist = roadDepth * 0.5 + 0.6;
    roadAnchor.position.set(
      camPos.x + camDir.x * offsetDist,
      0,
      camPos.z + camDir.z * offsetDist
    );

    roadAnchor.visible = true;
    isPlaced = true;
    reticle.visible = false;
    currentSide = 'near';
    resetCheckState();
    renderCanvasUI();
  }

  function anchorRoadToReticle() {
    const reticlePos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
    const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const angle = Math.atan2(camDir.x, camDir.z) + Math.PI;
    roadAnchor.rotation.set(0, angle, 0);

    const offsetDist = roadDepth * 0.5 + 0.6;
    roadAnchor.position.set(
      camPos.x + camDir.x * offsetDist,
      reticlePos.y,
      camPos.z + camDir.z * offsetDist
    );

    roadAnchor.visible = true;
    isPlaced = true;
    reticle.visible = false;
    currentSide = 'near';
    resetCheckState();
    renderCanvasUI();
  }

  function updateRoadGeometryAndCars() {
    updateRoadGeometry();

    const carScale = getCarScale();
    const laneOffset = (roadDepth * 0.5) * 0.5;
    for (let i = 0; i < cars.length; i++) {
      const car = cars[i];
      car.mesh.scale.set(carScale, 1.0, carScale);
      car.mesh.position.z = car.isNearLane ? laneOffset : -laneOffset;
    }

    if (isPlaced && !isRunning) {
      anchorRoadToUserFeet();
    }
  }

  function updateRoadGeometry() {
    if (!roadMesh) return;
    roadMesh.geometry.dispose();
    roadMesh.geometry = new THREE.PlaneGeometry(160, roadDepth);

    const halfDepth = roadDepth * 0.5;
    if (sidewalkNear) sidewalkNear.position.set(0, 0.005, halfDepth + 1.25);
    if (sidewalkFar) sidewalkFar.position.set(0, 0.005, -(halfDepth + 1.25));

    const laneOffset = halfDepth * 0.5;
    if (stopLineNear) stopLineNear.position.set(3.2, 0.02, laneOffset);
    if (stopLineFar) stopLineFar.position.set(-3.2, 0.02, -laneOffset);

    if (crosswalkGroup) {
      while (crosswalkGroup.children.length > 0) {
        crosswalkGroup.remove(crosswalkGroup.children[0]);
      }
      const numStripes = Math.max(3, Math.floor(roadDepth / 0.85));
      const step = (roadDepth - 0.6) / numStripes;
      for (let i = 0; i <= numStripes; i++) {
        const z = -halfDepth + 0.3 + i * step;
        const stripe = new THREE.Mesh(
          new THREE.PlaneGeometry(5.0, 0.42),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        stripe.rotation.x = -Math.PI / 2;
        stripe.position.set(0, 0.02, z);
        crosswalkGroup.add(stripe);
      }
    }

    if (poleFar && poleNear) {
      poleFar.position.set(2.6, 0, -(halfDepth + 0.9));
      poleNear.position.set(-2.6, 0, halfDepth + 0.9);
    }
  }

  function applySignalHighlight() {
    if (!headNear || !headFar) return;
    const scaleFactor = isSignalHighlighted ? 1.6 : 1.0;
    headNear.scale.set(scaleFactor, scaleFactor, scaleFactor);
    headFar.scale.set(scaleFactor, scaleFactor, scaleFactor);
  }

  function resetCheckState() {
    checkedLeft = false;
    checkedRight = false;
    isCrossing = false;
    wasHonked = false;
    isOffCrosswalkWarned = false;
    renderCanvasUI();
  }

  function resetSignalCycle() {
    signalTimer = 0;
    isGreenLight = false;
    isBlinking = false;
    updateSignalLamps();
  }

  function createPedestrianCanvas(type, isOn) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, 128, 128);

    const mainColor = isOn 
      ? (type === 'red' ? '#ff2200' : '#00e676') 
      : (type === 'red' ? '#330800' : '#002611');

    ctx.fillStyle = mainColor;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';

    if (type === 'red') {
      ctx.beginPath();
      ctx.arc(64, 30, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(64, 46);
      ctx.lineTo(64, 82);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(48, 54);
      ctx.lineTo(80, 54);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(56, 114);
      ctx.lineTo(60, 82);
      ctx.lineTo(68, 82);
      ctx.lineTo(72, 114);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(70, 28, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(68, 44);
      ctx.lineTo(60, 78);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(44, 62);
      ctx.lineTo(66, 50);
      ctx.lineTo(84, 62);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(40, 112);
      ctx.lineTo(54, 86);
      ctx.lineTo(60, 78);
      ctx.lineTo(74, 94);
      ctx.lineTo(88, 112);
      ctx.stroke();
    }

    return new THREE.CanvasTexture(canvas);
  }

  function generateSignalTextures() {
    redTexOn = createPedestrianCanvas('red', true);
    redTexOff = createPedestrianCanvas('red', false);
    greenTexOn = createPedestrianCanvas('green', true);
    greenTexOff = createPedestrianCanvas('green', false);
  }

  function buildEnvironment() {
    const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x78909c, transparent: true, opacity: 0.85 });

    sidewalkNear = new THREE.Mesh(new THREE.PlaneGeometry(160, 2.5), sidewalkMat);
    sidewalkNear.rotation.x = -Math.PI / 2;
    roadAnchor.add(sidewalkNear);

    sidewalkFar = new THREE.Mesh(new THREE.PlaneGeometry(160, 2.5), sidewalkMat);
    sidewalkFar.rotation.x = -Math.PI / 2;
    roadAnchor.add(sidewalkFar);

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x263238, transparent: true, opacity: 0.92 });
    roadMesh = new THREE.Mesh(new THREE.PlaneGeometry(160, roadDepth), roadMat);
    roadMesh.rotation.x = -Math.PI / 2;
    roadMesh.position.set(0, 0.01, 0);
    roadAnchor.add(roadMesh);

    centerLineGroup = new THREE.Group();
    for (let x = -75; x < 80; x += 8) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.015, 0);
      centerLineGroup.add(line);
    }
    roadAnchor.add(centerLineGroup);

    crosswalkGroup = new THREE.Group();
    roadAnchor.add(crosswalkGroup);

    const stopMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    stopLineNear = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLineNear.rotation.x = -Math.PI / 2;
    roadAnchor.add(stopLineNear);

    stopLineFar = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLineFar.rotation.x = -Math.PI / 2;
    roadAnchor.add(stopLineFar);

    updateRoadGeometry();
  }

  function createSignalUnit(facingAngle) {
    const group = new THREE.Group();

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 3.2),
      new THREE.MeshLambertMaterial({ color: 0x546e7a })
    );
    pole.position.y = 1.6;
    group.add(pole);

    const head = new THREE.Group();
    head.position.set(0, 2.3, 0);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 1.1, 0.26),
      new THREE.MeshLambertMaterial({ color: 0x212121 })
    );
    head.add(box);

    const visorMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
    const topVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    topVisor.position.set(0, 0.40, 0.16);
    topVisor.rotation.x = 0.2;
    head.add(topVisor);

    const midVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    midVisor.position.set(0, -0.07, 0.16);
    midVisor.rotation.x = 0.2;
    head.add(midVisor);

    const lampGeo = new THREE.PlaneGeometry(0.42, 0.42);
    const redLamp = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: redTexOn, transparent: true }));
    redLamp.position.set(0, 0.22, 0.135);
    head.add(redLamp);

    const greenLamp = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: greenTexOff, transparent: true }));
    greenLamp.position.set(0, -0.25, 0.135);
    head.add(greenLamp);

    head.rotation.y = facingAngle;
    group.add(head);

    return { group, head, redLamp, greenLamp };
  }

  function createPedestrianSignals() {
    const farUnit = createSignalUnit(0);
    poleFar = farUnit.group;
    headFar = farUnit.head;
    redLampFar = farUnit.redLamp;
    greenLampFar = farUnit.greenLamp;
    roadAnchor.add(poleFar);

    const nearUnit = createSignalUnit(Math.PI);
    poleNear = nearUnit.group;
    headNear = nearUnit.head;
    redLampNear = nearUnit.redLamp;
    greenLampNear = nearUnit.greenLamp;
    roadAnchor.add(poleNear);

    applySignalHighlight();
    updateRoadGeometry();
  }

  function setChecked(side) {
    if (side === 'left' && !checkedLeft) {
      checkedLeft = true;
      renderCanvasUI();
    } else if (side === 'right' && !checkedRight) {
      checkedRight = true;
      renderCanvasUI();
    }
  }

  function createCarMesh(direction) {
    const carGroup = new THREE.Group();
    const colors = [0xd32f2f, 0x1976d2, 0xfbc02d, 0x388e3c, 0xf5f5f5, 0x333333];
    const color = colors[Math.floor(Math.random() * colors.length)];

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(4.0, 0.88, 1.68),
      new THREE.MeshLambertMaterial({ color })
    );
    body.position.y = 0.54;
    carGroup.add(body);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.64, 1.48),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    roof.position.set(-0.24 * direction, 1.22, 0);
    carGroup.add(roof);
    return carGroup;
  }

  function spawnCarAt(xPos, isNearLane) {
    const direction = isNearLane ? -1 : 1;
    const laneOffset = (roadDepth * 0.5) * 0.5;
    const zPos = isNearLane ? laneOffset : -laneOffset;

    const conf = diffConfigs[difficulty];
    const baseSpeed = conf.speedMin + Math.random() * (conf.speedMax - conf.speedMin);

    const carGroup = createCarMesh(direction);
    const carScale = getCarScale();
    carGroup.scale.set(carScale, 1.0, carScale);

    carGroup.position.set(xPos, 0, zPos);
    roadAnchor.add(carGroup);

    cars.push({
      mesh: carGroup,
      isNearLane: isNearLane,
      direction: direction,
      baseSpeed: baseSpeed,
      currentSpeed: baseSpeed,
      hasHonked: false
    });
  }

  function spawnCar() {
    const isNearLane = Math.random() > 0.5;
    const spawnX = isNearLane ? 75 : -75;

    const tooClose = cars.some(c => c.isNearLane === isNearLane && Math.abs(c.mesh.position.x - spawnX) < 22);
    if (tooClose) return;

    spawnCarAt(spawnX, isNearLane);
  }

  function updateCars(localPlayerPos) {
    const conf = diffConfigs[difficulty];
    trafficTimer += 0.016;

    if (!isClearPhase) {
      if (trafficTimer >= conf.trafficDuration) {
        trafficTimer = 0;
        isClearPhase = true;
      } else {
        if (Math.random() < conf.spawnProb && cars.length < conf.maxCars) {
          spawnCar();
        }
      }
    } else {
      if (trafficTimer >= conf.clearDuration) {
        trafficTimer = 0;
        isClearPhase = false;
      }
    }

    const carMustStopForSignal = (currentMode === 'signal' && isGreenLight);
    const carScale = getCarScale();

    for (let i = cars.length - 1; i >= 0; i--) {
      const car = cars[i];
      let targetSpeed = car.baseSpeed;
      let forceFullStop = false;

      if (carMustStopForSignal) {
        if (car.isNearLane) {
          const stopTargetX = 5.4;
          if (car.mesh.position.x >= stopTargetX) {
            const dist = car.mesh.position.x - stopTargetX;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) forceFullStop = true;
            }
          }
        } else {
          const stopTargetX = -5.4;
          if (car.mesh.position.x <= stopTargetX) {
            const dist = stopTargetX - car.mesh.position.x;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) forceFullStop = true;
            }
          }
        }
      }

      for (let j = 0; j < cars.length; j++) {
        if (i === j) continue;
        const other = cars[j];
        if (car.isNearLane === other.isNearLane) {
          const minGap = 5.0 * carScale;
          const maxGap = 11.0 * carScale;
          if (car.direction === -1) {
            const gap = car.mesh.position.x - other.mesh.position.x;
            if (gap > 0 && gap < maxGap) {
              const factor = Math.max(0, (gap - (4.8 * carScale)) / (6.2 * carScale));
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= minGap) forceFullStop = true;
            }
          } else {
            const gap = other.mesh.position.x - car.mesh.position.x;
            if (gap > 0 && gap < maxGap) {
              const factor = Math.max(0, (gap - (4.8 * carScale)) / (6.2 * carScale));
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= minGap) forceFullStop = true;
            }
          }
        }
      }

      const halfDepth = roadDepth * 0.5;
      const playerInRoad = (localPlayerPos.z < halfDepth && localPlayerPos.z > -halfDepth);

      if (playerInRoad) {
        const dx = Math.abs(car.mesh.position.x - localPlayerPos.x);
        const isHeadingToPlayer = (car.direction === -1 && car.mesh.position.x > localPlayerPos.x) ||
                                  (car.direction === 1 && car.mesh.position.x < localPlayerPos.x);

        const stopThresholdDist = Math.max(3.2, 7.0 * carScale);

        if (isHeadingToPlayer && dx < stopThresholdDist) {
          forceFullStop = true;
          targetSpeed = 0;
          car.currentSpeed = 0;

          const isSignalSafe = (currentMode === 'signal' && isGreenLight);

          if (!isSignalSafe && isCrossing && !isCooldown && !car.hasHonked) {
            playHorn();
            car.hasHonked = true;
            wasHonked = true;
            triggerImmediateViolation();
          }
        }
      }

      if (forceFullStop) {
        car.currentSpeed = 0;
      } else {
        car.currentSpeed += (targetSpeed - car.currentSpeed) * 0.15;
      }

      car.mesh.position.x += car.currentSpeed * car.direction;

      if (Math.abs(car.mesh.position.x) > 85) {
        roadAnchor.remove(car.mesh);
        cars.splice(i, 1);
        continue;
      }
    }
  }

  function updateSignal() {
    if (currentMode !== 'signal') return;

    const conf = diffConfigs[difficulty];
    signalTimer += 0.016;

    const totalCycle = conf.redDur + conf.greenDur;
    if (signalTimer >= totalCycle) signalTimer = 0;

    isGreenLight = (signalTimer >= conf.redDur);
    const greenTimeLeft = totalCycle - signalTimer;
    isBlinking = isGreenLight && (greenTimeLeft <= blinkDuration);

    updateSignalLamps();
  }

  function updateSignalLamps() {
    if (!redLampNear || !greenLampNear) return;
    const redMap = isGreenLight ? redTexOff : redTexOn;
    let greenMap = greenTexOff;

    if (isGreenLight) {
      if (isBlinking) {
        const blinkState = Math.floor(signalTimer * 4) % 2 === 0;
        greenMap = blinkState ? greenTexOn : greenTexOff;
      } else {
        greenMap = greenTexOn;
      }
    }

    redLampNear.material.map = redMap;
    greenLampNear.material.map = greenMap;
    redLampFar.material.map = redMap;
    greenLampFar.material.map = greenMap;
  }

  function triggerImmediateViolation() {
    if (isCooldown) return;
    isCooldown = true;
    triggerRedFlash(900);

    setTimeout(() => {
      isCooldown = false;
    }, 1800);
  }

  function triggerSuccess() {
    if (isCooldown) return;
    isCooldown = true;
    isCrossing = false;
    playSuccessSound();
    triggerSparkles();

    setTimeout(() => {
      resetCheckState();
      isCooldown = false;
    }, 1800);
  }

  function updateControllerRay() {
    if (!controller) return;

    const tempMatrix = new THREE.Matrix4();
    tempMatrix.identity().extractRotation(controller.matrixWorld);

    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    const intersects = raycaster.intersectObject(uiMesh);

    if (intersects.length > 0) {
      const hit = intersects[0];
      pointerDot.visible = true;
      pointerDot.position.copy(hit.point);
      pointerDot.lookAt(camera.position);
    } else {
      pointerDot.visible = false;
    }
  }

  function renderLoop(timestamp, frame) {
    if (renderer.xr.isPresenting) {
      const session = renderer.xr.getSession();

      if (!hitTestSourceRequested) {
        session.requestReferenceSpace('viewer').then((referenceSpace) => {
          session.requestHitTestSource({ space: referenceSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        hitTestSourceRequested = true;
      }

      if (hitTestSource && !isPlaced) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }

      updateControllerRay();
      updateSparkles();

      if (isPlaced && isRunning) {
        updateSignal();

        const camWorldPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
        const localPlayerPos = roadAnchor.worldToLocal(camWorldPos.clone());

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        const localDir = camDir.clone().transformDirection(new THREE.Matrix4().copy(roadAnchor.matrixWorld).invert());

        if (currentSide === 'near') {
          if (localDir.x < -0.55) setChecked('left');
          else if (localDir.x > 0.55) setChecked('right');
        } else {
          if (localDir.x > 0.55) setChecked('left');
          else if (localDir.x < -0.55) setChecked('right');
        }

        const halfDepth = roadDepth * 0.5;
        const goalThresholdZ = (currentSide === 'near') ? -(halfDepth - 0.25) : (halfDepth - 0.25);

        if (currentSide === 'near' && localPlayerPos.z >= halfDepth) {
          isCrossing = false;
          isOffCrosswalkWarned = false;
        } else if (currentSide === 'far' && localPlayerPos.z <= -halfDepth) {
          isCrossing = false;
          isOffCrosswalkWarned = false;
        }

        // 1. 到達判定
        let reached = false;
        if (isCrossing && !isCooldown) {
          if (currentSide === 'near' && localPlayerPos.z <= goalThresholdZ) {
            reached = true;
          } else if (currentSide === 'far' && localPlayerPos.z >= goalThresholdZ) {
            reached = true;
          }
        }

        if (reached) {
          isCrossing = false;

          if (currentMode === 'no-signal' && (!checkedLeft || !checkedRight)) {
            triggerImmediateViolation();
          } else if (wasHonked) {
            triggerImmediateViolation();
          } else {
            triggerSuccess();
          }

          currentSide = (currentSide === 'near') ? 'far' : 'near';
          resetCheckState();
          return;
        }

        // 2. 車道進入判定
        if (!isCrossing && !isCooldown) {
          let steppedIn = false;
          if (currentSide === 'near' && localPlayerPos.z < halfDepth && localPlayerPos.z > -halfDepth) {
            steppedIn = true;
          } else if (currentSide === 'far' && localPlayerPos.z > -halfDepth && localPlayerPos.z < halfDepth) {
            steppedIn = true;
          }

          if (steppedIn) {
            isCrossing = true;
            isOffCrosswalkWarned = false;

            if (currentMode === 'signal' && !isGreenLight) {
              triggerImmediateViolation();
              return;
            }
          }
        }

        // 3. 横ずれ判定
        if (isCrossing && !isCooldown) {
          const isOffPath = Math.abs(localPlayerPos.x) > crosswalkHalfWidth;
          if (isOffPath) {
            if (!isOffCrosswalkWarned) {
              isOffCrosswalkWarned = true;
              triggerImmediateViolation();
              return;
            }
          } else {
            isOffCrosswalkWarned = false;
          }
        }

        // 4. 車両挙動・接近判定
        updateCars(localPlayerPos);
      }
    }

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
</body>
