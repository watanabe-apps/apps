<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>横断歩道 ARシミュレーター</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      background-color: #000;
      touch-action: none;
    }
    /* 背面の現実カメラ映像 */
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    /* 前面の3D描画キャンバス（完全透過） */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 16px;
      z-index: 10;
    }
    .interactive {
      pointer-events: auto;
    }
    .settings-panel {
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .setting-group label {
      cursor: pointer;
    }
    select, input[type="range"] {
      border-radius: 4px;
      border: 1px solid #666;
      background: #222;
      color: #fff;
      font-size: 14px;
    }
    select {
      padding: 4px 8px;
    }
    .status-area {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .status-badge {
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #444;
      font-weight: bold;
    }
    .status-badge.checked {
      background: #2e7d32;
    }

    #guide-banner {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffeb3b;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid #ffeb3b;
      text-align: center;
      pointer-events: none;
    }

    .btn-ctrl {
      width: 104px;
      height: 104px;
      font-size: 54px;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
      border-radius: 20px;
      background-color: #1976d2;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-ctrl:active {
      transform: scale(0.94);
      background-color: #1565c0;
    }
    .btn-ctrl:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .btn-action {
      width: 104px;
      height: 104px;
      font-size: 60px;
      background-color: #e65100;
    }
    
    #btn-left {
      position: absolute;
      bottom: 24px;
      left: 24px;
    }
    .right-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #result-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      padding: 24px 36px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
      pointer-events: auto;
      min-width: 240px;
      max-width: 80%;
      z-index: 30;
    }
    #result-title {
      font-size: 28px;
      margin: 0 0 8px 0;
    }
    #result-desc {
      font-size: 16px;
      margin: 0 0 20px 0;
      color: #555;
    }
    #result-modal button {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background-color: #1976d2;
      color: #fff;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- カメラ映像表示要素 -->
<video id="camera-video" autoplay playsinline muted></video>

<div id="canvas-container"></div>

<div id="ui-overlay">
  <div class="settings-panel interactive">
    <div class="setting-group">
      <strong>モード:</strong>
      <label><input type="radio" name="mode" value="signal" checked onchange="changeMode(this.value)"> 信号あり</label>
      <label><input type="radio" name="mode" value="no-signal" onchange="changeMode(this.value)"> 信号なし</label>
    </div>

    <div class="setting-group">
      <strong>サイズ:</strong>
      <input type="range" id="scale-slider" min="0.1" max="1.0" step="0.05" value="0.5" oninput="changeWorldScale(this.value)">
      <span id="scale-label">1/2 (室内向け)</span>
    </div>

    <div class="setting-group">
      <button onclick="repositionRoad()" style="padding:5px 12px; background:#455a64; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">位置リセット</button>
    </div>

    <div class="status-area">
      <span id="badge-left" class="status-badge">左未確認</span>
      <span id="badge-right" class="status-badge">右未確認</span>
    </div>
  </div>

  <div id="guide-banner">床（または机）を映して画面をタップしてください</div>

  <button id="btn-left" class="btn-ctrl interactive" onclick="look('left')" aria-label="左を見る">◀</button>
  
  <div class="right-controls interactive">
    <button id="btn-cross" class="btn-ctrl btn-action" onclick="startCrossing()" aria-label="渡る">🚶</button>
    <button id="btn-right" class="btn-ctrl" onclick="look('right')" aria-label="右を見る">▶</button>
  </div>
</div>

<div id="result-modal">
  <h2 id="result-title"></h2>
  <p id="result-desc"></p>
  <button onclick="resetGame()">やり直す</button>
</div>

<script>
  let scene, camera, renderer;
  let roadGroup;
  let isPlaced = false;

  let player;
  let signalPole, redLampMesh, greenLampMesh;
  let redTexOn, redTexOff, greenTexOn, greenTexOff;
  let cars = [];

  let currentMode = 'signal';
  let worldScale = 0.5; // 初期値：室内で見渡しやすい1/2スケール
  let greenDuration = 20;
  let redDuration = 25;
  const blinkDuration = 4;

  const waveConfig = {
    rushDuration: 7, gapDuration: 6.5, spawnProb: 0.022, maxCars: 5, speedMin: 0.16, speedMax: 0.22
  };

  let waveTimer = 0;
  let isCrossing = false;
  let isFinished = false;
  let checkedLeft = false;
  let checkedRight = false;
  let wasHonked = false;

  let playerLocalZ = 4.0;
  let targetYaw = 0;
  let currentYaw = 0;

  let signalTimer = 0;
  let isGreenLight = true;
  let isBlinking = false;

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playHorn() {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(420, now);
    osc2.frequency.setValueAtTime(470, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
    gain.gain.setValueAtTime(0.18, now + 0.38);
    gain.gain.linearRampToValueAtTime(0, now + 0.48);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.48);
    osc2.stop(now + 0.48);
  }

  init();

  async function init() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.rotation.order = 'YXZ';
    camera.position.set(0, 1.2, 0);
    scene.add(camera);

    roadGroup = new THREE.Group();
    roadGroup.visible = false;
    scene.add(roadGroup);

    // Three.jsキャンバスを完全透過で初期化
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    generateSignalTextures();
    buildEnvironment();
    createPlayer();
    createPedestrianSignal();

    changeWorldScale(worldScale);

    // カメラ映像の取得と再生
    await startCamera();

    // ジャイロの登録
    enableDeviceOrientation();

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('pointerdown', handleScreenTap);

    animate();
  }

  // 背面カメラ起動
  async function startCamera() {
    const video = document.getElementById('camera-video');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      video.srcObject = stream;
    } catch (err) {
      console.warn('背面カメラの取得に失敗。代替カメラを試行:', err);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
      } catch (e) {
        alert('カメラの起動に失敗しました。HTTPSで接続されているか、カメラ権限が許可されているか確認してください。');
      }
    }
  }

  function handleScreenTap(e) {
    initAudio();

    // UIボタン等の操作タップ時は床面設置を行わない
    if (e.target.closest('.interactive')) return;

    // 未設置の場合、カメラ正面の床面（前方約3m、高さ0）に道路を設置
    if (!isPlaced) {
      placeRoad();
    }
  }

  function placeRoad() {
    // カメラの向いている水平方向を取得
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();

    // 視線の先（3.5m手前）の地面位置に配置
    const distance = 3.5 * worldScale;
    roadGroup.position.copy(camera.position).add(dir.clone().multiplyScalar(distance));
    roadGroup.position.y = 0; // 床面レベル

    // カメラと正対するように回転
    const angle = Math.atan2(camera.position.x - roadGroup.position.x, camera.position.z - roadGroup.position.z);
    roadGroup.rotation.y = angle;

    roadGroup.visible = true;
    isPlaced = true;
    document.getElementById('guide-banner').style.display = 'none';

    resetGame();
  }

  function repositionRoad() {
    isPlaced = false;
    roadGroup.visible = false;
    document.getElementById('guide-banner').style.display = 'block';
  }

  function changeWorldScale(val) {
    worldScale = parseFloat(val);
    roadGroup.scale.set(worldScale, worldScale, worldScale);
    
    const label = document.getElementById('scale-label');
    if (worldScale >= 0.95) label.innerText = '1/1 (実寸大)';
    else if (worldScale >= 0.45 && worldScale <= 0.55) label.innerText = '1/2 (室内向け)';
    else if (worldScale <= 0.15) label.innerText = '1/10 (卓上サイズ)';
    else label.innerText = `${worldScale.toFixed(2)}倍`;

    if (isPlaced) {
      placeRoad();
    }
  }

  // ジャイロによる端末の向き追従
  function enableDeviceOrientation() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      window.addEventListener('click', async () => {
        try {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {}
      }, { once: true });
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }
  }

  function handleOrientation(e) {
    if (e.alpha === null) return;
    const orientation = window.orientation || (screen.orientation ? screen.orientation.angle : 0) || 0;

    // 端末の姿勢をカメラ回転へ反映
    const alpha = THREE.MathUtils.degToRad(e.alpha);
    const beta = THREE.MathUtils.degToRad(e.beta);
    const gamma = THREE.MathUtils.degToRad(e.gamma);

    // 首振りの相対角度による左右確認
    if (isPlaced) {
      let relativeYaw = -(gamma);
      if (orientation === 90) relativeYaw = -beta;
      else if (orientation === -90) relativeYaw = beta;

      if (relativeYaw > 0.6) setChecked('left');
      else if (relativeYaw < -0.6) setChecked('right');
    }
  }

  function createPedestrianCanvas(type, isOn) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, 128, 128);

    const mainColor = isOn 
      ? (type === 'red' ? '#ff2200' : '#00e676') 
      : (type === 'red' ? '#330800' : '#002611');

    ctx.fillStyle = mainColor;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';

    if (type === 'red') {
      ctx.beginPath();
      ctx.arc(64, 30, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(64, 46);
      ctx.lineTo(64, 82);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(48, 54);
      ctx.lineTo(80, 54);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(56, 114);
      ctx.lineTo(60, 82);
      ctx.lineTo(68, 82);
      ctx.lineTo(72, 114);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(70, 28, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(68, 44);
      ctx.lineTo(60, 78);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(44, 62);
      ctx.lineTo(66, 50);
      ctx.lineTo(84, 62);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(40, 112);
      ctx.lineTo(54, 86);
      ctx.lineTo(60, 78);
      ctx.lineTo(74, 94);
      ctx.lineTo(88, 112);
      ctx.stroke();
    }

    return new THREE.CanvasTexture(canvas);
  }

  function generateSignalTextures() {
    redTexOn = createPedestrianCanvas('red', true);
    redTexOff = createPedestrianCanvas('red', false);
    greenTexOn = createPedestrianCanvas('green', true);
    greenTexOff = createPedestrianCanvas('green', false);
  }

  function buildEnvironment() {
    // 実空間に重ねるため、歩道アスファルトは半透明にして床面が見える仕様
    const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x90a4ae, transparent: true, opacity: 0.85 });

    const sidewalkNear = new THREE.Mesh(new THREE.PlaneGeometry(160, 4), sidewalkMat);
    sidewalkNear.rotation.x = -Math.PI / 2;
    sidewalkNear.position.set(0, 0, 5.5);
    roadGroup.add(sidewalkNear);

    const sidewalkFar = new THREE.Mesh(new THREE.PlaneGeometry(160, 4), sidewalkMat);
    sidewalkFar.rotation.x = -Math.PI / 2;
    sidewalkFar.position.set(0, 0, -5.5);
    roadGroup.add(sidewalkFar);

    // 車道
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x263238, transparent: true, opacity: 0.92 });
    const road = new THREE.Mesh(new THREE.PlaneGeometry(160, 7.0), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.01, 0);
    roadGroup.add(road);

    // 中央線
    for (let x = -75; x < 80; x += 8) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.02, 0);
      roadGroup.add(line);
    }

    // 横断歩道白線
    for (let z = -2.8; z <= 2.8; z += 0.9) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.45), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.025, z);
      roadGroup.add(stripe);
    }

    // 停止線
    const stopMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    const stopLine1 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLine1.rotation.x = -Math.PI / 2;
    stopLine1.position.set(3.2, 0.025, 1.75);
    roadGroup.add(stopLine1);

    const stopLine2 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLine2.rotation.x = -Math.PI / 2;
    stopLine2.position.set(-3.2, 0.025, -1.75);
    roadGroup.add(stopLine2);
  }

  function createPlayer() {
    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.25, 1.2),
      new THREE.MeshLambertMaterial({ color: 0x1565c0 })
    );
    body.position.y = 0.6;
    group.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.22),
      new THREE.MeshLambertMaterial({ color: 0xffcc80 })
    );
    head.position.y = 1.35;
    group.add(head);

    group.position.set(0, 0, playerLocalZ);
    roadGroup.add(group);
    player = group;
  }

  function createPedestrianSignal() {
    signalPole = new THREE.Group();

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 3.2),
      new THREE.MeshLambertMaterial({ color: 0x546e7a })
    );
    pole.position.y = 1.6;
    signalPole.add(pole);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 1.1, 0.26),
      new THREE.MeshLambertMaterial({ color: 0x212121 })
    );
    box.position.set(0, 2.3, 0);
    signalPole.add(box);

    const visorMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
    const topVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    topVisor.position.set(0, 2.7, 0.16);
    topVisor.rotation.x = 0.2;
    signalPole.add(topVisor);

    const midVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    midVisor.position.set(0, 2.23, 0.16);
    midVisor.rotation.x = 0.2;
    signalPole.add(midVisor);

    const lampGeo = new THREE.PlaneGeometry(0.42, 0.42);
    redLampMesh = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: redTexOff, transparent: true }));
    redLampMesh.position.set(0, 2.52, 0.135);
    signalPole.add(redLampMesh);

    greenLampMesh = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: greenTexOn, transparent: true }));
    greenLampMesh.position.set(0, 2.05, 0.135);
    signalPole.add(greenLampMesh);

    signalPole.position.set(2.4, 0, -4.2);
    roadGroup.add(signalPole);
  }

  function changeMode(mode) {
    currentMode = mode;
    signalPole.visible = (mode === 'signal');
    resetGame();
  }

  function setChecked(side) {
    if (side === 'left' && !checkedLeft) {
      checkedLeft = true;
      document.getElementById('badge-left').className = 'status-badge checked';
      document.getElementById('badge-left').innerText = '左確認済';
    } else if (side === 'right' && !checkedRight) {
      checkedRight = true;
      document.getElementById('badge-right').className = 'status-badge checked';
      document.getElementById('badge-right').innerText = '右確認済';
    }
  }

  function look(direction) {
    if (isCrossing || isFinished) return;
    initAudio();

    if (direction === 'left') {
      targetYaw = Math.PI / 2.2;
      setChecked('left');
    } else if (direction === 'right') {
      targetYaw = -Math.PI / 2.2;
      setChecked('right');
    }
  }

  function startCrossing() {
    if (isFinished || isCrossing) return;
    initAudio();
    targetYaw = 0;
    isCrossing = true;

    document.getElementById('btn-left').disabled = true;
    document.getElementById('btn-right').disabled = true;
    document.getElementById('btn-cross').disabled = true;
  }

  function finishCrossing() {
    if (currentMode === 'signal' && !isGreenLight) {
      endGame(false, 'あか信号です');
    } else if (!checkedLeft || !checkedRight) {
      endGame(false, 'かくにんしていません');
    } else if (wasHonked) {
      endGame(false, 'クラクションをならされました');
    } else {
      endGame(true, '');
    }
  }

  function createCarMesh(direction) {
    const carGroup = new THREE.Group();
    const colors = [0xd32f2f, 0x1976d2, 0xfbc02d, 0x388e3c, 0xf5f5f5, 0x333333];
    const color = colors[Math.floor(Math.random() * colors.length)];

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(4.2, 0.9, 1.7),
      new THREE.MeshLambertMaterial({ color })
    );
    body.position.y = 0.55;
    carGroup.add(body);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(2.3, 0.65, 1.5),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    roof.position.set(-0.25 * direction, 1.25, 0);
    carGroup.add(roof);
    return carGroup;
  }

  function spawnCarAt(xPos, isNearLane) {
    const direction = isNearLane ? -1 : 1;
    const zPos = isNearLane ? 1.75 : -1.75;
    const baseSpeed = waveConfig.speedMin + Math.random() * (waveConfig.speedMax - waveConfig.speedMin);

    const carGroup = createCarMesh(direction);
    carGroup.position.set(xPos, 0, zPos);
    roadGroup.add(carGroup);

    cars.push({
      mesh: carGroup,
      isNearLane: isNearLane,
      direction: direction,
      baseSpeed: baseSpeed,
      currentSpeed: baseSpeed,
      hasHonked: false
    });
  }

  function spawnCar() {
    const isNearLane = Math.random() > 0.5;
    const spawnX = isNearLane ? 75 : -75;

    const tooClose = cars.some(c => c.isNearLane === isNearLane && Math.abs(c.mesh.position.x - spawnX) < 22);
    if (tooClose) return;

    spawnCarAt(spawnX, isNearLane);
  }

  function spawnInitialCars() {
    spawnCarAt(18, true);
    spawnCarAt(42, true);
    spawnCarAt(-24, false);
    spawnCarAt(-50, false);
  }

  function updateCars() {
    waveTimer += 0.016;
    const waveCycle = waveConfig.rushDuration + waveConfig.gapDuration;
    const isRushPeriod = (waveTimer % waveCycle) < waveConfig.rushDuration;

    if (isRushPeriod && Math.random() < waveConfig.spawnProb && cars.length < waveConfig.maxCars) {
      spawnCar();
    }

    const carMustStopForSignal = (currentMode === 'signal' && isGreenLight);

    for (let i = cars.length - 1; i >= 0; i--) {
      const car = cars[i];
      let targetSpeed = car.baseSpeed;

      if (carMustStopForSignal) {
        if (car.isNearLane) {
          const stopTargetX = 5.4;
          if (car.mesh.position.x >= stopTargetX) {
            const dist = car.mesh.position.x - stopTargetX;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) {
                targetSpeed = 0;
                car.currentSpeed = 0;
                car.mesh.position.x = stopTargetX;
              }
            }
          }
        } else {
          const stopTargetX = -5.4;
          if (car.mesh.position.x <= stopTargetX) {
            const dist = stopTargetX - car.mesh.position.x;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) {
                targetSpeed = 0;
                car.currentSpeed = 0;
                car.mesh.position.x = stopTargetX;
              }
            }
          }
        }
      }

      for (let j = 0; j < cars.length; j++) {
        if (i === j) continue;
        const other = cars[j];
        if (car.isNearLane === other.isNearLane) {
          if (car.direction === -1) {
            const gap = car.mesh.position.x - other.mesh.position.x;
            if (gap > 0 && gap < 11.0) {
              const factor = Math.max(0, (gap - 4.8) / 6.2);
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= 5.0) {
                targetSpeed = 0;
                car.currentSpeed = 0;
              }
            }
          } else {
            const gap = other.mesh.position.x - car.mesh.position.x;
            if (gap > 0 && gap < 11.0) {
              const factor = Math.max(0, (gap - 4.8) / 6.2);
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= 5.0) {
                targetSpeed = 0;
                car.currentSpeed = 0;
              }
            }
          }
        }
      }

      car.currentSpeed += (targetSpeed - car.currentSpeed) * 0.12;
      car.mesh.position.x += car.currentSpeed * car.direction;

      if (Math.abs(car.mesh.position.x) > 85) {
        roadGroup.remove(car.mesh);
        cars.splice(i, 1);
        continue;
      }

      if (isCrossing && !isFinished) {
        const dx = Math.abs(car.mesh.position.x - player.position.x);
        const dz = Math.abs(car.mesh.position.z - player.position.z);

        if (dx < 7.5 && dz < 2.4 && car.currentSpeed > 0.04) {
          if (!car.hasHonked) {
            playHorn();
            car.hasHonked = true;
            wasHonked = true;
          }
        }

        if (dx < 2.2 && dz < 1.1) {
          endGame(false, '車にぶつかりました');
          break;
        }
      }
    }
  }

  function updateSignal() {
    if (currentMode !== 'signal') return;

    signalTimer += 0.016;
    const totalCycle = greenDuration + redDuration;
    if (signalTimer >= totalCycle) signalTimer = 0;

    isGreenLight = (signalTimer < greenDuration);
    isBlinking = isGreenLight && (signalTimer > (greenDuration - blinkDuration));

    if (isGreenLight) {
      redLampMesh.material.map = redTexOff;
      if (isBlinking) {
        const blinkState = Math.floor(signalTimer * 4) % 2 === 0;
        greenLampMesh.material.map = blinkState ? greenTexOn : greenTexOff;
      } else {
        greenLampMesh.material.map = greenTexOn;
      }
    } else {
      redLampMesh.material.map = redTexOn;
      greenLampMesh.material.map = greenTexOff;
    }
  }

  function endGame(success, message) {
    isFinished = true;
    const modal = document.getElementById('result-modal');
    const title = document.getElementById('result-title');
    const desc = document.getElementById('result-desc');

    title.innerText = success ? 'よくできました！' : 'やりなおし';
    title.style.color = success ? '#2e7d32' : '#c62828';
    desc.innerText = message;
    modal.style.display = 'block';
  }

  function resetGame() {
    isCrossing = false;
    isFinished = false;
    checkedLeft = false;
    checkedRight = false;
    wasHonked = false;

    playerLocalZ = 4.0;
    targetYaw = 0;
    currentYaw = 0;
    signalTimer = 0;
    waveTimer = 0;

    player.position.set(0, 0, playerLocalZ);

    cars.forEach(c => roadGroup.remove(c.mesh));
    cars = [];
    spawnInitialCars();

    document.getElementById('badge-left').className = 'status-badge';
    document.getElementById('badge-left').innerText = '左未確認';
    document.getElementById('badge-right').className = 'status-badge';
    document.getElementById('badge-right').innerText = '右未確認';

    document.getElementById('btn-left').disabled = false;
    document.getElementById('btn-right').disabled = false;
    document.getElementById('btn-cross').disabled = false;

    document.getElementById('result-modal').style.display = 'none';
  }

  function animate() {
    requestAnimationFrame(animate);

    if (isPlaced) {
      updateSignal();
      updateCars();

      if (isCrossing && !isFinished) {
        playerLocalZ -= 0.035;
        player.position.z = playerLocalZ;

        if (playerLocalZ <= -4.2) {
          finishCrossing();
        }
      }
    }

    // ボタン首振り操作の補間（ジャイロ未動作時用）
    currentYaw += (targetYaw - currentYaw) * 0.08;
    camera.rotation.y = currentYaw;

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
