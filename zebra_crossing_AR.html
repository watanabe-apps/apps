<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>横断歩道 ARシミュレーター</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      background-color: #000;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-sizing: border-box;
      padding: 14px;
      z-index: 10;
    }
    .interactive {
      pointer-events: auto;
    }

    #btn-toggle-ui {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 50;
    }

    #main-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 120px;
      background: rgba(0, 0, 0, 0.88);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      transition: opacity 0.2s;
    }
    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .setting-group label {
      cursor: pointer;
    }
    select, input[type="range"] {
      border-radius: 4px;
      border: 1px solid #666;
      background: #222;
      color: #fff;
    }
    select {
      padding: 3px 6px;
    }
    input[type="range"] {
      height: 6px;
    }

    #btn-start-sim {
      background: #00e676;
      color: #000;
      border: none;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 左右確認インジケーター（UI非表示時でも画面上部に控えめに常時表示） */
    #status-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
    }
    .status-badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.7);
      color: #aaa;
      border: 1px solid #555;
      font-weight: bold;
      transition: all 0.2s;
    }
    .status-badge.checked {
      background: rgba(46, 125, 50, 0.9);
      color: #fff;
      border-color: #00e676;
    }

    /* 渡りきり／警告トースト通知（画面を止めず一時表示） */
    #toast-msg {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      display: none;
      z-index: 60;
      pointer-events: none;
      text-align: center;
    }

    #btn-ar-start {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #00e676;
      color: #000;
      border: none;
      font-weight: bold;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,230,118,0.4);
      display: none;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<button id="btn-ar-start" class="interactive">ARを開始する</button>

<div id="ui-overlay">
  <button id="btn-toggle-ui" class="interactive" onclick="toggleUIVisibility()">UIを隠す</button>

  <div id="status-bar">
    <span id="badge-left" class="status-badge">左：未確認</span>
    <span id="badge-right" class="status-badge">右：未確認</span>
  </div>

  <div id="main-panel" class="interactive">
    <button id="btn-start-sim" onclick="startSimulation()">▶ スタート</button>

    <div class="setting-group">
      <strong>モード:</strong>
      <label><input type="radio" name="mode" value="signal" checked onchange="changeMode(this.value)"> 信号あり</label>
      <label><input type="radio" name="mode" value="no-signal" onchange="changeMode(this.value)"> 信号なし</label>
    </div>

    <div class="setting-group">
      <strong>難易度:</strong>
      <select id="diff-select" onchange="changeDifficulty(this.value)">
        <option value="easy">かんたん</option>
        <option value="normal" selected>ふつう</option>
        <option value="hard">むずかしい</option>
      </select>
    </div>

    <div class="setting-group">
      <strong>サイズ:</strong>
      <input type="range" id="scale-slider" min="0.2" max="1.0" step="0.1" value="1.0" oninput="changeScale(this.value)">
      <span id="scale-label">1/1</span>
    </div>

    <div class="setting-group">
      <strong>背景の暗さ:</strong>
      <input type="range" id="dim-slider" min="0" max="100" step="5" value="0" oninput="changeBackgroundDim(this.value)">
      <span id="dim-label">0%</span>
    </div>

    <div class="setting-group">
      <button onclick="repositionRoad()" style="padding:4px 10px; background:#455a64; color:#fff; border:none; border-radius:4px; cursor:pointer;">位置再設定</button>
    </div>
  </div>

  <div id="toast-msg"></div>
</div>

<script>
  let scene, camera, renderer;
  let roadAnchor, reticle, dimDome;
  let hitTestSource = null;
  let hitTestSourceRequested = false;
  let isPlaced = false;
  let isRunning = false;
  let isUIHidden = false;

  // 往復横断の状態管理 ('near': Z>0の手前歩道から奥へ, 'far': Z<0の奥歩道から手前へ)
  let currentSide = 'near';
  let isCrossing = false;
  let isCooldown = false;

  // 信号機（手前用と対岸用の2本）
  let poleNear, poleFar;
  let redLampNear, greenLampNear, redLampFar, greenLampFar;
  let redTexOn, redTexOff, greenTexOn, greenTexOff;

  let cars = [];
  let currentMode = 'signal';
  let difficulty = 'normal';
  let currentScale = 1.0;

  // 難易度別パラメータ
  const diffConfigs = {
    easy:   { rushDuration: 5, gapDuration: 8.0, spawnProb: 0.015, maxCars: 3, baseSpeedMin: 0.14, baseSpeedMax: 0.18, greenDur: 22, redDur: 10 },
    normal: { rushDuration: 7, gapDuration: 6.5, spawnProb: 0.025, maxCars: 5, baseSpeedMin: 0.18, baseSpeedMax: 0.24, greenDur: 18, redDur: 12 },
    hard:   { rushDuration: 8, gapDuration: 5.0, spawnProb: 0.035, maxCars: 6, baseSpeedMin: 0.22, baseSpeedMax: 0.28, greenDur: 14, redDur: 14 }
  };

  const blinkDuration = 4;
  let waveTimer = 0;
  let checkedLeft = false;
  let checkedRight = false;
  let wasHonked = false;

  // 初期状態は「赤信号」から開始
  let signalTimer = 0;
  let isGreenLight = false;
  let isBlinking = false;

  let toastTimer = null;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playHorn() {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(420, now);
    osc2.frequency.setValueAtTime(470, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.2, now + 0.04);
    gain.gain.setValueAtTime(0.2, now + 0.38);
    gain.gain.linearRampToValueAtTime(0, now + 0.48);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.48);
    osc2.stop(now + 0.48);
  }

  init();

  function init() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
    scene.add(camera);

    const dimGeo = new THREE.SphereGeometry(200, 32, 16);
    const dimMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.0,
      side: THREE.BackSide,
      depthWrite: false
    });
    dimDome = new THREE.Mesh(dimGeo, dimMat);
    scene.add(dimDome);

    roadAnchor = new THREE.Group();
    roadAnchor.visible = false;
    scene.add(roadAnchor);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    const reticleGeo = new THREE.RingGeometry(0.18, 0.22, 32).rotateX(-Math.PI / 2);
    const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00e676 });
    reticle = new THREE.Mesh(reticleGeo, reticleMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    generateSignalTextures();
    buildEnvironment();
    createPedestrianSignals();

    checkWebXRSupport();

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('pointerdown', initAudio, { once: true });

    renderer.setAnimationLoop(renderLoop);
  }

  function checkWebXRSupport() {
    const btn = document.getElementById('btn-ar-start');
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (supported) {
          btn.style.display = 'block';
          btn.onclick = startARSession;
        }
      }).catch(() => {});
    }
  }

  function startARSession() {
    initAudio();
    navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['local-floor', 'dom-overlay'],
      domOverlay: { root: document.getElementById('ui-overlay') }
    }).then((session) => {
      renderer.xr.setSession(session);
      document.getElementById('btn-ar-start').style.display = 'none';

      isPlaced = false;
      isRunning = false;
      roadAnchor.visible = false;

      session.addEventListener('select', () => {
        if (isPlaced) return;
        if (reticle.visible) {
          anchorRoadToUserFeet();
        }
      });

      session.addEventListener('end', () => {
        document.getElementById('btn-ar-start').style.display = 'block';
        isPlaced = false;
        isRunning = false;
        roadAnchor.visible = false;
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
    }).catch(e => {
      alert('ARセッション開始エラー: ' + e.message);
    });
  }

  function anchorRoadToUserFeet() {
    const reticlePos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
    const floorY = reticlePos.y;

    const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const angle = Math.atan2(camDir.x, camDir.z) + Math.PI;
    roadAnchor.rotation.set(0, angle, 0);

    const offsetDist = 4.2 * currentScale;
    roadAnchor.position.set(
      camPos.x + camDir.x * offsetDist,
      floorY,
      camPos.z + camDir.z * offsetDist
    );

    roadAnchor.visible = true;
    isPlaced = true;
    reticle.visible = false;

    currentSide = 'near';
    resetCheckState();
  }

  function startSimulation() {
    initAudio();
    isRunning = true;
    // スタート時に自動で設定パネルを非表示
    hideUI();
    resetSignalCycle();
    showToast('信号が青になるのを待ってください', '#ffeb3b', 2500);
  }

  function repositionRoad() {
    if (renderer.xr.isPresenting) {
      isPlaced = false;
      isRunning = false;
      roadAnchor.visible = false;
      reticle.visible = false;
      showUI();
    }
  }

  function changeDifficulty(val) {
    difficulty = val;
    resetSignalCycle();
  }

  function changeMode(mode) {
    currentMode = mode;
    poleNear.visible = (mode === 'signal');
    poleFar.visible = (mode === 'signal');
    resetCheckState();
  }

  function changeScale(val) {
    currentScale = parseFloat(val);
    roadAnchor.scale.set(currentScale, currentScale, currentScale);

    const label = document.getElementById('scale-label');
    if (currentScale >= 0.95) label.innerText = '1/1';
    else if (currentScale >= 0.45 && currentScale <= 0.55) label.innerText = '1/2';
    else label.innerText = `${currentScale.toFixed(1)}倍`;
  }

  function changeBackgroundDim(val) {
    dimDome.material.opacity = parseFloat(val) / 100.0;
    document.getElementById('dim-label').innerText = `${val}%`;
  }

  function toggleUIVisibility() {
    if (isUIHidden) showUI();
    else hideUI();
  }

  function hideUI() {
    isUIHidden = true;
    document.getElementById('main-panel').style.display = 'none';
    const btn = document.getElementById('btn-toggle-ui');
    btn.innerText = 'UI表示';
    btn.style.background = 'rgba(0, 0, 0, 0.4)';
  }

  function showUI() {
    isUIHidden = false;
    document.getElementById('main-panel').style.display = 'flex';
    const btn = document.getElementById('btn-toggle-ui');
    btn.innerText = 'UIを隠す';
    btn.style.background = 'rgba(0, 0, 0, 0.75)';
  }

  function showToast(text, color, duration = 3000) {
    const toast = document.getElementById('toast-msg');
    toast.innerText = text;
    toast.style.color = color;
    toast.style.borderColor = color;
    toast.style.display = 'block';

    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.display = 'none';
    }, duration);
  }

  function resetCheckState() {
    checkedLeft = false;
    checkedRight = false;
    isCrossing = false;
    wasHonked = false;

    const bL = document.getElementById('badge-left');
    const bR = document.getElementById('badge-right');
    bL.className = 'status-badge';
    bL.innerText = '左：未確認';
    bR.className = 'status-badge';
    bR.innerText = '右：未確認';
  }

  function resetSignalCycle() {
    signalTimer = 0;
    isGreenLight = false;
    isBlinking = false;
    updateSignalLamps();
  }

  function createPedestrianCanvas(type, isOn) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, 128, 128);

    const mainColor = isOn 
      ? (type === 'red' ? '#ff2200' : '#00e676') 
      : (type === 'red' ? '#330800' : '#002611');

    ctx.fillStyle = mainColor;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';

    if (type === 'red') {
      ctx.beginPath();
      ctx.arc(64, 30, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(64, 46);
      ctx.lineTo(64, 82);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(48, 54);
      ctx.lineTo(80, 54);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(56, 114);
      ctx.lineTo(60, 82);
      ctx.lineTo(68, 82);
      ctx.lineTo(72, 114);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(70, 28, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(68, 44);
      ctx.lineTo(60, 78);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(44, 62);
      ctx.lineTo(66, 50);
      ctx.lineTo(84, 62);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(40, 112);
      ctx.lineTo(54, 86);
      ctx.lineTo(60, 78);
      ctx.lineTo(74, 94);
      ctx.lineTo(88, 112);
      ctx.stroke();
    }

    return new THREE.CanvasTexture(canvas);
  }

  function generateSignalTextures() {
    redTexOn = createPedestrianCanvas('red', true);
    redTexOff = createPedestrianCanvas('red', false);
    greenTexOn = createPedestrianCanvas('green', true);
    greenTexOff = createPedestrianCanvas('green', false);
  }

  function buildEnvironment() {
    const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x78909c, transparent: true, opacity: 0.85 });

    const sidewalkNear = new THREE.Mesh(new THREE.PlaneGeometry(160, 2.5), sidewalkMat);
    sidewalkNear.rotation.x = -Math.PI / 2;
    sidewalkNear.position.set(0, 0.005, 4.75);
    roadAnchor.add(sidewalkNear);

    const sidewalkFar = new THREE.Mesh(new THREE.PlaneGeometry(160, 2.5), sidewalkMat);
    sidewalkFar.rotation.x = -Math.PI / 2;
    sidewalkFar.position.set(0, 0.005, -4.75);
    roadAnchor.add(sidewalkFar);

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x263238, transparent: true, opacity: 0.92 });
    const road = new THREE.Mesh(new THREE.PlaneGeometry(160, 7.0), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.01, 0);
    roadAnchor.add(road);

    for (let x = -75; x < 80; x += 8) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.015, 0);
      roadAnchor.add(line);
    }

    for (let z = -2.8; z <= 2.8; z += 0.9) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.45), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.02, z);
      roadAnchor.add(stripe);
    }

    const stopMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const stopLine1 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLine1.rotation.x = -Math.PI / 2;
    stopLine1.position.set(3.2, 0.02, 1.75);
    roadAnchor.add(stopLine1);

    const stopLine2 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLine2.rotation.x = -Math.PI / 2;
    stopLine2.position.set(-3.2, 0.02, -1.75);
    roadAnchor.add(stopLine2);
  }

  function createSignalUnit(facingAngle) {
    const group = new THREE.Group();

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 3.2),
      new THREE.MeshLambertMaterial({ color: 0x546e7a })
    );
    pole.position.y = 1.6;
    group.add(pole);

    const head = new THREE.Group();
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 1.1, 0.26),
      new THREE.MeshLambertMaterial({ color: 0x212121 })
    );
    box.position.set(0, 2.3, 0);
    head.add(box);

    const visorMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
    const topVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    topVisor.position.set(0, 2.7, 0.16);
    topVisor.rotation.x = 0.2;
    head.add(topVisor);

    const midVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    midVisor.position.set(0, 2.23, 0.16);
    midVisor.rotation.x = 0.2;
    head.add(midVisor);

    const lampGeo = new THREE.PlaneGeometry(0.42, 0.42);
    const redLamp = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: redTexOn, transparent: true }));
    redLamp.position.set(0, 2.52, 0.135);
    head.add(redLamp);

    const greenLamp = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: greenTexOff, transparent: true }));
    greenLamp.position.set(0, 2.05, 0.135);
    head.add(greenLamp);

    head.rotation.y = facingAngle;
    group.add(head);

    return { group, redLamp, greenLamp };
  }

  // 手前歩道・奥歩道の両方に信号機を設置
  function createPedestrianSignals() {
    // 奥歩道側の信号機（手前側から見る：facingAngle = 0）
    const farUnit = createSignalUnit(0);
    farUnit.group.position.set(2.5, 0, -4.2);
    roadAnchor.add(farUnit.group);
    poleFar = farUnit.group;
    redLampFar = farUnit.redLamp;
    greenLampFar = farUnit.greenLamp;

    // 手前歩道側の信号機（奥側から振り返って見る：facingAngle = Math.PI）
    const nearUnit = createSignalUnit(Math.PI);
    nearUnit.group.position.set(-2.5, 0, 4.2);
    roadAnchor.add(nearUnit.group);
    poleNear = nearUnit.group;
    redLampNear = nearUnit.redLamp;
    greenLampNear = nearUnit.greenLamp;
  }

  function setChecked(side) {
    if (side === 'left' && !checkedLeft) {
      checkedLeft = true;
      const b = document.getElementById('badge-left');
      b.className = 'status-badge checked';
      b.innerText = '左：確認済 ✓';
    } else if (side === 'right' && !checkedRight) {
      checkedRight = true;
      const b = document.getElementById('badge-right');
      b.className = 'status-badge checked';
      b.innerText = '右：確認済 ✓';
    }
  }

  function createCarMesh(direction) {
    const carGroup = new THREE.Group();
    const colors = [0xd32f2f, 0x1976d2, 0xfbc02d, 0x388e3c, 0xf5f5f5, 0x333333];
    const color = colors[Math.floor(Math.random() * colors.length)];

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(4.2, 0.9, 1.7),
      new THREE.MeshLambertMaterial({ color })
    );
    body.position.y = 0.55;
    carGroup.add(body);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(2.3, 0.65, 1.5),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    roof.position.set(-0.25 * direction, 1.25, 0);
    carGroup.add(roof);
    return carGroup;
  }

  function spawnCarAt(xPos, isNearLane) {
    const direction = isNearLane ? -1 : 1;
    const zPos = isNearLane ? 1.75 : -1.75;
    const conf = diffConfigs[difficulty];

    // スケール縮小時の速度補正:
    // スケールSが小さくなっても見た目の速さを保つため、1 / Math.sqrt(currentScale) を乗算してブースト
    const speedBoost = 1.0 / Math.sqrt(Math.max(0.2, currentScale));
    const rawSpeed = conf.baseSpeedMin + Math.random() * (conf.baseSpeedMax - conf.baseSpeedMin);
    const baseSpeed = rawSpeed * speedBoost;

    const carGroup = createCarMesh(direction);
    carGroup.position.set(xPos, 0, zPos);
    roadAnchor.add(carGroup);

    cars.push({
      mesh: carGroup,
      isNearLane: isNearLane,
      direction: direction,
      baseSpeed: baseSpeed,
      currentSpeed: baseSpeed,
      hasHonked: false
    });
  }

  function spawnCar() {
    const isNearLane = Math.random() > 0.5;
    const spawnX = isNearLane ? 75 : -75;

    const tooClose = cars.some(c => c.isNearLane === isNearLane && Math.abs(c.mesh.position.x - spawnX) < 22);
    if (tooClose) return;

    spawnCarAt(spawnX, isNearLane);
  }

  function spawnInitialCars() {
    spawnCarAt(18, true);
    spawnCarAt(42, true);
    spawnCarAt(-24, false);
    spawnCarAt(-50, false);
  }

  function updateCars(localPlayerPos) {
    const conf = diffConfigs[difficulty];
    waveTimer += 0.016;
    const waveCycle = conf.rushDuration + conf.gapDuration;
    const isRushPeriod = (waveTimer % waveCycle) < conf.rushDuration;

    if (isRushPeriod && Math.random() < conf.spawnProb && cars.length < conf.maxCars) {
      spawnCar();
    }

    const carMustStopForSignal = (currentMode === 'signal' && isGreenLight);

    for (let i = cars.length - 1; i >= 0; i--) {
      const car = cars[i];
      let targetSpeed = car.baseSpeed;

      if (carMustStopForSignal) {
        if (car.isNearLane) {
          const stopTargetX = 5.4;
          if (car.mesh.position.x >= stopTargetX) {
            const dist = car.mesh.position.x - stopTargetX;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) {
                targetSpeed = 0;
                car.currentSpeed = 0;
                car.mesh.position.x = stopTargetX;
              }
            }
          }
        } else {
          const stopTargetX = -5.4;
          if (car.mesh.position.x <= stopTargetX) {
            const dist = stopTargetX - car.mesh.position.x;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) {
                targetSpeed = 0;
                car.currentSpeed = 0;
                car.mesh.position.x = stopTargetX;
              }
            }
          }
        }
      }

      for (let j = 0; j < cars.length; j++) {
        if (i === j) continue;
        const other = cars[j];
        if (car.isNearLane === other.isNearLane) {
          if (car.direction === -1) {
            const gap = car.mesh.position.x - other.mesh.position.x;
            if (gap > 0 && gap < 11.0) {
              const factor = Math.max(0, (gap - 4.8) / 6.2);
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= 5.0) {
                targetSpeed = 0;
                car.currentSpeed = 0;
              }
            }
          } else {
            const gap = other.mesh.position.x - car.mesh.position.x;
            if (gap > 0 && gap < 11.0) {
              const factor = Math.max(0, (gap - 4.8) / 6.2);
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= 5.0) {
                targetSpeed = 0;
                car.currentSpeed = 0;
              }
            }
          }
        }
      }

      car.currentSpeed += (targetSpeed - car.currentSpeed) * 0.12;
      car.mesh.position.x += car.currentSpeed * car.direction;

      if (Math.abs(car.mesh.position.x) > 85) {
        roadAnchor.remove(car.mesh);
        cars.splice(i, 1);
        continue;
      }

      if (isCrossing && !isCooldown) {
        const dx = Math.abs(car.mesh.position.x - localPlayerPos.x);
        const dz = Math.abs(car.mesh.position.z - localPlayerPos.z);

        if (dx < 7.0 && dz < 2.2 && car.currentSpeed > 0.04) {
          if (!car.hasHonked) {
            playHorn();
            car.hasHonked = true;
            wasHonked = true;
          }
        }

        if (dx < 2.2 && dz < 1.1) {
          triggerFail('車にぶつかりました');
          break;
        }
      }
    }
  }

  // 初期赤信号サイクル制御
  function updateSignal() {
    if (currentMode !== 'signal') return;

    const conf = diffConfigs[difficulty];
    signalTimer += 0.016;

    // 赤時間 -> 青時間 のサイクル
    const totalCycle = conf.redDur + conf.greenDur;
    if (signalTimer >= totalCycle) signalTimer = 0;

    // 0 〜 redDur: 赤 / redDur 〜 totalCycle: 青
    isGreenLight = (signalTimer >= conf.redDur);
    const greenTimeLeft = totalCycle - signalTimer;
    isBlinking = isGreenLight && (greenTimeLeft <= blinkDuration);

    updateSignalLamps();
  }

  function updateSignalLamps() {
    const redMap = isGreenLight ? redTexOff : redTexOn;
    let greenMap = greenTexOff;

    if (isGreenLight) {
      if (isBlinking) {
        const blinkState = Math.floor(signalTimer * 4) % 2 === 0;
        greenMap = blinkState ? greenTexOn : greenTexOff;
      } else {
        greenMap = greenTexOn;
      }
    }

    redLampNear.material.map = redMap;
    greenLampNear.material.map = greenMap;
    redLampFar.material.map = redMap;
    greenLampFar.material.map = greenMap;
  }

  // 横断成功：反対側への横断サイクルへ自然に移行
  function triggerSuccess() {
    isCooldown = true;
    showToast('よくできました！ 反対側へも渡れます', '#00e676', 3500);

    // 進行方向を反転
    currentSide = (currentSide === 'near') ? 'far' : 'near';

    setTimeout(() => {
      resetCheckState();
      isCooldown = false;
    }, 3000);
  }

  // 横断失敗：アラート表示後、その歩道から再開
  function triggerFail(msg) {
    isCooldown = true;
    showToast(msg, '#ff5252', 3000);

    setTimeout(() => {
      resetCheckState();
      isCooldown = false;
    }, 2500);
  }

  function renderLoop(timestamp, frame) {
    if (renderer.xr.isPresenting) {
      const session = renderer.xr.getSession();
      dimDome.position.copy(camera.position);

      if (!hitTestSourceRequested) {
        session.requestReferenceSpace('viewer').then((referenceSpace) => {
          session.requestHitTestSource({ space: referenceSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        hitTestSourceRequested = true;
      }

      if (hitTestSource && !isPlaced) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }

      if (isPlaced && isRunning) {
        updateSignal();

        const camWorldPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
        const localPlayerPos = roadAnchor.worldToLocal(camWorldPos.clone());

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        const localDir = camDir.clone().transformDirection(new THREE.Matrix4().copy(roadAnchor.matrixWorld).invert());

        // 左右確認の判定（歩道の位置に応じて左右の向きを自動整合）
        if (currentSide === 'near') {
          // 手前（-Z向き）：左は -X、右は +X
          if (localDir.x < -0.55) setChecked('left');
          else if (localDir.x > 0.55) setChecked('right');
        } else {
          // 奥（+Z向き）：左は +X、右は -X
          if (localDir.x > 0.55) setChecked('left');
          else if (localDir.x < -0.55) setChecked('right');
        }

        // 車道への足の踏み入れ判定
        if (!isCrossing && !isCooldown) {
          if (currentSide === 'near' && localPlayerPos.z < 3.5) {
            isCrossing = true;
          } else if (currentSide === 'far' && localPlayerPos.z > -3.5) {
            isCrossing = true;
          }
        }

        updateCars(localPlayerPos);

        // 対岸到達の判定
        if (isCrossing && !isCooldown) {
          let hasReachedOpposite = false;
          if (currentSide === 'near' && localPlayerPos.z <= -3.5) {
            hasReachedOpposite = true;
          } else if (currentSide === 'far' && localPlayerPos.z >= 3.5) {
            hasReachedOpposite = true;
          }

          if (hasReachedOpposite) {
            if (currentMode === 'signal' && !isGreenLight) {
              triggerFail('あか信号でわたってしまいました');
            } else if (!checkedLeft || !checkedRight) {
              triggerFail('左右のかくにんをしていません');
            } else if (wasHonked) {
              triggerFail('クラクションをならされました');
            } else {
              triggerSuccess();
            }
          }
        }
      }
    }

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
