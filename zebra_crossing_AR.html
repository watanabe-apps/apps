<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>横断歩道 ARシミュレーター</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      background-color: #000;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-sizing: border-box;
      padding: 14px;
      z-index: 10;
    }
    .interactive {
      pointer-events: auto;
    }

    #screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.25s ease-out;
    }

    #btn-toggle-ui {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 50;
    }

    #main-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 120px;
      background: rgba(0, 0, 0, 0.88);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      transition: opacity 0.2s;
    }
    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .setting-group label {
      cursor: pointer;
    }
    select, input[type="range"] {
      border-radius: 4px;
      border: 1px solid #666;
      background: #222;
      color: #fff;
    }
    select {
      padding: 3px 6px;
    }
    input[type="range"] {
      height: 6px;
    }

    #btn-start-sim {
      background: #00e676;
      color: #000;
      border: none;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #444;
      font-weight: bold;
      color: #aaa;
    }
    .status-badge.checked {
      background: #2e7d32;
      color: #fff;
    }

    /* 最初から確実に表示されるAR開始ボタン */
    #btn-ar-start {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #00e676;
      color: #000;
      border: none;
      font-weight: bold;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,230,118,0.4);
      z-index: 20;
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="screen-flash"></div>
<div id="canvas-container"></div>

<button id="btn-ar-start" class="interactive" onclick="startARSession()">ARを開始する</button>

<div id="ui-overlay">
  <button id="btn-toggle-ui" class="interactive" onclick="toggleUIVisibility()">UIを隠す</button>

  <div id="main-panel" class="interactive">
    <button id="btn-start-sim" onclick="startSimulation()">▶ スタート</button>

    <div class="setting-group">
      <strong>モード:</strong>
      <label><input type="radio" name="mode" value="signal" checked onchange="changeMode(this.value)"> 信号あり</label>
      <label><input type="radio" name="mode" value="no-signal" onchange="changeMode(this.value)"> 信号なし</label>
    </div>

    <div class="setting-group">
      <strong>難易度:</strong>
      <select id="diff-select" onchange="changeDifficulty(this.value)">
        <option value="easy">かんたん（空白 8.5秒）</option>
        <option value="normal" selected>ふつう（空白 5.5秒）</option>
        <option value="hard">むずかしい（空白 3.5秒）</option>
      </select>
    </div>

    <div class="setting-group">
      <strong>横断の広さ:</strong>
      <input type="range" id="depth-slider" min="2.5" max="7.0" step="0.5" value="7.0" oninput="changeRoadDepth(this.value)">
      <span id="depth-label">7.0m (実寸大)</span>
    </div>

    <div class="setting-group">
      <strong>信号強調:</strong>
      <label><input type="checkbox" id="check-highlight" checked onchange="toggleSignalHighlight(this.checked)"> 発光＆拡大</label>
    </div>

    <div class="setting-group">
      <strong>背景の暗さ:</strong>
      <input type="range" id="dim-slider" min="0" max="100" step="5" value="0" oninput="changeBackgroundDim(this.value)">
      <span id="dim-label">0%</span>
    </div>

    <div class="setting-group">
      <button onclick="repositionRoad()" style="padding:4px 10px; background:#455a64; color:#fff; border:none; border-radius:4px; cursor:pointer;">位置再設定</button>
    </div>

    <div class="setting-group" style="margin-left:auto;">
      <span id="badge-left" class="status-badge">左未確認</span>
      <span id="badge-right" class="status-badge">右未確認</span>
    </div>
  </div>
</div>

<script>
  let scene, camera, renderer;
  let roadAnchor, reticle, dimDome;
  let hitTestSource = null;
  let hitTestSourceRequested = false;
  let isPlaced = false;
  let isRunning = false;
  let isUIHidden = false;

  let currentSide = 'near';
  let isCrossing = false;
  let isCooldown = false;

  let roadMesh, sidewalkNear, sidewalkFar, stopLineNear, stopLineFar;
  let centerLineGroup, crosswalkGroup;

  let poleNear, poleFar;
  let redLampNear, greenLampNear, redLampFar, greenLampFar;
  let haloNear, haloFar;
  let redTexOn, redTexOff, greenTexOn, greenTexOff;

  let isSignalHighlighted = true;
  let cars = [];
  let currentMode = 'signal';
  let difficulty = 'normal';
  let roadDepth = 7.0;
  const crosswalkHalfWidth = 2.0;

  // 難易度設定：車両流の継続時間と安全な空白時間
  const diffConfigs = {
    easy:   { trafficDuration: 6.0, clearDuration: 8.5, spawnProb: 0.020, maxCars: 3, speedMin: 0.16, speedMax: 0.20, greenDur: 20, redDur: 10 },
    normal: { trafficDuration: 8.0, clearDuration: 5.5, spawnProb: 0.030, maxCars: 5, speedMin: 0.20, speedMax: 0.26, greenDur: 16, redDur: 12 },
    hard:   { trafficDuration: 11.0, clearDuration: 3.5, spawnProb: 0.040, maxCars: 6, speedMin: 0.24, speedMax: 0.30, greenDur: 14, redDur: 14 }
  };

  let trafficTimer = 0;
  let isClearPhase = false;
  const blinkDuration = 4;
  let checkedLeft = false;
  let checkedRight = false;
  let wasHonked = false;

  let signalTimer = 0;
  let isGreenLight = false;
  let isBlinking = false;

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playHorn() {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(420, now);
    osc2.frequency.setValueAtTime(470, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.04);
    gain.gain.setValueAtTime(0.22, now + 0.38);
    gain.gain.linearRampToValueAtTime(0, now + 0.48);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.48);
    osc2.stop(now + 0.48);
  }

  function flashScreen(colorHex, duration = 600) {
    const el = document.getElementById('screen-flash');
    if (!el) return;
    el.style.backgroundColor = colorHex;
    el.style.opacity = '0.55';
    setTimeout(() => {
      el.style.opacity = '0';
    }, duration);
  }

  init();

  function init() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
    scene.add(camera);

    const dimGeo = new THREE.SphereGeometry(200, 32, 16);
    const dimMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.0,
      side: THREE.BackSide,
      depthWrite: false
    });
    dimDome = new THREE.Mesh(dimGeo, dimMat);
    scene.add(dimDome);

    roadAnchor = new THREE.Group();
    roadAnchor.visible = false;
    scene.add(roadAnchor);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    const reticleGeo = new THREE.RingGeometry(0.18, 0.22, 32).rotateX(-Math.PI / 2);
    const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00e676 });
    reticle = new THREE.Mesh(reticleGeo, reticleMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    generateSignalTextures();
    buildEnvironment();
    createPedestrianSignals();

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('pointerdown', initAudio, { once: true });

    renderer.setAnimationLoop(renderLoop);
  }

  function startARSession() {
    initAudio();
    if (!navigator.xr) {
      alert('お使いのブラウザはWebXRに対応していません。');
      return;
    }

    navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['local-floor', 'dom-overlay'],
      domOverlay: { root: document.getElementById('ui-overlay') }
    }).then((session) => {
      renderer.xr.setSession(session);
      document.getElementById('btn-ar-start').style.display = 'none';

      isPlaced = false;
      isRunning = false;
      roadAnchor.visible = false;

      // 画面タップで緑の輪の位置に道路を設置
      session.addEventListener('select', () => {
        if (isPlaced) return;
        if (reticle.visible) {
          anchorRoadToUserFeet();
        }
      });

      session.addEventListener('end', () => {
        document.getElementById('btn-ar-start').style.display = 'block';
        isPlaced = false;
        isRunning = false;
        roadAnchor.visible = false;
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
    }).catch(e => {
      alert('ARセッション開始エラー: ' + e.message);
    });
  }

  function anchorRoadToUserFeet() {
    const reticlePos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
    const floorY = reticlePos.y;

    const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const angle = Math.atan2(camDir.x, camDir.z) + Math.PI;
    roadAnchor.rotation.set(0, angle, 0);

    const offsetDist = roadDepth * 0.5 + 0.8;
    roadAnchor.position.set(
      camPos.x + camDir.x * offsetDist,
      floorY,
      camPos.z + camDir.z * offsetDist
    );

    roadAnchor.visible = true;
    isPlaced = true;
    reticle.visible = false;

    currentSide = 'near';
    resetCheckState();
  }

  function startSimulation() {
    initAudio();
    if (!isPlaced) {
      alert('床に緑の輪が出たら画面をタップし、道路を設置してからスタートしてください。');
      return;
    }
    isRunning = true;
    hideUI();
    resetSignalCycle();
  }

  function repositionRoad() {
    if (renderer.xr.isPresenting) {
      isPlaced = false;
      isRunning = false;
      roadAnchor.visible = false;
      reticle.visible = false;
      showUI();
    }
  }

  function changeDifficulty(val) {
    difficulty = val;
    trafficTimer = 0;
    isClearPhase = false;
    resetSignalCycle();
  }

  function changeMode(mode) {
    currentMode = mode;
    poleNear.visible = (mode === 'signal');
    poleFar.visible = (mode === 'signal');
    resetCheckState();
  }

  function changeRoadDepth(val) {
    roadDepth = parseFloat(val);
    const label = document.getElementById('depth-label');
    if (roadDepth >= 6.8) label.innerText = '7.0m (実寸大)';
    else if (roadDepth <= 3.0) label.innerText = `${roadDepth.toFixed(1)}m (省スペース)`;
    else label.innerText = `${roadDepth.toFixed(1)}m`;

    updateRoadGeometry();
  }

  function toggleSignalHighlight(enabled) {
    isSignalHighlighted = enabled;
    applySignalHighlight();
  }

  function applySignalHighlight() {
    const scaleFactor = isSignalHighlighted ? 1.45 : 1.0;
    poleNear.scale.set(scaleFactor, scaleFactor, scaleFactor);
    poleFar.scale.set(scaleFactor, scaleFactor, scaleFactor);

    haloNear.visible = isSignalHighlighted;
    haloFar.visible = isSignalHighlighted;
  }

  function updateRoadGeometry() {
    roadMesh.geometry.dispose();
    roadMesh.geometry = new THREE.PlaneGeometry(160, roadDepth);

    const halfDepth = roadDepth * 0.5;
    sidewalkNear.position.set(0, 0.005, halfDepth + 1.25);
    sidewalkFar.position.set(0, 0.005, -(halfDepth + 1.25));

    const laneOffset = halfDepth * 0.5;
    stopLineNear.position.set(3.2, 0.02, laneOffset);
    stopLineFar.position.set(-3.2, 0.02, -laneOffset);

    while (crosswalkGroup.children.length > 0) {
      crosswalkGroup.remove(crosswalkGroup.children[0]);
    }
    const numStripes = Math.max(3, Math.floor(roadDepth / 0.85));
    const step = (roadDepth - 0.6) / numStripes;
    for (let i = 0; i <= numStripes; i++) {
      const z = -halfDepth + 0.3 + i * step;
      const stripe = new THREE.Mesh(
        new THREE.PlaneGeometry(crosswalkHalfWidth * 2.0, 0.42),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.02, z);
      crosswalkGroup.add(stripe);
    }

    poleFar.position.set(2.6, 0, -(halfDepth + 0.9));
    poleNear.position.set(-2.6, 0, halfDepth + 0.9);
  }

  function changeBackgroundDim(val) {
    dimDome.material.opacity = parseFloat(val) / 100.0;
    document.getElementById('dim-label').innerText = `${val}%`;
  }

  function toggleUIVisibility() {
    if (isUIHidden) showUI();
    else hideUI();
  }

  function hideUI() {
    isUIHidden = true;
    document.getElementById('main-panel').style.display = 'none';
    const btn = document.getElementById('btn-toggle-ui');
    btn.innerText = 'UI表示';
    btn.style.background = 'rgba(0, 0, 0, 0.4)';
  }

  function showUI() {
    isUIHidden = false;
    document.getElementById('main-panel').style.display = 'flex';
    const btn = document.getElementById('btn-toggle-ui');
    btn.innerText = 'UIを隠す';
    btn.style.background = 'rgba(0, 0, 0, 0.75)';
  }

  function resetCheckState() {
    checkedLeft = false;
    checkedRight = false;
    isCrossing = false;
    wasHonked = false;

    const bL = document.getElementById('badge-left');
    const bR = document.getElementById('badge-right');
    bL.className = 'status-badge';
    bL.innerText = '左未確認';
    bR.className = 'status-badge';
    bR.innerText = '右未確認';
  }

  function resetSignalCycle() {
    signalTimer = 0;
    isGreenLight = false;
    isBlinking = false;
    updateSignalLamps();
  }

  function createPedestrianCanvas(type, isOn) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, 128, 128);

    const mainColor = isOn 
      ? (type === 'red' ? '#ff2200' : '#00e676') 
      : (type === 'red' ? '#330800' : '#002611');

    ctx.fillStyle = mainColor;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';

    if (type === 'red') {
      ctx.beginPath();
      ctx.arc(64, 30, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(64, 46);
      ctx.lineTo(64, 82);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(48, 54);
      ctx.lineTo(80, 54);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(56, 114);
      ctx.lineTo(60, 82);
      ctx.lineTo(68, 82);
      ctx.lineTo(72, 114);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(70, 28, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(68, 44);
      ctx.lineTo(60, 78);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(44, 62);
      ctx.lineTo(66, 50);
      ctx.lineTo(84, 62);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(40, 112);
      ctx.lineTo(54, 86);
      ctx.lineTo(60, 78);
      ctx.lineTo(74, 94);
      ctx.lineTo(88, 112);
      ctx.stroke();
    }

    return new THREE.CanvasTexture(canvas);
  }

  function generateSignalTextures() {
    redTexOn = createPedestrianCanvas('red', true);
    redTexOff = createPedestrianCanvas('red', false);
    greenTexOn = createPedestrianCanvas('green', true);
    greenTexOff = createPedestrianCanvas('green', false);
  }

  function buildEnvironment() {
    const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x78909c, transparent: true, opacity: 0.85 });

    sidewalkNear = new THREE.Mesh(new THREE.PlaneGeometry(160, 2.5), sidewalkMat);
    sidewalkNear.rotation.x = -Math.PI / 2;
    roadAnchor.add(sidewalkNear);

    sidewalkFar = new THREE.Mesh(new THREE.PlaneGeometry(160, 2.5), sidewalkMat);
    sidewalkFar.rotation.x = -Math.PI / 2;
    roadAnchor.add(sidewalkFar);

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x263238, transparent: true, opacity: 0.92 });
    roadMesh = new THREE.Mesh(new THREE.PlaneGeometry(160, roadDepth), roadMat);
    roadMesh.rotation.x = -Math.PI / 2;
    roadMesh.position.set(0, 0.01, 0);
    roadAnchor.add(roadMesh);

    centerLineGroup = new THREE.Group();
    for (let x = -75; x < 80; x += 8) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.015, 0);
      centerLineGroup.add(line);
    }
    roadAnchor.add(centerLineGroup);

    crosswalkGroup = new THREE.Group();
    roadAnchor.add(crosswalkGroup);

    const stopMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    stopLineNear = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLineNear.rotation.x = -Math.PI / 2;
    roadAnchor.add(stopLineNear);

    stopLineFar = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3.2), stopMat);
    stopLineFar.rotation.x = -Math.PI / 2;
    roadAnchor.add(stopLineFar);

    updateRoadGeometry();
  }

  function createSignalUnit(facingAngle) {
    const group = new THREE.Group();

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 3.2),
      new THREE.MeshLambertMaterial({ color: 0x546e7a })
    );
    pole.position.y = 1.6;
    group.add(pole);

    const head = new THREE.Group();
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 1.1, 0.26),
      new THREE.MeshLambertMaterial({ color: 0x212121 })
    );
    box.position.set(0, 2.3, 0);
    head.add(box);

    const visorMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
    const topVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    topVisor.position.set(0, 2.7, 0.16);
    topVisor.rotation.x = 0.2;
    head.add(topVisor);

    const midVisor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.2), visorMat);
    midVisor.position.set(0, 2.23, 0.16);
    midVisor.rotation.x = 0.2;
    head.add(midVisor);

    const lampGeo = new THREE.PlaneGeometry(0.42, 0.42);
    const redLamp = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: redTexOn, transparent: true }));
    redLamp.position.set(0, 2.52, 0.135);
    head.add(redLamp);

    const greenLamp = new THREE.Mesh(lampGeo, new THREE.MeshBasicMaterial({ map: greenTexOff, transparent: true }));
    greenLamp.position.set(0, 2.05, 0.135);
    head.add(greenLamp);

    const haloGeo = new THREE.RingGeometry(0.55, 0.72, 32);
    const haloMat = new THREE.MeshBasicMaterial({
      color: 0xffeb3b,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide
    });
    const halo = new THREE.Mesh(haloGeo, haloMat);
    halo.position.set(0, 2.3, 0.14);
    head.add(halo);

    head.rotation.y = facingAngle;
    group.add(head);

    return { group, redLamp, greenLamp, halo };
  }

  function createPedestrianSignals() {
    const farUnit = createSignalUnit(0);
    poleFar = farUnit.group;
    redLampFar = farUnit.redLamp;
    greenLampFar = farUnit.greenLamp;
    haloFar = farUnit.halo;
    roadAnchor.add(poleFar);

    const nearUnit = createSignalUnit(Math.PI);
    poleNear = nearUnit.group;
    redLampNear = nearUnit.redLamp;
    greenLampNear = nearUnit.greenLamp;
    haloNear = nearUnit.halo;
    roadAnchor.add(poleNear);

    applySignalHighlight();
    updateRoadGeometry();
  }

  // 端末の首振りによる左右確認
  function setChecked(side) {
    if (side === 'left' && !checkedLeft) {
      checkedLeft = true;
      const b = document.getElementById('badge-left');
      b.className = 'status-badge checked';
      b.innerText = '左確認済';
    } else if (side === 'right' && !checkedRight) {
      checkedRight = true;
      const b = document.getElementById('badge-right');
      b.className = 'status-badge checked';
      b.innerText = '右確認済';
    }
  }

  function createCarMesh(direction) {
    const carGroup = new THREE.Group();
    const colors = [0xd32f2f, 0x1976d2, 0xfbc02d, 0x388e3c, 0xf5f5f5, 0x333333];
    const color = colors[Math.floor(Math.random() * colors.length)];

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(4.0, 0.88, 1.68),
      new THREE.MeshLambertMaterial({ color })
    );
    body.position.y = 0.54;
    carGroup.add(body);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.64, 1.48),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    roof.position.set(-0.24 * direction, 1.22, 0);
    carGroup.add(roof);
    return carGroup;
  }

  function spawnCarAt(xPos, isNearLane) {
    const direction = isNearLane ? -1 : 1;
    const laneOffset = (roadDepth * 0.5) * 0.5;
    const zPos = isNearLane ? laneOffset : -laneOffset;

    const conf = diffConfigs[difficulty];
    const baseSpeed = conf.speedMin + Math.random() * (conf.speedMax - conf.speedMin);

    const carGroup = createCarMesh(direction);
    carGroup.position.set(xPos, 0, zPos);
    roadAnchor.add(carGroup);

    cars.push({
      mesh: carGroup,
      isNearLane: isNearLane,
      direction: direction,
      baseSpeed: baseSpeed,
      currentSpeed: baseSpeed,
      hasHonked: false
    });
  }

  function spawnCar() {
    const isNearLane = Math.random() > 0.5;
    const spawnX = isNearLane ? 75 : -75;

    const tooClose = cars.some(c => c.isNearLane === isNearLane && Math.abs(c.mesh.position.x - spawnX) < 22);
    if (tooClose) return;

    spawnCarAt(spawnX, isNearLane);
  }

  function updateCars(localPlayerPos) {
    const conf = diffConfigs[difficulty];
    trafficTimer += 0.016;

    // 安全時間窓（車が途切れるギャップ）の制御
    if (!isClearPhase) {
      if (trafficTimer >= conf.trafficDuration) {
        trafficTimer = 0;
        isClearPhase = true; // 車の来ない安全な時間へ
      } else {
        if (Math.random() < conf.spawnProb && cars.length < conf.maxCars) {
          spawnCar();
        }
      }
    } else {
      if (trafficTimer >= conf.clearDuration) {
        trafficTimer = 0;
        isClearPhase = false; // 再び交通流へ
      }
    }

    const carMustStopForSignal = (currentMode === 'signal' && isGreenLight);

    for (let i = cars.length - 1; i >= 0; i--) {
      const car = cars[i];
      let targetSpeed = car.baseSpeed;

      if (carMustStopForSignal) {
        if (car.isNearLane) {
          const stopTargetX = 5.4;
          if (car.mesh.position.x >= stopTargetX) {
            const dist = car.mesh.position.x - stopTargetX;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) {
                targetSpeed = 0;
                car.currentSpeed = 0;
                car.mesh.position.x = stopTargetX;
              }
            }
          }
        } else {
          const stopTargetX = -5.4;
          if (car.mesh.position.x <= stopTargetX) {
            const dist = stopTargetX - car.mesh.position.x;
            if (dist < 28) {
              targetSpeed = THREE.MathUtils.lerp(0, car.baseSpeed, Math.min(1, dist / 18));
              if (dist < 0.2) {
                targetSpeed = 0;
                car.currentSpeed = 0;
                car.mesh.position.x = stopTargetX;
              }
            }
          }
        }
      }

      for (let j = 0; j < cars.length; j++) {
        if (i === j) continue;
        const other = cars[j];
        if (car.isNearLane === other.isNearLane) {
          if (car.direction === -1) {
            const gap = car.mesh.position.x - other.mesh.position.x;
            if (gap > 0 && gap < 11.0) {
              const factor = Math.max(0, (gap - 4.8) / 6.2);
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= 5.0) {
                targetSpeed = 0;
                car.currentSpeed = 0;
              }
            }
          } else {
            const gap = other.mesh.position.x - car.mesh.position.x;
            if (gap > 0 && gap < 11.0) {
              const factor = Math.max(0, (gap - 4.8) / 6.2);
              targetSpeed = Math.min(targetSpeed, other.currentSpeed * factor);
              if (gap <= 5.0) {
                targetSpeed = 0;
                car.currentSpeed = 0;
              }
            }
          }
        }
      }

      // 直前急停止＋クラクション
      if (isCrossing && !isCooldown) {
        const dx = Math.abs(car.mesh.position.x - localPlayerPos.x);
        const dz = Math.abs(car.mesh.position.z - localPlayerPos.z);

        const isHeadingToPlayer = (car.direction === -1 && car.mesh.position.x > localPlayerPos.x) ||
                                  (car.direction === 1 && car.mesh.position.x < localPlayerPos.x);

        if (isHeadingToPlayer && dx < 5.8 && dz < 1.6) {
          targetSpeed = 0;
          car.currentSpeed = 0;
          if (!car.hasHonked) {
            playHorn();
            car.hasHonked = true;
            wasHonked = true;
            triggerImmediateViolation();
          }
        }
      }

      car.currentSpeed += (targetSpeed - car.currentSpeed) * 0.15;
      car.mesh.position.x += car.currentSpeed * car.direction;

      if (Math.abs(car.mesh.position.x) > 85) {
        roadAnchor.remove(car.mesh);
        cars.splice(i, 1);
        continue;
      }
    }
  }

  function updateSignal() {
    if (currentMode !== 'signal') return;

    const conf = diffConfigs[difficulty];
    signalTimer += 0.016;

    const totalCycle = conf.redDur + conf.greenDur;
    if (signalTimer >= totalCycle) signalTimer = 0;

    isGreenLight = (signalTimer >= conf.redDur);
    const greenTimeLeft = totalCycle - signalTimer;
    isBlinking = isGreenLight && (greenTimeLeft <= blinkDuration);

    updateSignalLamps();

    if (isSignalHighlighted) {
      const pulse = 1.0 + Math.sin(signalTimer * 8.0) * 0.18;
      haloNear.scale.set(pulse, pulse, 1.0);
      haloFar.scale.set(pulse, pulse, 1.0);
    }
  }

  function updateSignalLamps() {
    const redMap = isGreenLight ? redTexOff : redTexOn;
    let greenMap = greenTexOff;

    if (isGreenLight) {
      if (isBlinking) {
        const blinkState = Math.floor(signalTimer * 4) % 2 === 0;
        greenMap = blinkState ? greenTexOn : greenTexOff;
      } else {
        greenMap = greenTexOn;
      }
    }

    redLampNear.material.map = redMap;
    greenLampNear.material.map = greenMap;
    redLampFar.material.map = redMap;
    greenLampFar.material.map = greenMap;
  }

  function triggerImmediateViolation() {
    if (isCooldown) return;
    isCooldown = true;
    flashScreen('#ff1744', 900); // 違反時は即座に赤色発光

    setTimeout(() => {
      resetCheckState();
      isCooldown = false;
    }, 1800);
  }

  function triggerSuccess() {
    isCooldown = true;
    flashScreen('#00e676', 900); // 成功時は緑色発光

    currentSide = (currentSide === 'near') ? 'far' : 'near';

    setTimeout(() => {
      resetCheckState();
      isCooldown = false;
    }, 1800);
  }

  function renderLoop(timestamp, frame) {
    if (renderer.xr.isPresenting) {
      const session = renderer.xr.getSession();
      dimDome.position.copy(camera.position);

      // 提示コードと完全に同一のヒットテスト取得処理
      if (!hitTestSourceRequested) {
        session.requestReferenceSpace('viewer').then((referenceSpace) => {
          session.requestHitTestSource({ space: referenceSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        hitTestSourceRequested = true;
      }

      // 未配置時：床面検出結果を緑の輪に反映
      if (hitTestSource && !isPlaced) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }

      // 配置後かつスタート後
      if (isPlaced && isRunning) {
        updateSignal();

        const camWorldPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
        const localPlayerPos = roadAnchor.worldToLocal(camWorldPos.clone());

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        const localDir = camDir.clone().transformDirection(new THREE.Matrix4().copy(roadAnchor.matrixWorld).invert());

        // 首振り判定
        if (currentSide === 'near') {
          if (localDir.x < -0.55) setChecked('left');
          else if (localDir.x > 0.55) setChecked('right');
        } else {
          if (localDir.x > 0.55) setChecked('left');
          else if (localDir.x < -0.55) setChecked('right');
        }

        const halfDepth = roadDepth * 0.5;

        const isEnteringRoad = (currentSide === 'near' && localPlayerPos.z < halfDepth && localPlayerPos.z > -halfDepth) ||
                               (currentSide === 'far' && localPlayerPos.z > -halfDepth && localPlayerPos.z < halfDepth);

        if (isEnteringRoad && !isCooldown) {
          // 横断歩道外の進入判定
          if (Math.abs(localPlayerPos.x) > crosswalkHalfWidth) {
            triggerImmediateViolation();
            return;
          }

          // 赤信号進入判定
          if (currentMode === 'signal' && !isGreenLight) {
            triggerImmediateViolation();
            return;
          }

          if (!isCrossing) {
            isCrossing = true;
          }
        }

        updateCars(localPlayerPos);

        // 対岸到達判定
        if (isCrossing && !isCooldown) {
          let reached = false;
          if (currentSide === 'near' && localPlayerPos.z <= -halfDepth) {
            reached = true;
          } else if (currentSide === 'far' && localPlayerPos.z >= halfDepth) {
            reached = true;
          }

          if (reached) {
            if (currentMode === 'signal') {
              if (wasHonked) {
                triggerImmediateViolation();
              } else {
                triggerSuccess();
              }
            } else {
              if (!checkedLeft || !checkedRight || wasHonked) {
                triggerImmediateViolation();
              } else {
                triggerSuccess();
              }
            }
          }
        }
      }
    }

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
